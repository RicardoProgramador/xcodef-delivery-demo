tendeu`],correcoes:[]},{version:`0.6.0`,date:`2026-08-25`,titulo:`Clientes (CRM) e o robô cuidando também de quem já pediu`,melhorias:[`TELA CLIENTES: a ficha de cada cliente se monta sozinha — telefone, endereços que já usou, como costuma pagar, o que mais pede, quantos pedidos, quanto já gastou, ticket médio, cancelados e há quantos dias não compra`,`Resumo no alto: faturamento por cliente, quantos voltaram a comprar e quantos sumiram há mais de 15 dias (para chamar de volta)`,`Quem só conversou pelo WhatsApp, sem comprar, também vira ficha — é cliente em potencial`,`Botão para copiar todos os clientes para a planilha`,`PÓS-VENDA PELO ROBÔ: quem já tem pedido em andamento agora é atendido também — "quanto tempo falta?" responde o estado real do pedido; "manda troco pra R$ 100" anota o troco no cartão; "tira a cebola" vira recado para a cozinha (se ainda der tempo); "me liga quando chegar" vira observação para o entregador`,`Mais conversas chegando (uma a cada ~5 minutos) para dar para acompanhar o atendente trabalhando de verdade`],correcoes:[`Conversa sobre um pedido em andamento nascia no meio ("manda troco pra R$ 100", sem contexto) e ficava PARADA, porque ia direto para uma pessoa. Agora abre como gente abre ("Oi! É sobre o pedido #1204 — …") e o atendente responde na hora`,`Pedido de ajuste em pedido que já saiu da cozinha passa para uma pessoa em vez de prometer o que não dá`]},{version:`0.5.0`,date:`2026-08-25`,titulo:`Atendente automático do WhatsApp: vende sozinho`,melhorias:[`O ROBÔ ATENDE E VENDE: lê a mensagem do cliente, entende o que é do cardápio, pergunta quando fica em dúvida ("é a Marmita P ou a G?"), combina entrega ou retirada, endereço, pagamento — e REGISTRA o pedido sozinho na esteira de produção`,`Fala como gente: frases curtas, informais e variadas — nunca repete a mesma frase na mesma conversa (são vários jeitos de dizer cada coisa)`,`Responde já no primeiro contato, com saudação sorteada, e conduz o cliente até fechar`,`Pagamento completo: pix (manda a CHAVE DA LOJA e espera o comprovante antes de mandar para a cozinha), cartão (avisa que o motoboy leva a maquininha) e dinheiro (pergunta se precisa de troco e para quanto — o valor vai no cartão do pedido)`,`O cliente pode MUDAR O PEDIDO no meio da conversa: acrescentar item, tirar item, ou desistir — tudo aparece na conversa e o total se ajusta`,`Travas de segurança: acima do valor máximo configurado ele não fecha sozinho; reclamação, pedido de falar com uma pessoa ou item fora do cardápio passam a conversa para o balcão na hora`,`Na tela do WhatsApp: selo 🤖 nas falas do robô, quadro com "o que o atendente já entendeu" (itens e total) e botões "Assumir conversa" / "Devolver ao atendente"`,`Três modos nas Configurações: só sugerir a resposta, conversar sozinho, ou conversar e registrar — com demora de resposta e nome de apresentação ajustáveis`,`Pedido fechado pelo robô nasce com o selo "🤖 fechado pelo atendente" no quadro`,`A tela "Parâmetros" passou a se chamar "Configurações"`],correcoes:[`O robô apagava o pedido quando o cliente escrevia "retirada" (a palavra contém "tira", que ele lia como "tirar item") — comparação agora é por palavra inteira`,`Resposta de pagamento com "troco p/ R$ 100" era lida como o prato "Marmita P" e travava a conversa em laço`]},{version:`0.4.3`,date:`2026-08-25`,titulo:`Correções de conta no pedido manual`,melhorias:[`Revisão automática do código encontrou e travou com teste três erros de conta antes que chegassem na loja`],correcoes:[`RECUPERAR VENDA: ao tocar num prato do cardápio, o valor do pedido cancelado era apagado e a loja cobraria só o item tocado (um pedido de R$ 67,80 virava R$ 7,00). Agora o valor que veio pronto é preservado, com o botão "usar este total" quando você quiser a soma do cardápio`,`O texto avulso deixou de virar um item de R$ 0,00 quando não sobra valor — nesse caso ele entra como observação do pedido (a cozinha via um prato para produzir de graça)`,`Colar do Excel com as colunas de preço vazias no fim voltou a limpar os ajustes por canal (o item volta a herdar o preço global)`,`O pedido com itens do cardápio agora chega inteiro ao programa da loja (a lista de pratos estava sendo descartada na entrada)`]},{version:`0.4.2`,date:`2026-08-24`,titulo:`WhatsApp e balcão com cardápio próprio`,melhorias:[`O WhatsApp/balcão virou canal de venda como os outros no Cardápio: aba própria, herdando o global até você dar um preço só dele — útil porque o canal próprio não paga comissão e pode sair mais barato`,`Canal próprio não pede publicação: o preço vale na hora (a barra de publicação continua só para iFood, Keeta e 99Food)`,`NO PEDIDO WHATSAPP/BALCÃO: o cardápio de hoje aparece em botões — um toque põe o prato, com quantidade no + e −, e o TOTAL É SOMADO SOZINHO com o preço do canal`,`O total continua editável para desconto ou combinado com o cliente, com o botão "usar este total" para voltar à soma do cardápio`,`O que estiver fora do cardápio continua como texto avulso, na mesma tela`,`O pedido nasce com os itens de verdade (nome, quantidade e preço), e não mais uma linha de texto — o fechamento do dia fica correto`,`Planilha do cardápio ganhou a coluna preco_whatsapp (exporta e importa junto com as outras)`,`Transferências valem para o canal próprio: dá para copiar o global para o WhatsApp, ou promover os preços do WhatsApp ao global`],correcoes:[]},{version:`0.4.1`,date:`2026-08-24`,titulo:`Dois computadores, os mesmos pedidos`,melhorias:[`Os pedidos novos da simulação agora seguem o RELÓGIO com semente fixa: dois computadores com a página aberta veem os MESMOS pedidos, conversas e cancelamentos chegando nos mesmos minutos — sem servidor e sem conta`,`Vale para demonstrar por telefone: "olha o pedido que acabou de tocar" é o mesmo número, mesmo prato e mesmo cliente nas duas telas`,`O que continua individual em cada tela (de propósito): os cliques de cada um (aceitar, pronto, entregar), o quadro de abertura e os pedidos digitados à mão — no aplicativo real da loja, as telas são espelhadas de verdade pela rede, como o modo 4 telas mostra`,`Números de pedido da agenda derivados do horário (não se repetem no dia e não conflitam com os do quadro de abertura)`],correcoes:[]},{version:`0.4.0`,date:`2026-08-24`,titulo:`Gerenciador de cardápios e rotas com coerência`,melhorias:[`CARDÁPIO POR DIA: cada item marca em quais dias da semana vale (filtro "Hoje"); pedido novo da simulação só traz prato do dia, com o preço do canal`,`Transferir/importar cardápio: importar DA plataforma para o global (item que só existe lá é criado, preço defasado é atualizado) e copiar entre global ↔ plataformas com um clique`,`Carga em lote: cole direto do Excel/planilha ou envie arquivo; exportar no mesmo formato para editar fora e trazer de volta`,`Fotos dos pratos com leitura automática: na simulação pelo nome do arquivo (declarado na tela); no aplicativo instalado, por inteligência artificial de visão que reconhece o prato pela imagem`,`Busca, filtro por categoria, criar e remover item direto na tela do Cardápio`,`ROTAS COERENTES: uma loja por rota (coleta num lugar só), bairros vizinhos juntos e na ordem geográfica, máximo de entregas por viagem nos Parâmetros`,`Bairro LONGE segura a rota: só solta com o mínimo de entregas juntas ou após a espera máxima — nada de viagem atravessando a cidade por 1 pedido`,`Pedido de bairro longe com rota juntando ganha o selo "🚀 ADIANTAR" na cozinha e sobe na coluna — sai na mesma viagem do motoboy`,`Escolha automática do motoboy: o LIVRE com MENOS entregas hoje (revezamento justo, contagem visível); a troca manual continua valendo`,`Link do Google Maps agora parte do endereço da loja com as paradas na ordem`],correcoes:[]},{version:`0.3.8`,date:`2026-08-24`,titulo:`Retirada no balcão de ponta a ponta`,melhorias:[`No pedido WhatsApp/balcão, escolha em destaque "Como o cliente recebe?": 🛵 Entrega ou 🛍️ Retirada no balcão (o endereço some e a cobrança vira "Cobrar na retirada")`,`Pedido pronto de retirada ganhou o botão "🛍️ Retirado ✓" no caixa e no gestor — conclui na hora, sem passar pela etapa de entrega`,`Cartão com selo roxo "🛍️ RETIRADA NO BALCÃO" e detalhe do pedido indicando que o cliente vem buscar`,`Cliente do WhatsApp também combina retirada na conversa — "Converter em pedido" já vem com 🛍️ marcado (conversa do Roberto Lima na simulação)`,`Tela da cozinha mostra "no balcão — cliente vem retirar" quando o pedido de retirada fica pronto; a tela dos entregadores não recebe retiradas`,`Exemplo pronto ao abrir a simulação (Cláudia Nunes, cobrar na retirada) para testar o botão`],correcoes:[`A opção de retirada existia escondida numa caixinha pequena do formulário — fácil de passar despercebida`,`Título das janelas (detalhe do pedido, novo pedido, histórico) estava branco sobre branco — invisível`]},{version:`0.3.7`,date:`2026-08-24`,titulo:`Recuperar venda só no canal próprio (WhatsApp)`,melhorias:[`"Recuperar venda" agora aparece SOMENTE em pedido cancelado do WhatsApp — o cliente das plataformas é relacionamento delas (contato direto para fechar por fora pode gerar punição)`,`Pedido cancelado das plataformas fica com "Ciente" (arquivar); a trava vale na tela e no motor`],correcoes:[]},{version:`0.3.6`,date:`2026-08-24`,titulo:`Rodapé por função e cadastro de lojas`,melhorias:[`Rodapé repensado por tela: cozinha vê "para começar / em produção / prontos / recados sem resposta / preparo médio"; entregadores veem "prontos p/ rota / em rota / levar em cobranças / rotas sem motoboy"; caixa vê fila, aceite médio, a receber na entrega, mensagens não lidas e concluídos; gestor vê o consolidado com faturamento`,`Lojas parametrizáveis: botão "Adicionar loja (CNPJ)" na aba Lojas dos Parâmetros — a loja nova entra automaticamente nas conexões das plataformas, no pedido WhatsApp e no fechamento`,`Remoção de loja com confirmação em dois toques; pedidos antigos permanecem no histórico; a última loja não pode ser removida`],correcoes:[]},{version:`0.3.5`,date:`2026-08-24`,titulo:`Corrigir clique errado: Desfazer e Movimentos de hoje`,melhorias:[`Ao avançar um pedido, aparece "↩ Desfazer" por 8 segundos — o erro percebido na hora se resolve com um toque, sem chamar o gestor`,`Botão "↩ Movimentos" em todas as telas: lista só os pedidos movimentados hoje (o mais recente no topo) com "Voltar etapa"`,`Cada perfil vê apenas os movimentos do seu tipo (cozinha: preparo/pronto; entregadores: saiu/entregue); o gestor vê tudo e pode voltar qualquer pedido, até concluído/arquivado`,`Toda correção fica registrada na linha do tempo do pedido ("etapa voltada: Pronto → Em preparo")`,`Regra de honestidade: o quadro interno volta, mas a plataforma não desfaz o que já recebeu — aceite e cancelamento não voltam`],correcoes:[]},{version:`0.3.4`,date:`2026-08-24`,titulo:`Escolher para qual tela voltar`,melhorias:[`No modo 4 telas, cada quadro ganhou o botão "⤢ ampliar": abre a tela daquele funcionário em tamanho cheio`,`Ao voltar para 1 tela, o painel abre no perfil escolhido — não volta mais sempre para o gerencial`,`Recado para a cozinha com botões de sugestão de texto (um toque preenche; dá para combinar e editar antes de enviar)`],correcoes:[]},{version:`0.3.3`,date:`2026-08-24`,titulo:`Comunicação caixa ↔ cozinha com confirmação OK/NOK`,melhorias:[`Recado do caixa chega PISCANDO no cartão da tela da cozinha, com aviso sonoro repetido até a resposta`,`Cozinha responde com um toque em opções pré-cadastradas: ENTENDIDO, AJUSTADO, DÁ SIM / NÃO DÁ, ITEM EM FALTA, VAI ATRASAR`,`A resposta volta ao cartão do caixa e do gestor como selo verde OK ou vermelho NOK, com o texto escolhido`,`Aviso sonoro no caixa quando a resposta chega (toque duplo quando é NOK)`,`Detalhe do pedido mostra a situação do recado: aguardando, OK ou NOK`],correcoes:[]},{version:`0.3.2`,date:`2026-08-24`,titulo:`Identidade do app, histórico de versões e modo 4 telas`,melhorias:[`Nome do aplicativo (xcodef-delivery) e versão visíveis no topo e no rodapé`,`Clique na versão abre este histórico de melhorias e correções`,`Histórico permanente: gravado no repositório e embutido em todas as versões publicadas`,`Modo 4 telas: gestor, caixa, cozinha e entregadores lado a lado, sincronizados em tempo real — aja numa tela e veja as outras reagirem`,`No sistema real da loja cada monitor abre o painel pela rede e escolhe seu perfil — a sincronização entre telas é nativa`],correcoes:[]},{version:`0.3.1`,date:`2026-08-24`,titulo:`Cliente do WhatsApp interage até fechar a venda`,melhorias:[`Cliente simulado responde à loja: confirma itens, informa endereço, escolhe pagamento e pede para registrar`,`"Converter em pedido" já vem preenchido com o que o cliente disse na conversa`,`Cliente agradece após o pedido registrado; conversas ligadas a pedido também respondem`,`Teste automatizado do fluxo de conversa rodando a cada entrega`],correcoes:[`Conversas não ficavam mais mudas após a resposta da loja`]},{version:`0.3.0`,date:`2026-08-24`,titulo:`Parâmetros completos, perfis de monitor e novas telas`,melhorias:[`Painel de Parametrizações com a hierarquia do produto: específico da plataforma → global ("herdar do global")`,`Conexão por plataforma: iFood (clientId/secret + lojas), Keeta (conta MARCA), 99Food (AppShopID por loja), WhatsApp (pareamento por QR)`,`Cadastro completo por loja: razão social, CNPJ, inscrição estadual, endereço, telefones, logo, cor e horários`,`Aceite automático com espera e trava de capacidade; iniciar preparo junto com o aceite; modos de entrega por canal`,`Perfis de monitor: Gestor, Caixa, Cozinha e Entregadores — cada tela com suas colunas e botões; concluídos só no gestor`,`WhatsApp como canal de venda na mesma esteira: conversas, respostas rápidas e conversão em pedido`,`Selo 💬 com som no cartão quando o cliente manda mensagem sobre o pedido; recado para a cozinha; "Falar com o cliente"`,`Cardápio global + ajustes por plataforma, reajuste % em lote e publicação por canal`,`Entregas: motoboys, rotas agrupadas por bairro e link do Google Maps com as paradas na ordem`,`Fechamento diário e mensal com exportação CSV no contrato do ERP`,`Rodapé funcional: fila ao vivo, tempo médio de aceite, próximo agendado, sincronização, conexões e faturamento (gestor)`],correcoes:[`Botão de som virou alternância fixa (não desaparece mais) com preferência lembrada`,`Recuperar venda passou a ser operação única: trava de duplicidade e o cancelado sai do quadro sozinho`,`Pedidos do WhatsApp não sofrem mais cancelamento aleatório na simulação`]},{version:`0.2.1`,date:`2026-08-24`,titulo:`Destinos para retirada pronta e pedidos cancelados`,melhorias:[`Retirada pronta ganhou o botão "Cliente retirou" (concluía e não entupia mais a coluna Prontos)`,`Cancelados com destinos: "Ciente" (arquiva, mantém no histórico) e "Recuperar venda" (vira pedido WhatsApp sem comissão)`,`Motivo e autor do cancelamento visíveis no cartão`,`Textos de espera contextuais: "aguardando coleta do entregador…", "entregador levando ao cliente…"`],correcoes:[`Pedido agendado não mostrava mais a contagem regressiva de aceite imediato`]},{version:`0.2.0`,date:`2026-08-24`,titulo:`Simulação completa no ar`,melhorias:[`Painel kanban único das 3 lojas × 3 plataformas + WhatsApp, publicado num link permanente para testar sem instalar nada`,`Alarme sonoro em loop até aceitar, com escalada e prazo de aceite por pedido (cancelamento automático ao estourar)`,`Fluxo completo do operador com ida e volta simulada às plataformas ("sincronizando…" → confirmado)`,`Entrada manual de pedido WhatsApp/balcão`,`Destaque "COBRAR na entrega" com troco; entregador da plataforma coleta sozinho`],correcoes:[]},{version:`0.1.0`,date:`2026-08-23`,titulo:`Fundação: pesquisa verificada, arquitetura e núcleo`,melhorias:[`Pesquisa com fontes oficiais: iFood, Keeta e 99Food convergem no mesmo desenho de integração (polling + confirmação)`,`Arquitetura fechada: modelo canônico Open Delivery, adaptadores por plataforma, tabela mestra de status`,`Decisão de stack: Electron + TypeScript, com alarme sob
