; a trava vale na tela e no motor`],correcoes:[]},{version:`0.3.6`,date:`2026-08-24`,titulo:`Rodapé por função e cadastro de lojas`,melhorias:[`Rodapé repensado por tela: cozinha vê "para começar / em produção / prontos / recados sem resposta / preparo médio"; entregadores veem "prontos p/ rota / em rota / levar em cobranças / rotas sem motoboy"; caixa vê fila, aceite médio, a receber na entrega, mensagens não lidas e concluídos; gestor vê o consolidado com faturamento`,`Lojas parametrizáveis: botão "Adicionar loja (CNPJ)" na aba Lojas dos Parâmetros — a loja nova entra automaticamente nas conexões das plataformas, no pedido WhatsApp e no fechamento`,`Remoção de loja com confirmação em dois toques; pedidos antigos permanecem no histórico; a última loja não pode ser removida`],correcoes:[]},{version:`0.3.5`,date:`2026-08-24`,titulo:`Corrigir clique errado: Desfazer e Movimentos de hoje`,melhorias:[`Ao avançar um pedido, aparece "↩ Desfazer" por 8 segundos — o erro percebido na hora se resolve com um toque, sem chamar o gestor`,`Botão "↩ Movimentos" em todas as telas: lista só os pedidos movimentados hoje (o mais recente no topo) com "Voltar etapa"`,`Cada perfil vê apenas os movimentos do seu tipo (cozinha: preparo/pronto; entregadores: saiu/entregue); o gestor vê tudo e pode voltar qualquer pedido, até concluído/arquivado`,`Toda correção fica registrada na linha do tempo do pedido ("etapa voltada: Pronto → Em preparo")`,`Regra de honestidade: o quadro interno volta, mas a plataforma não desfaz o que já recebeu — aceite e cancelamento não voltam`],correcoes:[]},{version:`0.3.4`,date:`2026-08-24`,titulo:`Escolher para qual tela voltar`,melhorias:[`No modo 4 telas, cada quadro ganhou o botão "⤢ ampliar": abre a tela daquele funcionário em tamanho cheio`,`Ao voltar para 1 tela, o painel abre no perfil escolhido — não volta mais sempre para o gerencial`,`Recado para a cozinha com botões de sugestão de texto (um toque preenche; dá para combinar e editar antes de enviar)`],correcoes:[]},{version:`0.3.3`,date:`2026-08-24`,titulo:`Comunicação caixa ↔ cozinha com confirmação OK/NOK`,melhorias:[`Recado do caixa chega PISCANDO no cartão da tela da cozinha, com aviso sonoro repetido até a resposta`,`Cozinha responde com um toque em opções pré-cadastradas: ENTENDIDO, AJUSTADO, DÁ SIM / NÃO DÁ, ITEM EM FALTA, VAI ATRASAR`,`A resposta volta ao cartão do caixa e do gestor como selo verde OK ou vermelho NOK, com o texto escolhido`,`Aviso sonoro no caixa quando a resposta chega (toque duplo quando é NOK)`,`Detalhe do pedido mostra a situação do recado: aguardando, OK ou NOK`],correcoes:[]},{version:`0.3.2`,date:`2026-08-24`,titulo:`Identidade do app, histórico de versões e modo 4 telas`,melhorias:[`Nome do aplicativo (xcodef-delivery) e versão visíveis no topo e no rodapé`,`Clique na versão abre este histórico de melhorias e correções`,`Histórico permanente: gravado no repositório e embutido em todas as versões publicadas`,`Modo 4 telas: gestor, caixa, cozinha e entregadores lado a lado, sincronizados em tempo real — aja numa tela e veja as outras reagirem`,`No sistema real da loja cada monitor abre o painel pela rede e escolhe seu perfil — a sincronização entre telas é nativa`],correcoes:[]},{version:`0.3.1`,date:`2026-08-24`,titulo:`Cliente do WhatsApp interage até fechar a venda`,melhorias:[`Cliente simulado responde à loja: confirma itens, informa endereço, escolhe pagamento e pede para registrar`,`"Converter em pedido" já vem preenchido com o que o cliente disse na conversa`,`Cliente agradece após o pedido registrado; conversas ligadas a pedido também respondem`,`Teste automatizado do fluxo de conversa rodando a cada entrega`],correcoes:[`Conversas não ficavam mais mudas após a resposta da loja`]},{version:`0.3.0`,date:`2026-08-24`,titulo:`Parâmetros completos, perfis de monitor e novas telas`,melhorias:[`Painel de Parametrizações com a hierarquia do produto: específico da plataforma → global ("herdar do global")`,`Conexão por plataforma: iFood (clientId/secret + lojas), Keeta (conta MARCA), 99Food (AppShopID por loja), WhatsApp (pareamento por QR)`,`Cadastro completo por loja: razão social, CNPJ, inscrição estadual, endereço, telefones, logo, cor e horários`,`Aceite automático com espera e trava de capacidade; iniciar preparo junto com o aceite; modos de entrega por canal`,`Perfis de monitor: Gestor, Caixa, Cozinha e Entregadores — cada tela com suas colunas e botões; concluídos só no gestor`,`WhatsApp como canal de venda na mesma esteira: conversas, respostas rápidas e conversão em pedido`,`Selo 💬 com som no cartão quando o cliente manda mensagem sobre o pedido; recado para a cozinha; "Falar com o cliente"`,`Cardápio global + ajustes por plataforma, reajuste % em lote e publicação por canal`,`Entregas: motoboys, rotas agrupadas por bairro e link do Google Maps com as paradas na ordem`,`Fechamento diário e mensal com exportação CSV no contrato do ERP`,`Rodapé funcional: fila ao vivo, tempo médio de aceite, próximo agendado, sincronização, conexões e faturamento (gestor)`],correcoes:[`Botão de som virou alternância fixa (não desaparece mais) com preferência lembrada`,`Recuperar venda passou a ser operação única: trava de duplicidade e o cancelado sai do quadro sozinho`,`Pedidos do WhatsApp não sofrem mais cancelamento aleatório na simulação`]},{version:`0.2.1`,date:`2026-08-24`,titulo:`Destinos para retirada pronta e pedidos cancelados`,melhorias:[`Retirada pronta ganhou o botão "Cliente retirou" (concluía e não entupia mais a coluna Prontos)`,`Cancelados com destinos: "Ciente" (arquiva, mantém no histórico) e "Recuperar venda" (vira pedido WhatsApp sem comissão)`,`Motivo e autor do cancelamento visíveis no cartão`,`Textos de espera contextuais: "aguardando coleta do entregador…", "entregador levando ao cliente…"`],correcoes:[`Pedido agendado não mostrava mais a contagem regressiva de aceite imediato`]},{version:`0.2.0`,date:`2026-08-24`,titulo:`Simulação completa no ar`,melhorias:[`Painel kanban único
