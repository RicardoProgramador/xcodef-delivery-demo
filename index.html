<title>Acesso encerrado</title>
<style>
  :root { --tinta:#0f172a; --suave:#64748b; --linha:#e2e8f0; --fundo:#f6f7f9; --cartao:#ffffff; }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --tinta:#e8edf5; --suave:#9aa8bd; --linha:#26334a; --fundo:#0d131f; --cartao:#141d2e; }
  }
  :root[data-theme="dark"] { --tinta:#e8edf5; --suave:#9aa8bd; --linha:#26334a; --fundo:#0d131f; --cartao:#141d2e; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--fundo); color:var(--tinta);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .cartao { width:min(460px,100%); background:var(--cartao); border:1px solid var(--linha); border-radius:16px; padding:28px 26px; box-shadow:0 18px 44px rgba(0,0,0,.14); }
  .cadeado { font-size:2.2rem; line-height:1; }
  h1 { font-size:1.2rem; margin:14px 0 8px; }
  p { margin:0 0 10px; color:var(--suave); font-size:.94rem; line-height:1.55; }
  .marca { font-size:.78rem; color:var(--suave); border-top:1px solid var(--linha); margin-top:18px; padding-top:12px; }
  b { color:var(--tinta); }
</style>
<div class="cartao">
  <div class="cadeado">🔒</div>
  <h1>Acesso encerrado</h1>
  <p>Este endereço não hospeda mais a demonstração da <b>Central de Pedidos</b>.</p>
  <p>O material passou a ficar em um endereço novo, <b>fechado por chave de licença</b>. Se você precisa acompanhar o projeto, peça o novo acesso a quem te passou este link.</p>
  <p class="marca">xcodef · Central de Pedidos</p>
</div>
