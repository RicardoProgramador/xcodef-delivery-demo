`,pa=`xcodef-delivery`,ma={version:`0.32.0`,date:`2026-09-04`,titulo:`O entregador entra por um código único — e a lista de nomes, que abria a casa para qualquer um, morreu`,melhorias:[`O APLICATIVO DO ENTREGADOR PEDE UM CÓDIGO, e só (ADR-047). Ele é entregador PRÓPRIO do restaurante: nasce dentro da loja, com nome e telefone digitados por quem o contratou, e não tem por que guardar mais uma senha para trabalhar meia jornada. A loja gera um código, manda pelo WhatsApp ou por mensagem de texto, ele digita uma vez — e pronto`,`A LISTA DE NOMES MORREU, e ela era o furo. Até aqui a tela de entrada mostrava TODOS os entregadores ativos e bastava tocar num nome para virar aquela pessoa: qualquer um com o aplicativo na mão via o movimento da casa inteira, os endereços dos clientes, os valores a cobrar. Não era senha fraca — era porta sem fechadura`,`O CÓDIGO NUNCA SE REPETE na plataforma inteira, e o registro dele é permanente: um código já queimado não volta a circular. Ele morre no primeiro uso (na hora, não no fim do dia), vence sozinho se ninguém usar, e vive guardado como impressão digital — quem abrir o banco não entra no lugar de ninguém. É um por pessoa: gerar outro apaga o anterior, para ninguém andar com dois códigos no bolso`,`O QUE O CÓDIGO ABRE não é "o aplicativo": é o vínculo entre APARELHO, ENTREGADOR e ESTAÇÃO DE TRABALHO. A estação é o lugar onde a pessoa trabalha, e ali dentro pode haver uma loja com vários CNPJ e várias plataformas de delivery de refeição ao mesmo tempo. Ele entrega para TODAS por padrão — não há distinção; restringir a uma é escolha de quem configura, em Entregas/Entregadores`,`DEPOIS DA PRIMEIRA VEZ, NUNCA MAIS. O aparelho fica vinculado e o código não é pedido de novo: quem comanda o acesso passa a ser a loja, que bloqueia, desvincula ou manda para a quarentena — cadastro de gente continua nunca sendo apagado. O turno dura o que a casa parametrizar, 8 horas de fábrica, contadas do acesso`,`E TURNO VENCIDO NÃO DERRUBA NINGUÉM NA RUA (regra 6, a casa não para). O vencimento fecha a porta para o próximo pedido; quem está com uma viagem na mão termina a viagem. Largar um entregador no meio da entrega para cumprir um relógio seria o sistema atrapalhando a operação que ele existe para servir`,`TRÊS PARÂMETROS NOVOS, nenhum deles escondido no código (regra 3): quantas horas dura o turno, quantas horas um código não usado sobrevive, e se a ficha completa (CPF, habilitação, endereço, placa) é exigida antes da primeira viagem — umas casas conferem tudo antes, outras põem a pessoa na rua hoje e completam depois`,`A MENSAGEM SAI PRONTA PARA COPIAR, sem link. A tela monta o texto com o nome da pessoa, o código e a validade, e quem cola no WhatsApp é a pessoa da loja. Link de aplicativo de fora não sai de tela nossa — e ensinar entregador a clicar em link de acesso que chega por mensagem é ensinar exatamente o hábito que o golpe usa`,"O CÓDIGO É SORTEADO POR CRIPTOGRAFIA, não por `Math.random`, e sem os caracteres que se confundem lidos em voz alta: sem zero e ó, sem um e i, sem L. Quem digita está de capacete na mão, e cada ambiguidade é uma ligação para a loja"],correcoes:[]}.version,ha=`central-licenca`,ga=`central-licenca-assinada`;function _a(e){try{return localStorage.getItem(e)}catch{return null}}function va(e,t,n){let r=L(e),i=e.pacote.charAt(0).toUpperCase()+e.pacote.slice(1),a=r===`sem-limite`?`sem teto de pedidos`:`até ${r.toLocaleString(`pt-BR`)} pedidos/mês`,o=la(e.expira_em,t),s=n?` · ${n}`:o===0?` · vence HOJE`:o>0&&o<=7?` · vence em ${o} dia(s) — ${ca(e.expira_em)}`:``;return{para:`${e.email} · plano ${i} (${a})${s}`,digital:`chave-assinada`,validaAte:e.expira_em}}async function ya(e,t){let n=oa(e);if(!n.ok)return{ok:!1,texto:n.texto};if(!fa)return{ok:!1,texto:`Esta versão ainda não tem a chave pública do License Center instalada — quem publica precisa rodar "npm run licenca:publica" e publicar de novo. Enquanto isso, entre com a chave da demonstração.`};let r=await da(n.chave,fa);if(r===`sem
