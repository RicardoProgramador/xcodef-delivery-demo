unca fica desencontrada`,`CONCLUIR E LEVAR AO DELIVERY: quando nada mais depende da cozinha, a bancada ganha o botão "🛵 Concluir #1204 — pronto para delivery" e num toque o pedido inteiro cai em PRONTOS. O fecho é do PEDIDO, não do prato — é o pedido inteiro que o cliente recebe`,`A FALTA DE INSUMO virou a 4ª FILEIRA da cozinha, em cartões: a barra de digitar saiu do topo da tela e virou coluna, como todo o resto`,`AS FILEIRAS DE RECADO SE FECHAM SOZINHAS: 🧺 Solicitações e 🛒 Compras só ficam abertas enquanto há algo EM ABERTO. Atendido o último, comprimem na hora — cartão cinza de coisa resolvida não ocupa coluna do quadro. O gestor ou o caixa toca na barrinha para conferir, e ela fecha de novo quando o próximo item sair`],correcoes:[`O botão de concluir continuava aparecendo para um pedido que já tinha saído da bancada inteiro montado`]},{version:`0.21.0`,date:`2026-08-26`,titulo:`A ordem da casa: o PREPARO pede, a COZINHA (produção) faz — buffet reposto aos poucos e falta de insumo virando compra`,melhorias:[`A ORDEM FICOU DEFINIDA E ESCRITA: a ÁREA DE PREPARO monta os pratos e PEDE para a COZINHA — e cozinha e produção são a MESMA coisa, um posto só, que nunca age por conta própria. Os postos mudaram de nome nas telas (🥗 Preparo · 👨‍🍳 Cozinha (produção)); por baixo nada quebrou, o perfil já guardado em cada computador continua valendo`,`AS DUAS TELAS VIRARAM FILEIRAS VERTICAIS de cartões, lado a lado como o quadro: no preparo, uma fileira "sem dono" e uma para CADA pessoa (a sua vem primeiro); na cozinha, uma fileira por urgência. Cada bancada tem lugar fixo — ninguém procura o próprio prato no meio do serviço`,`BARRA DO BUFFET, fora dos cartões: um toque em "+ Feijão", "+ Arroz", "+ Fritas" e a cozinha recebe. São solicitações avulsas, sem pedido de cliente atrás — é a cuba baixando. O botão trava depois de pedido, para ninguém pedir duas vezes`,`SEMÁFORO DA URGÊNCIA, escolhido por quem está olhando a cuba: 🔴 urgente (acabou ou está acabando) e 🟡 em breve (dá para esperar a próxima leva). Na cozinha, componente de prato entra em 🟡 e SOBE sozinho para 🔴 quando passa do tempo combinado esperando — é a bancada parada por causa dele`,`LIBERADO FICA CINZA e depois desce para o LOG DO DIA: passados os minutos do parâmetro (2, no combinado), o cartão sai da fileira e o histórico fica guardado no log da cozinha. O mesmo vale para o prato montado na bancada — some do preparo e continua à vista, em cinza, só para o GESTOR`,`FICHAS DE MONTAGEM POR INSUMO: os pratos da casa nasceram com a ficha certa (a parmegiana é bife à parmegiana + fritas + arroz; a marmita G é arroz + feijão + picanha + farofa + fritas), então a sugestão da bancada virou o insumo de verdade, e não o nome do prato repetido`,`A COZINHA RELATA FALTA DE INSUMO ao caixa/gestor: escreve o que acabou e aperta 🔴 acabou ou 🟡 acabando. Vira a fileira 🛒 Compras no quadro de quem tem o dinheiro e o carro, com o botão "✔️ Chegou" — que deixa o cartão ⬜ cinza e some depois do parâmetro`,`ESTRUTURA DA CASA PARAMETRIZADA (Configurações › Geral › Buffet e área de preparo): estoque, cozinha/produção e área de preparo, cada um ÚNICO para todas as empresas ou UM POR EMPRESA — cada casa monta a sua, e as telas obedecem`,`ITENS DO BUFFET são lista da casa, não código: feijão, arroz, farofa, fritas, bife contra, ovo frito, maionese, feijoada, filé de frango grelhado — e a bancada ainda soma sozinha os componentes das fichas do cardápio do dia, para o que o cardápio pede aparecer no botão`,`TRÊS PESSOAS NOVAS NA ÁREA DE PREPARO (Marcela Dias, Luciana Prado e Tati Ramos), cada uma com a sua cor de bancada — a fileira de cada uma nasce assim que ela assume o primeiro prato`],correcoes:[`A demonstração ficava com a TELA BRANCA em alguns navegadores: a página não declarava a codificação e o navegador adivinhava errado, transformando os emoji em lixo e o programa em texto inválido. Agora vem declarado (UTF-8), e não há mais o que adivinhar`]},{version:`0.20.0`,date:`2026-08-26`,titulo:`Cada monitor no seu lugar: celular do motoboy sem histórico, solicitações do preparo em fileira e tudo que fecha vira cinza`,melhorias:[`O CELULAR DO MOTOBOY mostra SÓ a viagem atual: saíram os contadores do dia (viagens, entregas, quilômetros, valor recolhido), o registro de passos e o relógio de "minutos na rua". O que ele precisa para cumprir a viagem — paradas, endereço, forma de pagamento, troco, maquininha e o código da porta — e nada que sirva de histórico de jornada na mão errada (proteção contra ação trabalhista). No aplicativo de verdade a tela ainda bloqueará captura de imagem; nesta demonstração de navegador isso não existe, e está dito com todas as letras em docs/DECISOES.md`,`DESEMPENHO DE HOJE por entregador — viagens, entregas, quilômetros, minutos por entrega, valor recolhido, ocorrências e um gráfico de barras por pessoa — leitura EXCLUSIVA do perfil gestor, na tela App do entregador`,`O REGISTRO DO DIA das viagens (e o copiar para planilha) também virou leitura exclusiva do gestor — os outros monitores veem só o que está acontecendo agora`,`TROCAR O MONITOR É COISA DE GESTOR: o seletor de perfis e o botão das 5 telas só existem no monitor do gestor (ou para quem entrou com atribuição de gestor). Os demais monitores ficam pregados no papel deles — o da cozinha na cozinha, o do preparo na sala de preparo`,`FILEIRA NOVA — 🧺 SOLICITAÇÕES DO PREPARO: o que a sala de preparo pediu à cozinha/produção agora é uma fileira do quadro, com botão "✔️ Feito — liberado para o preparo"; atendida fica CINZA por uns minutos e sai sozinha. Entra no quadro do gestor e, EM DESTAQUE (tarja roxa), no monitor da cozinha`,`O MONITOR DA COZINHA mostra só o que é da cozinha: Novos, Em preparo e as Solicitações em destaque — prontos, fila de entrega e cancelados saíram de lá (parede de cozinha mostra o que a cozinha produz, não o que a rua faz)`,`SUGESTÃO AUTOMÁTICA na bancada do preparo: assim que o pedido cai, a tela já previu o que vai faltar, o cartão PISCA com a sugestão ("pedir à cozinha — frango empanado, batata frita") e um único OK manda a solicitação inteira — no prato sem dono, o OK também assume o prato para quem clicou`,`TUDO QUE FECHOU VIRA CINZA, em qualquer fileira e monitor: entregue, concluído e o cancelado marcado como "Ciente" ficam monocromáticos, descem para o fim da fileira e saem sozinhos depois dos minutos do parâmetro da expedição — nada de colorido em pedido que já acabou`,`FILEIRA ZERADA COMPRIME SOZINHA, em todos os perfis: coluna sem nenhum cartão vira a barrinha vertical automaticamente e reabre no momento em que chegar pedido`,`VIAGENS EM ANDAMENTO virou fileira com o mesmo conceito: zerada, comprime numa tira encostada à DIREITA e devolve toda a altura ao quadro de agrupamento`,`O CÓDIGO DA ENTREGA agora é DEVOLVIDO À PLATAFORMA na ordem combinada: registra primeiro no nosso sistema (conferido na porta) e logo em seguida na plataforma de origem — o detalhe do pedido mostra os dois carimbos ("conferido na porta às 21:38 · registrado no iFood às 21:38")`],correcoes:[`Quem entrou com usuário sem atribuição de gestor não perdia mais o botão Sair ao ficar sem o seletor de monitores`,`A escala da vez saiu da faixa que roubava altura do quadro de agrupamento em monitor de notebook: virou selo no cabeçalho com a fila flutuando por cima`]},{version:`0.19.0`,date:`2026-08-26`,titulo:`A PRODUÇÃO entra em cena: 5 telas, cozinha por demanda, cor de cada pessoa, código na porta e escala da vez`,melhorias:[`TELA NOVA — 🍽️ PRODUÇÃO: a bancada onde os pratos são MONTADOS ganhou tela própria, separada da cozinha (onde a comida é feita). São 5 monitores agora: Gestor, Caixa, Produção, Cozinha e Entregadores`,`FICHA DE MONTAGEM no cardápio: cada prato pode listar as partes que o compõem (frango empanado + molho + queijo + batata frita). Prato sem ficha continua valendo como peça única — a casa cadastra no ritmo dela e nada quebra no primeiro dia`,`A COZINHA VIROU SUBORDINADA À PRODUÇÃO: a funcionária assume o prato, marca o que já tem na bancada e pede à cozinha SÓ o que falta. Faltou só a batata? A cozinha recebe "2 batatas fritas para o #1207", não o prato inteiro. Faltou tudo? Vai tudo`,`Tela da cozinha reorganizada por COMPONENTE, do jeito que a cozinha trabalha: "🍟 Batata frita — 5" com o total grande, quem está esperando há mais tempo primeiro, e o relógio de espera de cada pedido`,`UM PRATO, UMA PESSOA: ao assumir, o prato fica com a cor da funcionária (Vitória vermelha, Enzo amarelo, Marcela azul…) e ninguém mais mexe nele. A cor é cadastrada em Configurações, e quem não escolheu ganha uma da paleta pelo nome`,`CÓDIGO DE CONFIRMAÇÃO DA ENTREGA: o número que o cliente diz na porta agora existe no sistema. Nas plataformas ele vem com o pedido e a confirmação volta para elas; nos pedidos do nosso WhatsApp a casa GERA o código e manda ao cliente na conversa`,`O entregador confere o código no aplicativo dele antes de dar a entrega por feita — e existe a saída honesta para quando o cliente não tem o código: alguém autoriza e fica registrado, com nome e motivo`,`O MOTOBOY PASSA A SABER COMO SE PAGA: cada parada mostra a forma (dinheiro com troco, maquininha, Pix, pago pelo aplicativo) e a viagem avisa em cima "🧾 LEVAR A MAQUININHA" e quanto levar de troco`,`Endereço completo na parada: complemento e ponto de referência deixaram de ser descartados no caminho — é o que evita a ligação "cadê você?" na porta do prédio`,`ESCALA DA VEZ: o "Cheguei, estou na loja" passou a gravar a HORA, e a tela de Entregas mostra a fila do dia (1º da vez, 2º…) com hora de chegada, quilômetros e entregas`,`Novo parâmetro "quem é o próximo da vez": ordem de chegada (padrão), menos quilômetros ou menos entregas — era o "ou outro critério definido pelo restaurante"`,`O CAIXA ganhou os poderes de operação do gestor: cardápio, entregas, mapa, aplicativo do entregador, fechamento do DIA e as configurações de operação. O gerencial continua fora: gráficos, semana, mês e os números do negócio`,`Contagem das colunas em "total/abertos": 35 pedidos no quadro de Prontos, 14 ainda em andamento — o que está colorido é o que pede trabalho`],correcoes:[`A MESMA fila mostrava números diferentes em cada monitor (10 na tela do gestor, 8 na do entregador) porque o monitor dos entregadores escondia o que não era entrega própria. Agora o quadro é um só, para todo mundo — quem pode AGIR em cada pedido continua sendo decidido por perfil`,`A planilha do cardápio ganhou a coluna da ficha de montagem sem quebrar quem já usa: a planilha antiga, de 9 colunas, continua entrando com os preços na coluna certa`]},{version:`0.18.1`,date:`2026-08-25`,titulo:`O pedido que você foi buscar fica amarelão até você decidir, e Cancelados vira fileira como as outras`,melhorias:[`O cartão que a busca (ou o aviso "precisam de atenção") encontra agora fica AMARELÃO piscando, no meio do quadro — acabou o destaque discreto que passava despercebido`,`E ele NÃO apaga sozinho com o tempo: o amarelão só sai quando você mexe no cartão (clica nele ou num botão dele), porque aí a decisão foi tomada`,`A coluna Cancelados passou a usar a MESMA barrinha em pé das outras fileiras: recolhe pelo ⇤ do cabeçalho e volta com um clique na barrinha`,`O parâmetro "cancelados começam ocultos" continua valendo — ele decide como a fileira abre da primeira vez, e daí em diante o computador lembra a sua escolha`],correcoes:[`O botão de olho "👁 Cancelados / 🙈 ocultar" era o único jeito diferente de esconder coluna no quadro — dois mecanismos para a mesma coisa, cada um num canto`]},{version:`0.18.0`,date:`2026-08-25`,titulo:`Demonstração fechada por licença, lojas fictícias, achar pedido pela barra e fileiras que recolhem`,melhorias:[`PORTA COM CHAVE: a demonstração agora abre só com uma CHAVE DE LICENÇA. Sem ela não aparece pedido, coluna, nome de loja — nada. Quem entra fica marcado no rodapé ("acesso liberado para…") e o botão 🔒 tranca de novo neste computador`,`Cada acesso tem a sua própria chave, com validade opcional: chave vencida deixa de abrir sozinha, e tirar a chave da lista revoga o acesso na publicação seguinte`,`A chave NUNCA fica escrita no programa — o arquivo guarda apenas a impressão digital dela (uma conta de mão única), então quem abre o código não descobre a senha`,`IDENTIDADE FICTÍCIA: as três lojas da demonstração viraram Sabor da Vila, Cantina Bella Massa e Grill do Parque — os nomes reais do cliente saíram do produto inteiro (telas, mapa, relatórios, documentos)`,`Quem já usava não fica para trás: a configuração e o histórico gravados no computador trocam de identidade sozinhos na abertura, sem perder venda nem ajuste`,`BARRA PARA ACHAR PEDIDO no alto da tela: procura por número do chamado, nome do cliente, telefone, bairro, rua ou loja — sem acento e sem diferença de maiúscula`,`Achou, clicou: o quadro ROLA até o cartão, onde quer que ele esteja, e o cartão fica PISCANDO alguns segundos para a decisão ser tomada na hora`,`O aviso "🔔 pedidos precisam de atenção" virou botão: clicar no número leva direto ao cartão, piscando do mesmo jeito`,`FILEIRAS MAIS ESTREITAS: as colunas dividem a largura por igual e cabem lado a lado, sem empurrar ninguém para a linha de baixo`,`RECOLHER FILEIRA INTEIRA: Prontos, Balcão, Fila de entrega, Acerto da rua e Concluídos viram uma barrinha em pé quando você quer espaço, e voltam com um clique — as vitais (Novos, Em preparo e Em entrega) ficam sempre abertas`,`A fileira recolhida abre SOZINHA quando a busca acha um pedido lá dentro — e o computador lembra quais ficaram recolhidas`],correcoes:[`O link da demonstração era porta aberta: quem tivesse o endereço via a operação inteira. Agora o endereço sozinho não basta — precisa da chave`]},{version:`0.17.12`,date:`2026-08-25`,titulo:`Os botões do cabeçalho não se dissolvem mais no vermelho do alarme`,melhorias:[`A barra de telas (Painel, Conversas, Clientes…) virou uma ILHA escura fixa, com contorno claro quando o alarme acende: o cabeçalho pisca vermelho no fundo e os botões continuam parados e legíveis`,`Todo controle do cabeçalho ganhou fundo sólido no lugar do branco transparente — abas, "↩ Movimentos", a etiqueta da versão e o monitor fixo`,`Régua de contraste virou verificação automática: cada botão é medido no estado de alarme e reprovado se ficar avermelhado, translúcido ou abaixo de 4,5 para 1 (o mínimo de acessibilidade)`],correcoes:[`Com o alarme aceso, os botões do cabeçalho eram branco transparente: viravam rosa por cima do vermelho, perdiam o contraste e piscavam junto com o fundo — o visual da barra morria justamente na hora do aperto`]},{version:`0.17.11`,date:`2026-08-25`,titulo:`Na tela de Entregas quem manda é o agrupamento: as viagens param na metade e cedem espaço`,melhorias:[`A tela de Entregas virou uma moldura com DUAS áreas: o quadro de agrupamento (em cima) é a principal e as viagens em andamento (embaixo) são a variável — as viagens nunca passam de METADE da tela e, quando aperta, cedem espaço três vezes mais rápido que o agrupamento`,`Cada área rola por dentro, com o cabeçalho das viagens fixo enquanto você rola — a tela em si não rola mais, então o quadro de agrupamento fica sempre à vista para arrastar`,`As viagens têm piso: mesmo cedendo espaço elas não somem da tela (dá para ver e rolar dentro delas)`,`Em tela baixa de notebook, o texto de ajuda do rodapé sai de cena e o cabeçalho encolhe — a área de trabalho vem antes do texto explicativo`],correcoes:[`Com muitas viagens na rua, o quadro de agrupamento era ESPREMIDO até virar uma tirinha de uns 60 pixels, com os cartões cortados — ficava impossível agrupar e arrastar enquanto a rua estava cheia`]},{version:`0.17.10`,date:`2026-08-25`,titulo:`Prontos vira leitura pura, balcão ganha coluna própria, viagens ganham travas e o mapa abre sempre`,melhorias:[`O aviso "🔔 pedidos precisam de atenção" agora DIZ QUAIS, entre parênteses (#…, #…) — acabou caçar no quadro quem está gritando`,`Quadro PRONTOS 100% leitura: nenhum botão nos cartões — a expedição é para ACOMPANHAR; o único gesto é clicar no cartão e ver os detalhes`,`No Prontos, pedido ENTREGUE vira cartão cinza com as letras sem cor e desce para o fim; os coloridos ficam em cima, mais recentes primeiro`,`Detalhes abertos do Prontos são só informativos: sem botão nenhum, e um clique em QUALQUER parte fecha`,`Coluna própria "🧾 Balcão" no painel: é ali que mora a AÇÃO da retirada (🛍️ Retirado ✓ e 💰 Receber) — para o gestor, o caixa e, se o parâmetro apontar, o gestor de entregas`,`Viagem que JÁ SAIU para a rua não se desfaz nem muda de dono: o ✕ some, o seletor trava com o selo 🔒 na rua, e "Desfazer sugestões" preserva quem está rodando`,`Viagem só vai para entregador NO EXPEDIENTE: arrastar, "mover para", os seletores e o "+ viagem" só aceitam quem está na escala (fora dela, aviso na hora) — o agrupamento continua livre para SUGERIR na coluna "Sem motoboy", agrupado e sem dono, até uma pessoa distribuir`,`Mapa ao vivo abre SEMPRE, na hora — mesmo sem ninguém na rua ele desenha as lojas e os perímetros (antes ficava em branco, "carregando…" para sempre)`,`O mapa decide em ~2 segundos entre mapa de rua e desenho da cidade; onde a hospedagem bloqueia, ele nem tenta baixar os quadradinhos — a tela fica leve`,`App do entregador: os celulares de TODOS aparecem lado a lado, em tempo real — o seletor "ver pelos olhos de" morreu (tela de celular é pequena, cabem várias)`,`Pedido AGENDADO entra sozinho na esteira NA HORA do preparo (mesmo aceite automático, mesma trava de capacidade) — e aceite antecipado não começa a cozinhar antes da hora`],correcoes:[`O Mapa ao vivo nunca abria quando não havia viagem na rua — a tela ficava em branco com "carregando o mapa de rua…" eterno (era exatamente o caso de quem abria para conhecer)`,`Pedido agendado com a hora vencida apodrecia em Novos sem ninguém vigiar o relógio dele — o rodapé chegava a mostrar "próx. agendado" no passado`,`Os botões do balcão e da coleta apareciam DUPLICADOS no quadro de Prontos — ação repetida em dois lugares é convite para clique errado`,`A viagem vazia criada pelo "+ viagem" sumia SOZINHA em um segundo se nada fosse arrastado para dentro na hora — a limpeza do relógio apagava o que o gestor tinha acabado de montar`]},{version:`0.17.7`,date:`2026-08-25`,titulo:`Prontos virou a expedição: etapa viva no cartão, coleta da plataforma na mão do gestor e balcão por parâmetro`,melhorias:[`NADA sai da loja sozinho: pedido pronto com entrega pela plataforma fica na fila do GESTOR DE ENTREGAS até ele entregar a sacola na mão do entregador e LIBERAR no sistema (botão 🤝 no cartão e na tela de Entregas)`,`Quando o entregador da plataforma chega na loja, o botão vira "🛵 Entregador CHEGOU — entregar e liberar" piscando, e a chegada fica na linha do tempo do pedido`,`Coluna "🤝 Coleta da plataforma" na tela de Entregas: a fila de coleta é do gestor de entregas, tudo no painel dele`,`O parâmetro do balcão agora manda de verdade: com "quem confirma a retirada" apontando para o Gestor de Entrega, os prontos do balcão caem também no quadro dele — coluna "🧾 Retirada no balcão" com o botão Retirado ✓ (com o caixa, segue como era)`,`O quadro PRONTOS virou a EXPEDIÇÃO: todo pedido pronto fica nele até o fim, com a etapa viva escrita no cartão — no balcão, na fila de entrega, na rua com o motoboy (com o nome dele), com o entregador da plataforma, entregue`,`Pedido entregue ainda fica alguns minutos à vista no quadro de Prontos antes de sair — e o tempo é PARÂMETRO ("entregue some do quadro após", padrão 3 minutos), nada fixo no código`,`Cores do quadro combinadas: Prontos verde-esmeralda claro, Fila de entrega vermelho claro (prioridade da operação), Em preparo azul claro — e Novos segue amarelo claro`],correcoes:[`O sistema "coletava" sozinho o pedido da plataforma depois de um tempo parado — agora o vigia só marca a CHEGADA do entregador; entregar e liberar é sempre de uma pessoa`,`Pedido de entrega sumia do quadro de Prontos assim que ficava pronto — o balcão perdia o pedido de vista antes mesmo de a sacola sair da loja`]},{version:`0.17.5`,date:`2026-08-25`,titulo:`Cadastro de gente nunca se apaga: quarentena, Ativar de volta e "está na loja" na mão`,melhorias:[`REGRA SAGRADA NO CÓDIGO: "excluir" um entregador NUNCA apaga o cadastro — manda para a 🗄️ QUARENTENA, com a data, de onde dá para DEVOLVER AO CADASTRO quando você quiser (o caso Joao Manuel não se repete)`,`Quem volta da quarentena volta INATIVO: readmitir exige o "↩️ Ativar" de propósito — nem excluir por engano, nem readmitir por descuido`,`Botão "↩️ Ativar" para entregador inativo: ele voltou a trabalhar na casa, o gestor reativa na hora (antes só existia Inativar, sem volta)`,`Botão "🟢 Está na loja" para o gestor marcar NA MÃO que o entregador chegou — para o dia em que ele aparece sem GPS, sem bateria ou sem o aplicativo: a pessoa está na porta e entra no rateio do mesmo jeito`,`Ativar não joga ninguém na escala sem querer: volta "fora do expediente" até alguém (ele ou o gestor) marcar que chegou`,`A quarentena fica fora de tudo: rateio, colunas, seletores — mas o histórico das viagens da pessoa continua intacto`],correcoes:[`O ✕ do cadastro de entregadores APAGAVA a pessoa de verdade, sem volta — cadastro de humano excluído por engano era perda definitiva`]},{version:`0.17.3`,date:`2026-08-25`,titulo:`Fila de entrega no quadro, vigia contra pedido preso, aceite em lote e a tela de Entregas remodelada`,melhorias:[`COLUNA NOVA "🛵 FILA DE ENTREGA", entre Prontos e Em entrega: é a fila do gestor de entrega — TODO pedido de entrega espera ali (própria até o gestor despachar; plataforma até o entregador chegar e coletar). NADA pula para "Em entrega" sozinho`,`Prontos virou o balcão de verdade: só retirada aguardando o cliente vir buscar`,`A coleta do entregador da plataforma agora leva minutos (dá para VER a fila) e fica registrada na linha do tempo: "🛵 Entregador da plataforma coletou o pedido"`,`VIGIA DA RUA: evento de plataforma que se perde não deixa mais pedido preso em "Em entrega" para sempre (o caso das 6 horas do print) — o vigia dá o passo que faltou e ESCREVE na linha do tempo que foi ele`,`ACEITE AUTOMÁTICO EM LOTE: esvaziou o "Em preparo", os novos entram NA HORA até encher o limite do parâmetro (limite 10 e preparo vazio → entram 10 de uma vez), os mais antigos primeiro`,`Pedido do WhatsApp/balcão também entra no aceite automático — antes ficava apodrecendo em Novos com o relógio negativo`,`TELA DE ENTREGAS REMODELADA: colunas com largura de quadro (nada mais esticado na tela inteira), cartões compactos como os do painel, a ordem da parada virou uma bolinha azul (adeus tarja preta) e os cabeçalhos de viagem ficaram azul-claro`,`O quadro semente abre sempre com um pedido de entrega própria COBRANDO na porta — o fluxo do acerto fica visível em toda abertura`],correcoes:[`Pedidos do entregador da plataforma pulavam de Prontos direto para "Em entrega" em segundos, sem fila visível — e podiam ficar presos lá para sempre se o evento de entrega se perdesse`,`O aceite automático lia o limite uma vez só e podia estourá-lo no mesmo lote`]},{version:`0.17.1`,date:`2026-08-25`,titulo:`Correção: "Receber" só no momento do acerto — e cobrança da plataforma é repasse`,melhorias:[`A verificação automática agora varre o quadro inteiro e reprova qualquer versão que mostre o botão "Receber" fora de hora (foi rodada contra a versão anterior e pegou exatamente o cartão do print)`],correcoes:[`O botão verde "💰 Receber" aparecia em pedido EM PREPARO. Agora ele só existe no momento do acerto: entrega própria depois de entregue E com o motoboy de volta; retirada de balcão do Pronto em diante (o cliente paga ao buscar)`,`COBRANÇA DO ENTREGADOR DA PLATAFORMA nunca passa pelo caixa: quem recebe na porta é o entregador dela e o valor entra no repasse. O cartão passou a dizer "💳 cobrança com o entregador da plataforma" (e "repasse" depois de entregue), sem botão de receber, sem virar pendência do caixa e sem inflar o "em aberto" do rodapé, do fechamento e da gerência`]},{version:`0.17.0`,date:`2026-08-25`,titulo:`Cadastro de clientes de verdade, rastreio do cliente, filas por número e perímetro no mapa`,melhorias:[`CADASTRO DE CLIENTES: botão "＋ Novo cliente" e "✏️ Editar" na ficha — nome, apelido, telefone, e-mail, ANIVERSÁRIO (com "faz aniversário em X dias" e o resumo 🎂 da semana), documento para a nota, ALERGIAS em destaque vermelho (a cozinha precisa ver), preferências, etiquetas (⭐ especial, 🌱 novo, ⚠️ atenção, 🏢 empresa), endereços com nome ("casa", "trabalho") e observações`,`O cadastro manual e a ficha automática se JUNTAM: o que a pessoa preenche nunca é sobrescrito pelo automático, e os números (pedidos, gastos, preferidos) continuam se montando sozinhos`,`Cadastro conferido campo a campo antes de salvar, dizendo o que falta; salvo no computador e sobrevive a fechar o navegador`,`RASTREIO DO CLIENTE: botão "📡 Ver o rastreio como o cliente vê" no pedido — etapas com horário, quem está levando, a quantos km está e em quanto tempo chega; o atendente manda o link sozinho quando o pedido sai para entrega, e o link abre SÓ aquele pedido, sem login`,`FILAS POR NÚMERO DE WHATSAPP: cada loja (CNPJ) pode ter quantos números precisar, cada número vira uma fila própria na tela de Conversas (com o contador de não lidas), e dá para ligar/desligar o atendente automático POR FILA — números administrados nas Configurações, aba WhatsApp`,`PERÍMETRO DE ATUAÇÃO: raio de entrega global e por loja; pedido de endereço fora do raio ganha o aviso ⛔ FORA DO PERÍMETRO no cartão (a decisão de aceitar é sua) e o mapa desenha o círculo de cada loja`,`FECHAMENTO mais completo: formas de recebimento do dia (aplicativo, dinheiro, maquininha, Pix, vale), PENDÊNCIAS do dia (o que ainda está sem baixa, pedido por pedido) e as datas guardadas na base histórica`,`Cadastro rápido de motoboy pelo gestor entra ACEITO e no rateio na hora — o aceite é para o auto-cadastro pelo celular do entregador; a coluna de Entregas passou a mostrar o estado real (aguardando aceite / fora do expediente / livre / na rua)`],correcoes:[`Motoboy criado pelo atalho do gestor (caso Joao Manuel) ficava preso em "aguardando aceite" e fora do agrupamento — cadastros antigos nessa situação são reconhecidos e entram no rateio`,`Viagem já despachada não se arrasta mais para outro motoboy (ela está na rua)`]},{version:`0.16.0`,date:`2026-08-25`,titulo:`Acerto da rua: o dinheiro volta com o motoboy — e o agrupamento reparte entre todos`,melhorias:[`COLUNA NOVA NO QUADRO: "Acerto da rua" — pedido entregue com valor pago na porta fica ali, aguardando o motoboy voltar com o dinheiro, a maquininha e o comprovante`,`O BOTÃO VERDE "💰 Receber" SÓ APARECE QUANDO O MOTOBOY CHEGA: enquanto ele está na rua, o cartão diz "aguardando o motoboy voltar para o acerto" — o caixa não recebe o que ainda não voltou`,`Pedido pago pelo aplicativo não passa pelo acerto: vai direto para Concluídos`,`BOTÃO "ENTREGUE" DE ENTREGA É SÓ DO GESTOR DE ENTREGAS: é ele quem recebe o motoboy e sabe se a entrega aconteceu — os demais monitores veem a etapa, sem o botão`,`RETIRADA NO BALCÃO tem regra própria: novo parâmetro "quem confirma a retirada" — o caixa, por padrão (o balcão é dele: o cliente paga e leva ali); muda para o gestor de entregas se o balcão virar posto próprio`,`AGRUPAMENTO SEM NÚMERO ENGESSADO: o tamanho da viagem passou a ser CALCULADO pelos motoboys livres — cadastrou um motoboy novo, ele entra no rateio na hora; 8 entregas com 4 livres viram 4 viagens de 2, não 3 viagens cheias e um motoboy parado`,`O teto de paradas das Configurações continua valendo como limite do baú, nunca como tamanho padrão`],correcoes:[`O botão de receber aparecia com o pedido ainda na rua — dava para "receber" um dinheiro que estava no bolso do motoboy`]},{version:`0.15.0`,date:`2026-08-25`,titulo:`Mapa de rua de verdade, trajeto pelas ruas — e "em entrega" só depois de despachado`,melhorias:[`MAPA DE RUA DE VERDADE: o mapa ao vivo passa a carregar as ruas do bairro, com o crédito do OpenStreetMap na tela`,`TRAJETO PELAS RUAS: a linha da viagem deixa de ser reta e passa a seguir o caminho que o motoboy faz de verdade, com a quilometragem e o tempo estimado vindos do serviço de rotas`,`O painel da viagem passou a mostrar "5,4 km pelas ruas" e "18 min de trajeto" quando o traçado é real`,`HONESTIDADE NA TELA: quando o mapa de rua não carrega (o link do Claude bloqueia imagem de fora), a tela DIZ que está no desenho e em linha reta, e explica o motivo — nunca deixa parecer que é rua de verdade`,`O enquadramento passou a usar a mesma projeção dos mapas de rua, então as motos, as lojas e as paradas caem exatamente em cima das ruas certas`,`O mapa não deforma mais: a área é alargada até a proporção da tela em vez de ser esticada`,`O endereço do mapa e do serviço de rotas é configurável — no aplicativo instalado na loja, os dois rodam no próprio computador do Carlos, sem mensalidade`,`A mesma viagem não é pedida duas vezes ao serviço de rotas`],correcoes:[`FURO GRAVE: o quadro abria com um pedido de ENTREGA PRÓPRIA já em "Em entrega", sem viagem e sem motoboy — o painel dizia que a comida tinha saído enquanto a tela de Entregas mostrava "ninguém na rua". Agora esse pedido é despachado pelo caminho de verdade, com rota, motoboy e viagem. Entrega própria só entra em "Em entrega" DEPOIS DE DESPACHADA`,`Entrega feita pelo entregador da plataforma continua aparecendo em "Em entrega" sem viagem nossa — ali quem leva é o aplicativo deles, e o cartão diz isso`,`A verificação automática passou a vigiar essa coerência do começo ao fim da operação, e reprova qualquer versão que volte a mostrar pedido na rua sem alguém levando`]},{version:`0.14.0`,date:`2026-08-25`,titulo:`Movimento de verdade em bateria, ritmos prontos e o mapa cabendo na tela`,melhorias:[`RITMO DE TRABALHO: a simulação manda 1 pedido por minuto — 60 na hora, contra os 20 de antes. É o ritmo que deixa acompanhar a entrega do começo ao fim: chega pedido o tempo todo, forma rota, o motoboy sai, volta e sai de novo`,`RITMOS PRONTOS nas Configurações, para trocar sem fazer conta: Calmo (20/h), Movimento (60/h — o sugerido), Sexta à noite (180/h) e Pico (600/h, teste de estresse)`,`PEDIDO CHEGA EM BATERIA, não de um em um: 3 a 6 pedidos pipocando quase juntos, e depois o respiro — é assim que se descobre se o quadro aguenta, se o alarme atrapalha e se a cozinha dá conta`,`Quanto mais apertado o ritmo, mais rápido a bateria pipoca: no movimento calmo os pedidos vêm de 5 a 25 segundos; no pico, de 2 em 2`,`E o número exato continua ajustável na mão: pedidos por hora, com a conta de quantos dá por minuto ao lado, e o tamanho da bateria`,`Mudou o ritmo, a agenda é remontada na hora — sem recarregar a página`,`As conversas do WhatsApp acompanham o movimento dos pedidos, com teto para não afogar o painel`,`ARRASTAR A VIAGEM INTEIRA: pegue a viagem pelo cabeçalho (⠿) e largue no outro motoboy — o bolo todo passa de uma vez, sem mover pedido por pedido`,`A viagem sem motoboy também se arrasta inteira: do aviso na fila direto para quem vai levar`,`Largar uma viagem dentro de outra junta as duas`,`Viagem que já saiu para a rua não se arrasta — o motoboy está com ela`,`MAPA CABE NA TELA: abre já ajustado à janela, com todo mundo que está na rua aparecendo, sem estourar a altura e sem rolagem lateral`,`A verificação automática mede o ritmo DENTRO DO NAVEGADOR e confere se o painel continua respondendo, inclusive no pico`],correcoes:[`O mapa abria mais alto que a janela e obrigava a rolar a página para ver a operação inteira`,`A última conversa de cada hora caía no minuto 60 e era descartada — sumia do painel sem motivo`]},{version:`0.13.1`,date:`2026-08-25`,titulo:`Correção urgente: agrupar não some mais com pedido`,melhorias:[`REDE DE SEGURANÇA: viagem montada que ficar sem motoboy passa a aparecer em destaque na fila "Sem motoboy", com o seletor para dar a alguém e o ✕ para desfazer — pedido pronto SEMPRE fica visível, aconteça o que acontecer`,`Se ninguém estiver marcado como disponível, o agrupamento não trava mais: sugere assim mesmo e o gestor troca na mão`,`A verificação automática agora repete exatamente este caso antes de cada publicação (com o cadastro antigo salvo e com ninguém disponível) e reprova a versão que sumir com qualquer pedido`],correcoes:[`GRAVE: "Sugerir agrupamento" fazia os pedidos prontos SUMIREM da tela e não deixava montar viagem. Causa: motoboy cadastrado antes da versão 0.11.0 (quando o cadastro era só o nome) ficou sem os campos de situação e de "está na loja"; com isso ninguém passava na escolha automática, a viagem nascia sem dono e a tela não desenhava viagem sem dono. Cadastro antigo passou a ser reconhecido como aceito e disponível — quem já rodava continua rodando`]},{version:`0.13.0`,date:`2026-08-25`,titulo:`Mapa ao vivo com a moto andando, passo a passo do entregador e uma tela só de entregas`,melhorias:[`NOVA TELA "🗺️ Mapa ao vivo": todas as entregas acontecendo ao mesmo tempo, numa tela só — a motinha ANDA de verdade, parada a parada, até voltar para a loja`,`Cada loja, cada endereço e cada moto num ponto do mapa; o trajeto aparece pontilhado e vai virando linha cheia conforme ele anda`,`Clique numa moto para acompanhar só ela; as outras ficam apagadas`,`Painel ao lado com o que o desenho não cabe: onde ele está, quanto por cento do trajeto já andou, quantas entregas fez, quanto tempo está na rua, quantos quilômetros faltam até a próxima parada e quanto já recolheu de dinheiro`,`PASSO A PASSO NO APLICATIVO DO ENTREGADOR: um botão de cada vez — "Saí da loja", "Cheguei no endereço do #1204", "Entreguei", "Estou voltando", "Cheguei na loja" — para ele não ter de decidir nada dirigindo`,`Cada passo marcado vira aviso na hora para a retaguarda: o gestor vê a viagem andando sem ligar perguntando "onde você está?"`,`BOTÕES DE NAVEGAR no aplicativo do entregador: "até a próxima parada" e "rota toda", abrindo no aplicativo de mapa que ele já tem no celular`,`O entregador passou a ver a ROTA MONTADA dele, numerada na ordem, com endereço, cliente e quanto receber em cada porta`,`BOTÃO "🏁 Finalizar viagem" para quando o aparelho do motoboy não estiver mandando posição (sem bateria, sem sinal, aplicativo fechado) — e o registro do dia diz se a viagem fechou pelo retorno do aparelho ou à mão, e por quem`,`DUAS TELAS VIRARAM UMA: "Gestão de Entrega" e "Entregas" eram a mesma coisa pela metade. Agora é uma só — fila, colunas por motoboy, ordem das paradas, mapa do trajeto, copiar link, despachar, viagens na rua e registro do dia`,`Dentro de cada viagem agora aparecem: selo de bairro longe, quanto o motoboy leva em cobranças, o trajeto no mapa e o botão de copiar o link para mandar para ele`,`O cadastro de entregadores passou para o "App do entregador", onde já ficam o aceite do gestor e a situação de cada um — inclusive inativar quem saiu`,`Quilometragem da viagem passou a sair do trajeto de verdade, não mais de estimativa por bairro`],correcoes:[`A soma de quilômetros por motoboy arredondava a cada viagem, acumulando erro no total do dia; agora soma tudo e arredonda uma vez só`,`As telas ao vivo podiam ficar paradas no tempo: guardavam o resultado pela identidade da lista de viagens, que o motor altera por dentro`]},{version:`0.12.0`,date:`2026-08-25`,titulo:`A base não zera mais: histórico, fechamento por jornada e a tela de Gerência`,melhorias:[`OS PEDIDOS NÃO SOMEM MAIS: tudo o que termina — entregue ou cancelado — entra numa base histórica que sobrevive a recarregar a página e a fechar o navegador`,`A JORNADA ZERA SÓ À MEIA-NOITE: às 00h o dia é fechado, o quadro começa limpo e o histórico continua inteiro para consulta`,`Viagem em andamento e pedido ainda vivo atravessam a virada — ninguém perde trabalho no meio`,`NOVA TELA "📊 Gerência": faturamento, ticket médio, taxa de cancelamento, dinheiro em aberto e fatia de venda fechada pelo atendente automático`,`Filtro por LOJA (cada CNPJ) e por período: hoje, últimos 7 dias e últimos 30 dias`,`CURVA DE PRODUTOS: o que vende mais e o que só ocupa lugar, classificado em A (faz 80% do dinheiro), B (sustenta) e C (candidato a sair do cardápio)`,`RITMO DE CADA SETOR medido de verdade, contra meta: atendimento/caixa (aceitar o pedido), cozinha (preparo), expedição (prato pronto até sair com o motoboy) e entrega (saída até a porta do cliente)`,`O SETOR QUE ESTÁ SEGURANDO A OPERAÇÃO aparece destacado, com quanto está acima da meta e o que fazer a respeito`,`Além da média, o "pior caso": o tempo abaixo do qual ficam 9 de cada 10 pedidos — é ele que mostra o dia ruim`,`GRÁFICOS na página: movimento por hora do dia, faturamento por canal, por dia da semana, por bairro e comparação entre as lojas`,`"O QUE OS NÚMEROS ESTÃO PEDINDO": frases de decisão montadas dos próprios dados — cardápio, escala, pico, concentração de canal, dinheiro na rua — e só aparecem quando há dado que as sustente`,`REGRA DE VERSÃO combinada: até 5 melhorias anda 1 no último número, de 6 a 10 anda 2, e assim por diante; pacote grande anda o número do meio. Um teste confere isso sozinho a cada entrega`],correcoes:[`A classificação da curva de produtos jogava para a classe B o prato que sozinho já passava dos 80% do faturamento — justamente o mais importante da casa. Agora quem cruza a linha continua classe A`]},{version:`0.11.0`,date:`2026-08-25`,titulo:`App do entregador: ele se cadastra, o gestor aceita, a viagem chega no celular`,melhorias:[`NOVA TELA "📱 App do entregador": é a tela que o motoboy vê no celular dele, aqui dentro da simulação para você acompanhar`,`ESCOLHER O ENTREGADOR: um seletor troca a visão — dá para ver o mesmo aplicativo pelos olhos de cada motoboy`,`CADASTRO PELO PRÓPRIO ENTREGADOR: nome, CPF, CNH com a validade, telefone, endereço completo e placa da moto`,`CPF e CNH conferidos de verdade pelos dígitos do documento: erro de digitação é recusado na hora, dizendo o que está errado`,`ELE NÃO ENTRA NA ESCALA SOZINHO: o cadastro fica AGUARDANDO o gestor (ou o caixa) aceitar — e a lista lateral mostra quem está esperando, com o botão de aceitar`,`BATER PONTO: "Cheguei, estou na loja" / "Encerrar por hoje" — só quem avisou que chegou entra no rodízio de viagens`,`A VIAGEM CHEGA NO CELULAR DELE: endereço de cada parada, cliente, quanto receber na porta, e o botão "Entreguei" por parada`,`OCORRÊNCIAS pelo aplicativo do entregador: problema na moto, blitz, trânsito, cliente ausente, entregador recusou e roubo — vão direto para a viagem e para o registro do gestor`,`O DIA DELE em números: viagens, entregas, quilômetros e quanto já recolheu de dinheiro`],correcoes:[`A escolha automática de motoboy pegava qualquer um cadastrado; agora só entra no rodízio quem foi aceito pelo gestor E avisou que está na loja`]},{version:`0.10.0`,date:`2026-08-25`,titulo:`Arrastar e soltar as entregas, e montar a viagem à mão`,melhorias:[`ARRASTAR E SOLTAR: pegue o cartão da entrega e largue na coluna de outro motoboy — sai de um, entra no outro, sem menu nenhum`,`Arraste também para DENTRO de uma viagem específica, quando o motoboy tem mais de uma`,`Arraste de volta para "sem motoboy" para tirar o pedido de quem estiver com ele`,`BOTÃO "+ VIAGEM" em cada motoboy: cria a viagem vazia e você vai arrastando os pedidos para dentro, na ordem que quiser`,`A viagem montada à mão mostra a loja de coleta, os bairros na ordem e os quilômetros conforme você monta`,`Enquanto o cartão está no ar, os destinos possíveis ficam acesos — não tem como largar no lugar errado`,`Quem prefere clicar continua com a marcação e o "mover para": os dois caminhos convivem`,`Pedido que já saiu para entrega não se arrasta — ele está na rua com o motoboy`],correcoes:[`Mover um pedido "para ninguém" criava uma viagem fantasma sem dono; agora ele volta direto para a fila "sem motoboy"`]},{version:`0.9.0`,date:`2026-08-25`,titulo:`Viagens do motoboy: o GPS fecha, o registro guarda`,melhorias:[`VIAGEM DE VERDADE: despachar um motoboy abre uma VIAGEM numerada, com a loja de coleta, os bairros na ordem, as paradas, a quilometragem prevista e a hora da saída`,`O APARELHO DO MOTOBOY MANDA A POSIÇÃO: dá para acompanhar na tela a que distância da loja ele está, e as entregas vão caindo sozinhas conforme ele passa em cada endereço — está assim na simulação, para você ver acontecer`,`A VIAGEM SE FECHA SOZINHA: entregou tudo e o aparelho voltou para a porta da loja? Viagem encerrada, sem ninguém precisar lembrar de clicar`,`Viagem concluída SAI da tela de quem despacha (gestor de entrega ou caixa, conforme a configuração) e vai para o REGISTRO DO DIA`,`REGISTRO DO DIA com tudo o que o gestor confere, na ordem de quem lê: nº da viagem, motoboy, loja, saiu, voltou, tempo, bairros, pedidos, entregues, quilômetros, minutos por entrega, dinheiro recolhido e ocorrências`,`Botão para copiar o registro inteiro para a planilha`,`OCORRÊNCIAS na viagem: problema na moto, blitz, trânsito, cliente ausente e roubo — apontadas durante a viagem e guardadas no registro`,`Cada entrega feita na viagem entra na linha do tempo do pedido: "🛵 Entregue por Jefferson · viagem 3"`,`Enquanto a viagem corre, a tela mostra quanto o motoboy já recolheu de dinheiro na porta`],correcoes:[]},{version:`0.8.0`,date:`2026-08-25`,titulo:`Guardrail de conformidade e conversa com o cliente sem sair do sistema`,melhorias:[`GUARDRAIL DE CONFORMIDADE: 16 regras das plataformas viraram teste automático — se algum desenvolvimento, hoje ou amanhã, esbarrar em regra de iFood, Keeta ou 99Food, a construção FALHA antes de chegar na homologação`,`Nova aba 🛡️ Conformidade nas Configurações: cada regra com o que a plataforma exige, o risco de descumprir, como o sistema cumpre e o estado agora (tudo certo / atenção / com você)`,`A tela separa o que o sistema garante sozinho do que depende de configuração e do que depende de pessoa (Carlos assinar a conta de desenvolvedor, agendar a sessão de homologação, vincular as lojas)`,`FALAR COM O CLIENTE NÃO SAI MAIS DO SISTEMA: o botão abre a conversa aqui dentro, pela mesma via em que o pedido chegou — nosso WhatsApp leva ao MESMO fio em que o pedido caiu; pedido de plataforma abre o chat dela, e a rotina manda a mensagem pela interface da própria plataforma`,`Botão "💬 falar" também no cartão do pedido, para chamar o cliente sem abrir nada`,`HISTÓRICO NO PEDIDO: tudo o que é dito ao cliente — por você ou pelo atendente automático — fica gravado na linha do tempo daquele pedido, com a hora e por qual via`,`Cada conversa mostra o selo da via (nosso WhatsApp, chat do iFood, da Keeta, da 99Food) na lista e no cabeçalho`,`Quando o pedido da plataforma termina, o chat dela fecha — e a tela explica isso em vez de deixar a pessoa escrevendo no vazio`,`A aba passou a se chamar 💬 Conversas: agora ela guarda todas as vias, não só o WhatsApp`,`Respostas rápidas mudam conforme a via: no nosso WhatsApp fala-se de Pix, troco e endereço; no chat da plataforma, só de preparo, prazo, troca de item e saída — combinar pagamento por fora ali é violação de política`,`A linha do tempo do pedido saiu do inglês: "pedido recebido", "pedido aceito", "saiu para entrega" — e as falas da conversa aparecem nela em verde`,`PEDIDO NO CARTÃO DA CONVERSA: depois que a conversa vira pedido, o cartão dela mostra o nº do chamado, em que etapa está e como está o dinheiro`,`PAGO x ABERTO: pedido pago pelo aplicativo já nasce quitado; pedido que paga na porta (dinheiro, maquininha, Pix na hora) fica ABERTO — é dinheiro na rua`,`BAIXA DO CAIXA: botão "💰 Receber" no cartão e no detalhe; o caixa escolhe a forma (dinheiro com o troco calculado, maquininha de crédito/débito, Pix na hora, vale) e o pedido passa a "✅ recebido", com quem confirmou na linha do tempo`,`O rodapé passou a mostrar quanto está EM ABERTO agora, além do que está na rua`],correcoes:[`A ficha do cliente oferecia "Falar no WhatsApp" abrindo o aplicativo por fora, inclusive para quem chegou pelo iFood/Keeta/99Food. Isso é violação de política das três, com risco de punição da loja — e ainda não funcionava, porque o telefone que elas entregam é intermediado. Agora a conversa é sempre por dentro, pela via certa`,`O detalhe do pedido também abria o WhatsApp por fora: passou a abrir a conversa do próprio pedido`,`"Converter em pedido" aparecia em conversa de plataforma, onde o pedido já existe — agora só no canal próprio`]},{version:`0.7.0`,date:`2026-08-25`,titulo:`Gestão de Entrega, papéis e operadores do sistema`,melhorias:[`DISPONÍVEL PARA ENTREGA: pedido pronto de entrega própria não tem mais o botão "Saiu para entrega" no cartão — ele fica aguardando alguém despachar, como é na vida real`,`TELA GESTÃO DE ENTREGA: uma coluna por motoboy com as entregas dele, a fila "sem motoboy" ao lado, e o botão "🛵 Despachar" — é aqui, e só aqui, que o pedido vira "saiu para entrega"`,`Marque um ou vários pedidos e passe para outro motoboy antes de despachar`,`RODÍZIO POR QUILOMETRAGEM: a sugestão dá a viagem ao motoboy livre com menos km hoje; a tela mostra km de cada um, entregas do dia e km da viagem atual — no fim do dia todos rodaram parecido`,`Novo perfil de monitor: GESTOR DE ENTREGA, com tela própria`,`Nas Configurações, escolha quem despacha: o Gestor de Entrega ou o próprio Caixa — quando é o caixa, a tela de gestão aparece para ele também`,`OPERADORES DO SISTEMA: cadastro com nome, CPF (validado de verdade), telefone, e-mail, atribuições (quais telas ele assume) e ativo/inativo`,`Importar a equipe inteira de uma planilha (colar do Excel ou arquivo), com aviso claro de linha recusada e por quê; exportar também`,`Entrar no sistema com usuário e senha: cada pessoa abre direto na tela da função dela e só troca entre as atribuições que tem`,`Quem sai da empresa vira inativo — não entra mais, mas continua no histórico dos pedidos que atendeu`],correcoes:[]},{version:`0.6.0`,date:`2026-08-25`,titulo:`Clientes (CRM) e o robô cuidando também de quem já pediu`,melhorias:[`TELA CLIENTES: a ficha de cada cliente se monta sozinha — telefone, endereços que já usou, como costuma pagar, o que mais pede, quantos pedidos, quanto já gastou, ticket médio, cancelados e há quantos dias não compra`,`Resumo no alto: faturamento por cliente, quantos voltaram a comprar e quantos sumiram há mais de 15 dias (para chamar de volta)`,`Quem só conversou pelo WhatsApp, sem comprar, também vira ficha — é cliente em potencial`,`Botão para copiar todos os clientes para a planilha`,`PÓS-VENDA PELO ROBÔ: quem já tem pedido em andamento agora é atendido também — "quanto tempo falta?" responde o estado real do pedido; "manda troco pra R$ 100" anota o troco no cartão; "tira a cebola" vira recado para a cozinha (se ainda der tempo); "me liga quando chegar" vira observação para o entregador`,`Mais conversas chegando (uma a cada ~5 minutos) para dar para acompanhar o atendente trabalhando de verdade`],correcoes:[`Conversa sobre um pedido em andamento nascia no meio ("manda troco pra R$ 100", sem contexto) e ficava PARADA, porque ia direto para uma pessoa. Agora abre como gente abre ("Oi! É sobre o pedido #1204 — …") e o atendente responde na hora`,`Pedido de ajuste em pedido que já saiu da cozinha passa para uma pessoa em vez de prometer o que não dá`]},{version:`0.5.0`,date:`2026-08-25`,titulo:`Atendente automático do WhatsApp: vende sozinho`,melhorias:[`O ROBÔ ATENDE E VENDE: lê a mensagem do cliente, entende o que é do cardápio, pergunta quando fica em dúvida ("é a Marmita P ou a G?"), combina entrega ou retirada, endereço, pagamento — e REGISTRA o pedido sozinho na esteira de produção`,`Fala como gente: frases curtas, informais e variadas — nunca repete a mesma frase na mesma conversa (são vários jeitos de dizer cada coisa)`,`Responde já no primeiro contato, com saudação sorteada, e conduz o cliente até fechar`,`Pagamento completo: pix (manda a CHAVE DA LOJA e espera o comprovante antes de mandar para a cozinha), cartão (avisa que o motoboy leva a maquininha) e dinheiro (pergunta se precisa de troco e para quanto — o valor vai no cartão do pedido)`,`O cliente pode MUDAR O PEDIDO no meio da conversa: acrescentar item, tirar item, ou desistir — tudo aparece na conversa e o total se ajusta`,`Travas de segurança: acima do valor máximo configurado ele não fecha sozinho; reclamação, pedido de falar com uma pessoa ou item fora do cardápio passam a conversa para o balcão na hora`,`Na tela do WhatsApp: selo 🤖 nas falas do robô, quadro com "o que o atendente já entendeu" (itens e total) e botões "Assumir conversa" / "Devolver ao atendente"`,`Três modos nas Configurações: só sugerir a resposta, conversar sozinho, ou conversar e registrar — com demora de resposta e nome de apresentação ajustáveis`,`Pedido fechado pelo robô nasce com o selo "🤖 fechado pelo atendente" no quadro`,`A tela "Parâmetros" passou a se chamar "Configurações"`],correcoes:[`O robô apagava o pedido quando o cliente escrevia "retirada" (a palavra contém "tira", que ele lia como "tirar item") — comparação agora é por palavra inteira`,`Resposta de pagamento com "troco p/ R$ 100" era lida como o prato "Marmita P" e travava a conversa em laço`]},{version:`0.4.3`,date:`2026-08-25`,titulo:`Correções de conta no pedido manual`,melhorias:[`Revisão automática do código encontrou e travou com teste três erros de conta antes que chegassem na loja`],correcoes:[`RECUPERAR VENDA: ao tocar num prato do cardápio, o valor do pedido cancelado era apagado e a loja cobraria só o item tocado (um pedido de R$ 67,80 virava R$ 7,00). Agora o valor que veio pronto é preservado, com o botão "usar este total" quando você quiser a soma do cardápio`,`O texto avulso deixou de virar um item de R$ 0,00 quando não sobra valor — nesse caso ele entra como observação do pedido (a cozinha via um prato para produzir de graça)`,`Colar do Excel com as colunas de preço vazias no fim voltou a limpar os ajustes por canal (o item volta a herdar o preço global)`,`O pedido com itens do cardápio agora chega inteiro ao programa da loja (a lista de pratos estava sendo descartada na entrada)`]},{version:`0.4.2`,date:`2026-08-24`,titulo:`WhatsApp e balcão com cardápio próprio`,melhorias:[`O WhatsApp/balcão virou canal de venda como os outros no Cardápio: aba própria, herdando o global até você dar um preço só dele — útil porque o canal próprio não paga comissão e pode sair mais barato`,`Canal próprio não pede publicação: o preço vale na hora (a barra de publicação continua só para iFood, Keeta e 99Food)`,`NO PEDIDO WHATSAPP/BALCÃO: o cardápio de hoje aparece em botões — um toque põe o prato, com quantidade no + e −, e o TOTAL É SOMADO SOZINHO com o preço do canal`,`O total continua editável para desconto ou combinado com o cliente, com o botão "usar este total" para voltar à soma do cardápio`,`O que estiver fora do cardápio continua como texto avulso, na mesma tela`,`O pedido nasce com os itens de verdade (nome, quantidade e preço), e não mais uma linha de texto — o fechamento do dia fica correto`,`Planilha do cardápio ganhou a coluna preco_whatsapp (exporta e importa junto com as outras)`,`Transferências valem para o canal próprio: dá para copiar o global para o WhatsApp, ou promover os preços do WhatsApp ao global`],correcoes:[]},{version:`0.4.1`,date:`2026-08-24`,titulo:`Dois computadores, os mesmos pedidos`,melhorias:[`Os pedidos novos da simulação agora seguem o RELÓGIO com semente fixa: dois computadores com a página aberta veem os MESMOS pedidos, conversas e cancelamentos chegando nos mesmos minutos — sem servidor e sem conta`,`Vale para demonstrar por telefone: "olha o pedido que acabou de tocar" é o mesmo número, mesmo prato e mesmo cliente nas duas telas`,`O que continua individual em cada tela (de propósito): os cliques de cada um (aceitar, pronto, entregar), o quadro de abertura e os pedidos digitados à mão — no aplicativo real da loja, as telas são espelhadas de verdade pela rede, como o modo 4 telas mostra`,`Números de pedido da agenda derivados do horário (não se repetem no dia e não conflitam com os do quadro de abertura)`],correcoes:[]},{version:`0.4.0`,date:`2026-08-24`,titulo:`Gerenciador de cardápios e rotas com coerência`,melhorias:[`CARDÁPIO POR DIA: cada item marca em quais dias da semana vale (filtro "Hoje"); pedido novo da simulação só traz prato do dia, com o preço do canal`,`Transferir/importar cardápio: importar DA plataforma para o global (item que só existe lá é criado, preço defasado é atualizado) e copiar entre global ↔ plataformas com um clique`,`Carga em lote: cole direto do Excel/planilha ou envie arquivo; exportar no mesmo formato para editar fora e trazer de volta`,`Fotos dos pratos com leitura automática: na simulação pelo nome do arquivo (declarado na tela); no aplicativo instalado, por inteligência artificial de visão que reconhece o prato pela imagem`,`Busca, filtro por categoria, criar e remover item direto na tela do Cardápio`,`ROTAS COERENTES: uma loja por rota (coleta num lugar só), bairros vizinhos juntos e na ordem geográfica, máximo de entregas por viagem nos Parâmetros`,`Bairro LONGE segura a rota: só solta com o mínimo de entregas juntas ou após a espera máxima — nada de viagem atravessando a cidade por 1 pedido`,`Pedido de bairro longe com rota juntando ganha o selo "🚀 ADIANTAR" na cozinha e sobe na coluna — sai na mesma viagem do motoboy`,`Escolha automática do motoboy: o LIVRE com MENOS entregas hoje (revezamento justo, contagem visível); a troca manual continua valendo`,`Link do Google Maps agora parte do endereço da loja com as paradas na ordem`],correcoes:[]},{version:`0.3.8`,date:`2026-08-24`,titulo:`Retirada no balcão de ponta a ponta`,melhorias:[`No pedido WhatsApp/balcão, escolha em destaque "Como o cliente recebe?": 🛵 Entrega ou 🛍️ Retirada no balcão (o endereço some e a cobrança vira "Cobrar na retirada")`,`Pedido pronto de retirada ganhou o botão "🛍️ Retirado ✓" no caixa e no gestor — conclui na hora, sem passar pela etapa de entrega`,`Cartão com selo roxo "🛍️ RETIRADA NO BALCÃO" e detalhe do pedido indicando que o cliente vem buscar`,`Cliente do WhatsApp também combina retirada na conversa — "Converter em pedido" já vem com 🛍️ marcado (conversa do Roberto Lima na simulação)`,`Tela da cozinha mostra "no balcão — cliente vem retirar" quando o pedido de retirada fica pronto; a tela dos entregadores não recebe retiradas`,`Exemplo pronto ao abrir a simulação (Cláudia Nunes, cobrar na retirada) para testar o botão`],correcoes:[`A opção de retirada existia escondida numa caixinha pequena do formulário — fácil de passar despercebida`,`Título das janelas (detalhe do pedido, novo pedido, histórico) estava branco sobre branco — invisível`]},{version:`0.3.7`,date:`2026-08-24`,titulo:`Recuperar venda só no canal próprio (WhatsApp)`,melhorias:[`"Recuperar venda" agora aparece SOMENTE em pedido cancelado do WhatsApp — o cliente das plataformas é relacionamento delas (contato direto para fechar por fora pode gerar punição)`,`Pedido cancelado das plataformas fica com "Ciente" (arquivar); a trava vale na tela e no motor`],correcoes:[]},{version:`0.3.6`,date:`2026-08-24`,titulo:`Rodapé por função e cadastro de lojas`,melhorias:[`Rodapé repensado por tela: cozinha vê "para começar / em produção / prontos / recados sem resposta / preparo médio"; entregadores veem "prontos p/ rota / em rota / levar em cobranças / rotas sem motoboy"; caixa vê fila, aceite médio, a receber na entrega, mensagens não lidas e concluídos; gestor vê o consolidado com faturamento`,`Lojas parametrizáveis: botão "Adicionar loja (CNPJ)" na aba Lojas dos Parâmetros — a loja nova entra automaticamente nas conexões das plataformas, no pedido WhatsApp e no fechamento`,`Remoção de loja com confirmação em dois toques; pedidos antigos permanecem no histórico; a última loja não pode ser removida`],correcoes:[]},{version:`0.3.5`,date:`2026-08-24`,titulo:`Corrigir clique errado: Desfazer e Movimentos de hoje`,melhorias:[`Ao avançar um pedido, aparece "↩ Desfazer" por 8 segundos — o erro percebido na hora se resolve com um toque, sem chamar o gestor`,`Botão "↩ Movimentos" em todas as telas: lista só os pedidos movimentados hoje (o mais recente no topo) com "Voltar etapa"`,`Cada perfil vê apenas os movimentos do seu tipo (cozinha: preparo/pronto; entregadores: saiu/entregue); o gestor vê tudo e pode voltar qualquer pedido, até concluído/arquivado`,`Toda correção fica registrada na linha do tempo do pedido ("etapa voltada: Pronto → Em preparo")`,`Regra de honestidade: o quadro interno volta, mas a plataforma não desfaz o que já recebeu — aceite e cancelamento não voltam`],correcoes:[]},{version:`0.3.4`,date:`2026-08-24`,titulo:`Escolher para qual tela voltar`,melhorias:[`No modo 4 telas, cada quadro ganhou o botão "⤢ ampliar": abre a tela daquele funcionário em tamanho cheio`,`Ao voltar para 1 tela, o painel abre no perfil escolhido — não volta mais sempre para o gerencial`,`Recado para a cozinha com botões de sugestão de texto (um toque preenche; dá para combinar e editar antes de enviar)`],correcoes:[]},{version:`0.3.3`,date:`2026-08-24`,titulo:`Comunicação caixa ↔ cozinha com confirmação OK/NOK`,melhorias:[`Recado do caixa chega PISCANDO no cartão da tela da cozinha, com aviso sonoro repetido até a resposta`,`Cozinha responde com um toque em opções pré-cadastradas: ENTENDIDO, AJUSTADO, DÁ SIM / NÃO DÁ, ITEM EM FALTA, VAI ATRASAR`,`A resposta volta ao cartão do caixa e do gestor como selo verde OK ou vermelho NOK, com o texto escolhido`,`Aviso sonoro no caixa quando a resposta chega (toque duplo quando é NOK)`,`Detalhe do pedido mostra a situação do recado: aguardando, OK ou NOK`],correcoes:[]},{version:`0.3.2`,date:`2026-08-24`,titulo:`Identidade do app, histórico de versões e modo 4 telas`,melhorias:[`Nome do aplicativo (xcodef-delivery) e versão visíveis no topo e no rodapé`,`Clique na versão abre este histórico de melhorias e correções`,`Histórico permanente: gravado no repositório e embutido em todas as versões publicadas`,`Modo 4 telas: gestor, caixa, cozinha e entregadores lado a lado, sincronizados em tempo real — aja numa tela e veja as outras reagirem`,`No sistema real da loja cada monitor abre o painel pela rede e escolhe seu perfil — a sincronização entre telas é nativa`],correcoes:[]},{version:`0.3.1`,date:`2026-08-24`,titulo:`Cliente do WhatsApp interage até fechar a venda`,melhorias:[`Cliente simulado responde à loja: confirma itens, informa endereço, escolhe pagamento e pede para registrar`,`"Converter em pedido" já vem preenchido com o que o cliente disse na conversa`,`Cliente agradece após o pedido registrado; conversas ligadas a pedido também respondem`,`Teste automatizado do fluxo de conversa rodando a cada entrega`],correcoes:[`Conversas não ficavam mais mudas após a resposta da loja`]},{version:`0.3.0`,date:`2026-08-24`,titulo:`Parâmetros completos, perfis de monitor e novas telas`,melhorias:[`Painel de Parametrizações com a hierarquia do produto: específico da plataforma → global ("herdar do global")`,`Conexão por plataforma: iFood (clientId/secret + lojas), Keeta (conta MARCA), 99Food (AppShopID por loja), WhatsApp (pareamento por QR)`,`Cadastro completo por loja: razão social, CNPJ, inscrição estadual, endereço, telefones, logo, cor e horários`,`Aceite automático com espera e trava de capacidade; iniciar preparo junto com o aceite; modos de entrega por canal`,`Perfis de monitor: Gestor, Caixa, Cozinha e Entregadores — cada tela com suas colunas e botões; concluídos só no gestor`,`WhatsApp como canal de venda na mesma esteira: conversas, respostas rápidas e conversão em pedido`,`Selo 💬 com som no cartão quando o cliente manda mensagem sobre o pedido; recado para a cozinha; "Falar com o cliente"`,`Cardápio global + ajustes por plataforma, reajuste % em lote e publicação por canal`,`Entregas: motoboys, rotas agrupadas por bairro e link do Google Maps com as paradas na ordem`,`Fechamento diário e mensal com exportação CSV no contrato do ERP`,`Rodapé funcional: fila ao vivo, tempo médio de aceite, próximo agendado, sincronização, conexões e faturamento (gestor)`],correcoes:[`Botão de som virou alternância fixa (não desaparece mais) com preferência lembrada`,`Recuperar venda passou a ser operação única: trava de duplicidade e o cancelado sai do quadro sozinho`,`Pedidos do WhatsApp não sofrem mais cancelamento aleatório na simulação`]},{version:`0.2.1`,date:`2026-08-24`,titulo:`Destinos para retirada pronta e pedidos cancelados`,melhorias:[`Retirada pronta ganhou o botão "Cliente retirou" (concluía e não entupia mais a coluna Prontos)`,`Cancelados com destinos: "Ciente" (arquiva, mantém no histórico) e "Recuperar venda" (vira pedido WhatsApp sem comissão)`,`Motivo e autor do cancelamento visíveis no cartão`,`Textos de espera contextuais: "aguardando coleta do entregador…", "entregador levando ao cliente…"`],correcoes:[`Pedido agendado não mostrava mais a contagem regressiva de aceite imediato`]},{version:`0.2.0`,date:`2026-08-24`,titulo:`Simulação completa no ar`,melhorias:[`Painel kanban único das 3 lojas × 3 plataformas + WhatsApp, publicado num link permanente para testar sem instalar nada`,`Alarme sonoro em loop até aceitar, com escalada e prazo de aceite por pedido (cancelamento automático ao estourar)`,`Fluxo completo do operador com ida e volta simulada às plataformas ("sincronizando…" → confirmado)`,`Entrada manual de pedido WhatsApp/balcão`,`Destaque "COBRAR na entrega" com troco; entregador da plataforma coleta sozinho`],correcoes:[]},{version:`0.1.0`,date:`2026-08-23`,titulo:`Fundação: pesquisa verificada, arquitetura e núcleo`,melhorias:[`Pesquisa com fontes oficiais: iFood, Keeta e 99Food convergem no mesmo desenho de integração (polling + confirmação)`,`Arquitetura fechada: modelo canônico Open Delivery, adaptadores por plataforma, tabela mestra de status`,`Decisão de stack: Electron + TypeScript, com alarme sob controle total`,`Núcleo em código com testes: máquina de estados, tradutores, fila de reenvio (outbox), cliente Open Delivery, assinatura Keeta`,`Plataforma simulada (mock) para desenvolver sem credenciais`],correcoes:[]}],p=f[0].version,m={CREATED:`Recebido`,CONFIRMED:`Aceito`,PREPARING:`Em preparo`,READ  — o pior defeito possível numa loja.`,comoCumprimos:`O adaptador do iFood consulta sem query de filtro, com comentário explicando a armadilha (src/core/adapters/ifood/ifood-adapter.ts).`,severidade:`operacao`,verificacao:`no-codigo`},{id:`prazo-aceite`,plataforma:`ifood`,titulo:`Aceitar dentro do prazo de 8 minutos`,exigencia:`O iFood cancela sozinho o pedido não aceito em 8 minutos a partir do início previsto de preparo.`,risco:`Cancelamento automático, nota do restaurante e reclamação do cliente.`,comoCumprimos:`Contagem regressiva no cartão, alarme em laço até o aceite e escalada sonora — é a razão de ser do produto.`,severidade:`operacao`,verificacao:`no-codigo`},{id:`polling-e-presenca`,plataforma:`ifood`,titulo:`Parar de consultar significa loja fechada`,exigencia:`O iFood usa a consulta como sinal de presença: se o programa para, a loja aparece fechada no aplicativo.`,risco:`Loja invisível para o cliente sem ninguém perceber.`,comoCumprimos:`Saúde de cada fonte no rodapé, recuo progressivo sem desligar a fonte e aviso visível quando uma conexão cai.`,severidade:`operacao`,verificacao:`no-codigo`},{id:`keeta-assinatura`,plataforma:`keeta`,titulo:`Assinar todas as chamadas da Keeta`,exigencia:`Cada requisição leva assinatura (resumo criptográfico) calculada sobre os parâmetros ordenados e o corpo normalizado.`,risco:`Chamada recusada; integração não passa nos testes conjuntos.`,comoCumprimos:`Gerador de assinatura próprio, com teste dedicado (src/core/adapters/keeta/signature.ts).`,severidade:`homologacao`,verificacao:`no-codigo`},{id:`sem-regressao-de-status`,plataforma:`todas`,titulo:`Nunca voltar o status na plataforma`,exigencia:`O ciclo de vida do pedido é para frente; enviar um estado anterior é erro de integração.`,risco:`Reprovação na homologação e pedido inconsistente para o cliente.`,comoCumprimos:`A máquina de estados recusa regressão; a correção de clique errado reorganiza o quadro interno e NÃO reenvia à plataforma.`,severidade:`homologacao`,verificacao:`no-codigo`},{id:`idempotencia`,plataforma:`todas`,titulo:`Repetir a mesma ação não pode duplicar nada`,exigencia:`Confirmação repetida é ignorada pelo iFood; a Keeta responde 422 para o que já foi processado.`,risco:`Pedido duplicado ou erro em cascata na fila de reenvio.`,comoCumprimos:`Fila de reenvio idempotente com recuo progressivo e teste próprio (src/core/engine/outbox.ts).`,severidade:`homologacao`,verificacao:`no-codigo`},{id:`nao-levar-cliente-para-fora`,plataforma:`todas`,titulo:`Não puxar o cliente da plataforma para o canal próprio`,exigencia:`Usar os dados de um pedido da plataforma para vender por fora é violação de política das três.`,risco:`Punição, suspensão da loja ou descredenciamento — o pior risco comercial do projeto.`,comoCumprimos:`"Recuperar venda" só aparece em pedido cancelado do WhatsApp, com trava na tela, no motor e no programa da loja; a ficha do cliente marca contato de plataforma e não oferece conversa por fora.`,severidade:`politica`,verificacao:`no-codigo`},{id:`conversa-dentro-do-sistema`,plataforma:`todas`,titulo:`Falar com o cliente sem sair do sistema`,exigencia:`A conversa com quem pediu por uma plataforma tem de acontecer pelo canal da própria plataforma (chat do pedido, pela interface dela). O telefone que elas entregam é intermediado: usá-lo em WhatsApp, ligação de venda ou promoção é violação.`,risco:`Punição por contato indevido, e ainda por cima uma conversa que o cliente não recebe (o número intermediado não atende em outro aplicativo).`,comoCumprimos:`O botão "Falar com o cliente" NUNCA abre aplicativo de fora: abre a conversa aqui dentro, no canal em que o pedido caiu — nosso WhatsApp no mesmo fio, ou o chat da plataforma pela interface dela (src/core/chat/conversa.ts). Encerrado o pedido, o canal da plataforma fecha e a tela explica o porquê. Tudo o que é dito fica gravado na linha do tempo do pedido.`,severidade:`politica`,verificacao:`no-codigo`},{id:`pagamento-nao-sai-da-plataforma`,plataforma:`todas`,titulo:`No chat da plataforma não se combina pagamento por fora`,exigencia:`O pagamento do pedido feito no iFood, na Keeta ou na 99Food é delas. Oferecer Pix da loja, troco ou maquininha nesse chat é desviar a venda.`,risco:`Violação de política — punição, suspensão e perda do repasse do pedido.`,comoCumprimos:`As respostas rápidas do chat de plataforma não falam de dinheiro: são sobre preparo, prazo, troca de item e saída para entrega. Só o canal próprio (nosso WhatsApp/balcão) fala de Pix, troco e maquininha (src/ui/views/WhatsView.tsx).`,severidade:`politica`,verificacao:`no-codigo`},{id:`dados-do-cliente`,plataforma:`keeta`,titulo:`Dados pessoais do cliente ficam onde precisam ficar`,exigencia:`A Keeta entrega dados do cliente criptografados fora da entrega própria; o uso é restrito à execução do pedido.`,risco:`Violação de contrato e de proteção de dados.`,comoCumprimos:`Nada de exportar contato de pedido de plataforma para uso comercial; a ficha do cliente separa o que veio de canal próprio.`,severidade:`politica`,verificacao:`no-codigo`},{id:`simulacao-nao-vaza`,plataforma:`todas`,titulo:`Pedido de teste nunca vira pedido de verdade`,exigencia:`O ambiente de teste é separado; enviar ação de teste para produção contamina a loja real.`,risco:`Pedido fantasma na operação e desconfiança na homologação.`,comoCumprimos:`Todo pedido gerado na simulação nasce marcado como teste e a simulação não fala com rede nenhuma.`,severidade:`operacao`,verificacao:`no-codigo`},{id:`whatsapp-sem-ponte-nao-oficial`,plataforma:`whatsapp`,titulo:`Não automatizar o número principal por ponte não oficial`,exigencia:`Os termos do WhatsApp proíbem acesso por meios não autorizados; contas assim podem ser banidas sem aviso.`,risco:`Perder o número de vendas da loja, sem prazo de recurso.`,comoCumprimos:`O atendente automático funciona no modo "só sugerir" (a pessoa envia) e na interface oficial da Meta; a ponte não oficial fica como escolha explícita e avisada.`,severidade:`operacao`,verificacao:`na-configuracao`},{id:`atendente-nao-promete-o-que-nao-pode`,plataforma:`whatsapp`,titulo:`O atendente automático não decide sozinho o que é do dono`,exigencia:`Boas práticas de atendimento: valor alto, reclamação e pedido de atendimento humano precisam de gente.`,risco:`Prejuízo por pedido errado e cliente irritado sem resposta.`,comoCumprimos:`Teto de valor, escalada automática em reclamação, pedido de pessoa e item fora do cardápio; tudo ajustável nas Configurações.`,severidade:`operacao`,verificacao:`na-configuracao`},{id:`app-privado-homologado`,plataforma:`ifood`,titulo:`Aplicativo privado e homologação concluída antes da produção`,exigencia:`Só aplicativo homologado recebe acesso às lojas de produção; o nosso é privado (das lojas do cliente, não de marketplace).`,risco:`Sem homologação não existe produção — é o caminho crítico do projeto.`,comoCumprimos:`O roteiro oficial de homologação vira teste automatizado antes de agendar a sessão.`,severidade:`homologacao`,verificacao:`com-a-pessoa`},{id:`credenciais-nao-vao-para-o-repositorio`,plataforma:`todas`,titulo:`Credencial nenhuma no código ou no site público`,exigencia:`Chaves de aplicativo e segredos ficam no computador da loja, nunca no código publicado.`,risco:`Vazamento de credencial, revogação pela plataforma e incidente de segurança.`,comoCumprimos:`As credenciais moram nas Configurações do programa instalado; o site público é só a simulação, sem chave nenhuma.`,severidade:`politica`,verificacao:`no-codigo`}];function ir(e){return rr.map(t=>{switch(t.id){case`whatsapp-sem-ponte-nao-oficial`:{let n=e.connections.whatsapp.modo;return e.connections.whatsapp.habilitada?n===`api-oficial`?{regra:t,estado:`ok`,detalhe:`usando a interface oficial da Meta`}:{regra:t,estado:`atencao`,detalhe:`ponte no computador da loja: use com número dedicado e ciência do risco de banimento, ou mantenha o atendente em "só sugerir"`}:{regra:t,estado:`ok`,detalhe:`canal WhatsApp desligado`}}case`atendente-nao-promete-o-que-n
