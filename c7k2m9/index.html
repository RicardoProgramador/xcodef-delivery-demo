to segura a loja. Cada recusa vem com o número e o nome — "1 viagem ainda na rua (Diego)" — e com o caminho para resolver. Atender, vender e despachar nunca olham para isso (regra 6)`,`FECHAR A LOJA MORA EM ABRIR LOJAS, com os botões se alternando: fechada oferece abrir, aberta oferece fechar. Fechou a loja, a tela convida para o fechamento de caixa; fechou o caixa, ela pergunta se quer fechar a loja. O caminho anda nos dois sentidos e ninguém precisa decorar a ordem`,`ENTREGAS VIROU CENTRAL DE ENTREGAS e absorveu o Mapa ao vivo e o App do entregador como botões internos. As telas são as mesmas — o que mudou é que os três ângulos da mesma operação de rua deixaram de ocupar três lugares numa barra que já tinha treze`,`ESTOQUE-SEMENTE, com a conta que confunde todo mundo resolvida (ADR-050): compra-se numa unidade e gasta-se em outra, e o fator é POR INSUMO — a caixa de um fornecedor tem 12, a do outro tem 24. O saldo vive sempre na unidade de consumo, que é como a cozinha pensa`,`FICHA TÉCNICA RECURSIVA: prato → componentes → sub-receitas → insumos. O molho da parmegiana é uma ficha com os insumos dele, e a explosão desce a árvore multiplicando. Receita que contém a si mesma é recusada NA GRAVAÇÃO, com a trilha do círculo na mensagem — descobrir isso na montagem, com a cozinha esperando, seria tarde`,`MONTOU O PRATO, O ESTOQUE BAIXA SOZINHO. E quando o saldo não dava, a baixa acontece assim mesmo e o negativo vira aviso: a comida saiu de verdade da cozinha; quem estava errado era o saldo. O mínimo por insumo alimenta a fila de Compras sem ninguém digitar "acabou o óleo"`,`FISCAL-SEMENTE (ADR-051): as notas que entram e as que saem, cada uma com um papel contábil de um plano parametrizável, a nota ligada aos movimentos de estoque que ela gerou, e o diário saindo tabulado por período e por CNPJ. É REGISTRO, não escrituração — imposto e livro continuam do Emissor e do contador`,`O GESTOR ESCOLHE O QUE CADA PESSOA VÊ (ADR-052). O pacote do papel (caixa, cozinha, produção) continua sendo o ponto de partida; a matriz por pessoa manda por cima dele, recorta pelo teto do gestor e nunca deixa ninguém sem o Painel`,`CENTRAL DE I.A. LOCAL — a bancada (ADR-053). Modelos que rodam NA MÁQUINA DA LOJA: conversa de cliente, nota fiscal e movimento não saem de lá. Seis funções, cada uma um interruptor com o estado dito na cara — desligada, funcionando ou SEM MOTOR quando ela precisa de modelo e o servidor não respondeu. Nada nasce ligado, nada age sozinho, e a casa inteira funciona com tudo desligado`,`A SENTINELA DE INTEGRIDADE, que é a função que já nasce trabalhando porque é regra, não modelo: ela vigia os invariantes e explica cada achado em português, com o endereço de onde resolver. Foi feita a partir de um flagrante do Ricardo — um prato "esperando a cozinha há 765 minutos" com a fila da cozinha vazia`,`O FECHAMENTO NARRADO em três parágrafos (o que vendeu, o que destoou, o que olhar amanhã) e a PREVISÃO por dia da semana, que diz em voz alta quantas amostras sustentam a média: com uma só, ela se chama de palpite`],correcoes:[`A GERÊNCIA APARECIA ZERADA na Central de verdade enquanto o Fechamento mostrava movimento — e as duas telas estavam certas cada uma no seu canto. A base histórica só era alimentada DENTRO do relógio da simulação; ligada à Central, o relógio não roda e nada entrava. Agora todo pedido que termina entra no registro, venha de onde vier`,`O CAIXA ABERTO SUMIA DA TELA quando a pessoa saía para outra aba e voltava: o campo do operador voltava vazio e a busca era por nome exato, então a tela pedia para abrir um caixa que já estava aberto. Achado pela régua nova do encadeamento, no primeiro dia dela`,`A MEDIÇÃO DO SERVIDOR DE MODELOS saiu do motor e foi para a tela. O motor da simulação não abre conexão nenhuma — é regra da casa, com régua que recusa — e eu a tinha furado sem perceber. A bancada fala com a máquina da loja; o motor continua sem saber o que é rede`,`O ACERTO BAIXAVA DINHEIRO DE OUTRO CNPJ. A tela do Fechamento mostra o acerto da loja escolhida, mas o botão acertava o DIA INTEIRO daquele entregador — inclusive o que ele tinha rodado para outra empresa — e lançava a soma toda no caixa desta. A tela dizia R$ 32,00 e entravam R$ 83,80; o fechamento do outro CNPJ é que ficaria com sobra sem explicação. É exatamente o lançamento misturado que o ADR-049 proíbe. Agora o acerto respeita a loja da tela: quem rodou para duas acerta duas vezes, uma em cada caixa. O mesmo valia para a GAVETA: o lançamento ia para o primeiro caixa daquela operadora que aparecesse, e não para o dela NESTA loja — quem abre caixa em duas filiais no mesmo dia via o dinheiro cair no lugar errado`,`AS RÉGUAS SEGUIAM A PORTA ANTIGA. Mapa ao vivo e App do entregador mudaram de lugar nesta versão e nove réguas ainda os procuravam na barra de cima. Agora um só ajudante conhece os dois caminhos — pela Central, para quem a tem; pela barra, para o monitor que não tem —, e a régua do encadeamento deixou de PULAR a trava: ela lê o que a tela pediu, tira as viagens da rua, faz os acertos e só então fecha`]},{version:`0.32.0`,date:`2026-09-04`,titulo:`O entregador entra por um código único — e a lista de nomes, que abria a casa para qualquer um, morreu`,melhorias:[`O APLICATIVO DO ENTREGADOR PEDE UM CÓDIGO, e só (ADR-047). Ele é entregador PRÓPRIO do restaurante: nasce dentro da loja, com nome e telefone digitados por quem o contratou, e não tem por que guardar mais uma senha para trabalhar meia jornada. A loja gera um código, manda pelo WhatsApp ou por mensagem de texto, ele digita uma vez — e pronto`,`A LISTA DE NOMES MORREU, e ela era o furo. Até aqui a tela de entrada mostrava TODOS os entregadores ativos e bastava tocar num nome para virar aquela pessoa: qualquer um com o aplicativo na mão via o movimento da casa inteira, os endereços dos clientes, os valores a cobrar. Não era senha fraca — era porta sem fechadura`,`O CÓDIGO NUNCA SE REPETE na plataforma inteira, e o registro dele é permanente: um código já queimado não volta a circular. Ele morre no primeiro uso (na hora, não no fim do dia), vence sozinho se ninguém usar, e vive guardado como impressão digital — quem abrir o banco não entra no lugar de ninguém. É um por pessoa: gerar outro apaga o anterior, para ninguém andar com dois códigos no bolso`,`O QUE O CÓDIGO ABRE não é "o aplicativo": é o vínculo entre APARELHO, ENTREGADOR e ESTAÇÃO DE TRABALHO. A estação é o lugar onde a pessoa trabalha, e ali dentro pode haver uma loja com vários CNPJ e várias plataformas de delivery de refeição ao mesmo tempo. Ele entrega para TODAS por padrão — não há distinção; restringir a uma é escolha de quem configura, em Entregas/Entregadores`,`DEPOIS DA PRIMEIRA VEZ, NUNCA MAIS. O aparelho fica vinculado e o código não é pedido de novo: quem comanda o acesso passa a ser a loja, que bloqueia, desvincula ou manda para a quarentena — cadastro de gente continua nunca sendo apagado. O turno dura o que a casa parametrizar, 8 horas de fábrica, contadas do acesso`,`E TURNO VENCIDO NÃO DERRUBA NINGUÉM NA RUA (regra 6, a casa não para). O vencimento fecha a porta para o próximo pedido; quem está com uma viagem na mão termina a viagem. Largar um entregador no meio da entrega para cumprir um relógio seria o sistema atrapalhando a operação que ele existe para servir`,`TRÊS PARÂMETROS NOVOS, nenhum deles escondido no código (regra 3): quantas horas dura o turno, quantas horas um código não usado sobrevive, e se a ficha completa (CPF, habilitação, endereço, placa) é exigida antes da primeira viagem — umas casas conferem tudo antes, outras põem a pessoa na rua hoje e completam depois`,`A MENSAGEM SAI PRONTA PARA COPIAR, sem link. A tela monta o texto com o nome da pessoa, o código e a validade, e quem cola no WhatsApp é a pessoa da loja. Link de aplicativo de fora não sai de tela nossa — e ensinar entregador a clicar em link de acesso que chega por mensagem é ensinar exatamente o hábito que o golpe usa`,"O CÓDIGO É SORTEADO POR CRIPTOGRAFIA, não por `Math.random`, e sem os caracteres que se confundem lidos em voz alta: sem zero e ó, sem um e i, sem L. Quem digita está de capacete na mão, e cada ambiguidade é uma ligação para a loja"],correcoes:[]},{version:`0.31.1`,date:`2026-09-04`,titulo:`Um gestor opera, os outros acompanham — e a loja nunca fica trancada por quem sumiu`,melhorias:[`NÃO EXISTEM MAIS DOIS GESTORES OPERANDO AO MESMO TEMPO (regra do Ricardo). O primeiro gestor que abre a tela assume o comando daquela loja; o segundo acompanha. Não é briga por tela: dois gestores mexem no MESMO pedido — um aceita, o outro cancela; um despacha para a Talita, o outro para o Jefferson —, as duas telas ficam certas cada uma do seu jeito, e no fim do dia o acerto não fecha e ninguém consegue reconstruir quem fez o quê`,`E A RECUSA MORA NO SERVIDOR, não num botão escondido. A tela de quem acompanha não oferece os gestos da operação (isso é cortesia, e evita a pessoa trabalhar em cima de um quadro que não existe em lugar nenhum), mas quem garante é a rota: enquanto ela aceitasse, duas pessoas continuariam podendo gravar no mesmo quadro. É a mesma lição do expediente e da simulação`,`O QUE QUEM ACOMPANHA AINDA FAZ, palavra por palavra do pedido: Configurações e Cardápio continuam liberados, e também a conversa com o cliente e o cadastro de gente. O que não passa é pedido, bancada, cozinha, viagem, recebimento, expediente e simulação — o movimento de agora. A lista na tela é do que PASSA, e não do que não passa: assim a operação nova nasce bloqueada, e um teste recusa qualquer função que ninguém tenha classificado`,`E O RESTO DA CASA TRABALHA SEMPRE. A regra é sobre dois GESTORES, que são os dois que alcançam o quadro inteiro. O caixa, a produção, a cozinha e a gestão de entrega seguem operando normalmente — cada um mexe no pedaço que é dele, e é assim que uma loja funciona`,`A LOJA NUNCA FICA TRANCADA POR QUEM SUMIU. O comando é um turno com SINAL DE VIDA: vale enquanto a tela daquela pessoa estiver falando com a Central, e fica livre depois de dois minutos de silêncio — quatro batidas da repescagem, que é o bastante para um engasgo de rede não passar o comando e pouco o bastante para a loja não esperar quem já foi embora. Quem sai pela porta larga o turno na hora. E o turno mora na memória da Central, de propósito: reiniciar tem de deixar ninguém no comando, e não um fantasma segurando o quadro`],correcoes:[`A RÉGUA QUE FICAVA VERMELHA SEM O PRODUTO TER QUEBRADO — "o mesmo fato mandado duas vezes" — era ela mesma, e agora tem conserto. Fechar o servidor responde quando o soquete fecha, mas os conjuntos de conexões do movimento ainda estão terminando de fechar nesse instante; um deles REABRE a conexão sozinho (é para isso que ele existe), e o apagar do banco de teste logo em seguida esbarrava num "está sendo acessado por outros usuários". Quem fecha a Central passou a ter como ESPERAR O FATO — os bancos fechados de verdade — em vez de tentar de novo até o relógio ajudar, que é a regra 9 da casa. Três rodadas seguidas do conjunto inteiro, limpas`,`E A RÉGUA DOS DOIS NAVEGADORES tinha um prazo só — quinze segundos — para o cartão APARECER e SOSSEGAR. Com a máquina ocupada (o conjunto inteiro rodando ao lado), o cartão às vezes demorava mais do que isso só para aparecer, e a régua acusava "não parou de mudar" com o texto vazio — que quer dizer o contrário: nem começou. Agora são duas esperas, porque são dois fatos: primeiro o cartão existir, com prazo largo; depois ele sossegar, com prazo curto, que desenhar de novo leva milissegundos. E cada uma reprova com a frase do seu próprio problema — confundir os dois custa a tarde de quem for caçar`]},{version:`0.31.0`,date:`2026-09-04`,titulo:`A ponte entre a nuvem e a loja: a segunda casa do banco, e a travessia onde nada anda para trás`,melhorias:["A CASA DA LOJA EXISTE — a segunda metade da ADR-040. O movimento (pedidos, bancada, cozinha, viagens, cadastros, cardápio, parâmetros) passa a caber também num arquivo SQLite no computador da loja, com o MESMO formato do Postgres da nuvem: as mesmas tabelas, as mesmas colunas, os mesmos índices. As duas casas cumprem um contrato só (`casa-do-movimento.ts`) e é o compilador que garante isso — um método que só exista de um lado para de compilar, em vez de virar movimento perdido na travessia, descoberto dias depois",`A PONTE ATRAVESSA NOS DOIS SENTIDOS, e recomeça de onde parou. Ela aproveita a fila de eventos que a Central já tinha (o "o que mudou desde o nº 412?") com dois marcos em vez de um: até onde subiu e até onde desceu. Trinta toques no mesmo pedido atravessam UMA vez — o documento já é o estado de agora —, e a remessa só move o marco quando chega inteira: rede caída no meio faz a próxima travessia refazer a remessa, que é barato e seguro, em vez de deixar para trás o que ninguém mais vai procurar`,`NADA ANDA PARA TRÁS — a regra que a ponte existe para cumprir. Quando os dois lados mexeram no mesmo objeto enquanto estavam separados, NÃO vence quem gravou por último: vence quem ANDOU MAIS. O motoboy confirma a entrega pelo celular (que tem internet na rua, e escreve na nuvem), a loja sem internet mexe no mesmo pedido depois — e com "o último ganha" a entrega evaporaria, com o acerto do dia fechando com dinheiro que ninguém recebeu. Um pedido nunca volta de entregue para em preparo, uma viagem nunca perde as paradas que já foram entregues, um prato montado nunca desmonta`,`E O PAR QUE NINGUÉM DESEMPATA FICA GUARDADO PARA UMA PESSOA. A loja cancelou o pedido e a rua entregou o mesmo pedido: as duas frases são verdadeiras e se contradizem, e escolher uma em silêncio decidiria, sem ninguém ver, se aquele dinheiro existe. A ponte não escolhe — guarda as DUAS versões inteiras no banco (não numa lista que some no primeiro reinício) e a tela diz quantos casos esperam alguém. A travessia segue em frente; uma ponte travada num caso perderia todo o resto`,`O ECO, QUE É O DEFEITO QUE MATA UMA PONTE, foi fechado por construção: cada evento passou a dizer se aconteceu NESTA casa ou se chegou atravessando. A tela é avisada dos dois (ela precisa redesenhar de qualquer jeito) e a ponte só carrega os primeiros — sem isso, o mesmo pedido ficaria indo e voltando entre a loja e a nuvem para sempre, cada travessia gerando a próxima`,`A REGRA 6 VALE PARA A PONTE TAMBÉM: a casa não para. A nuvem fora do ar não derruba nada e não vira erro na cara de quem está atendendo — vira um estado que a tela mostra ("sem sinal — 7 coisas esperam o sinal voltar. A loja continua trabalhando"), e a tentativa seguinte leva o que ficou`,`A LOJA ATRAVESSA PELO FIO, NUNCA PELO BANCO. A ponte fala com a Central por HTTP, entrando com uma conta como qualquer tela entra — e não abre conexão com o Postgres da nuvem. O motivo não é de gosto: a connection string do Neon é a chave de TODOS os clientes, e o computador de uma loja é uma máquina física num balcão, que o dono liga e desliga, com pendrive entrando e saindo. Guardar aquela senha ali seria entregar, junto com a loja, a porta do movimento de todo mundo. Assim, uma loja invadida chega no máximo ao que a conta dela já alcançava — o mesmo que uma tela aberta no balcão`,`E A CONTA DE ENTREGADOR NÃO ATRAVESSA PONTE. O celular do motoboy é uma ponta de leitura da viagem dele, não uma casa do banco: uma conta de entregador com acesso às portas da travessia leria o movimento inteiro da loja pelo caminho de trás. É o mesmo corte que a rota do histórico do dia já fazia, feito também aqui — e a filial que não é daquela conta responde a recusa de sempre, igualzinha à de "essa filial não existe", porque responder coisas diferentes ensina a quem está sondando quantas lojas o cliente tem`,'O PROCESSO DA LOJA (`npm run loja`) mantém no computador do balcão um arquivo com o movimento daquelas filiais, atravessando de quinze em quinze segundos. Ele é, hoje, ESPELHO e backup automático do dia — o arquivo fica lá mesmo que a nuvem, a internet e a assinatura sumam todas —, e ainda NÃO serve as telas: para isso falta o cadastro e a entrada morarem também na casa da loja. Está escrito assim no próprio arquivo, e não como promessa, porque um processo que se anuncia "a loja funcionando sem internet" sendo meio caminho é pior do que um que diz o que é: alguém contaria com ele no dia da queda'],correcoes:[]},{version:`0.30.0`,date:`2026-09-04`,titulo:`ABRIR LOJAS: a casa passa a saber em que mundo está trabalhando — e produção nunca tem simulação`,melhorias:[`TELA NOVA "🏪 ABRIR LOJAS", ao lado de Configurações (desenho do Ricardo). Cada loja abre em um de dois mundos: **PRODUÇÃO**, que é movimento de verdade, ou **TESTE**, que é onde a simulação vive. Enquanto houver uma loja aberta em produção, a simulação é RECUSADA — e recusada no motor, não por um botão cinza: botão cinza é cortesia, garantia é a chamada não passar. O preço de errar aqui não é um cartão feio na tela, é comida saindo para endereço que não existe e o acerto do dia fechando com dinheiro que ninguém recebeu. Os dois mundos também não se misturam entre si: com uma loja em produção não se abre outra em teste, nem o contrário`,`ABRIR É FATO DA CASA, NÃO DA ABA. O expediente sobe para a Central pelo mesmo fio que o pedido e desce em todas as telas: uma tela abre a loja em produção e a simulação de todas as outras cai na hora, sem ninguém precisar lembrar de desligar nada. Era o buraco que faltava fechar — a tela do salão atendendo cliente de verdade enquanto a do escritório, sem saber, despejava pedido de mentira na mesma fila`,`FECHAR A LOJA É AUTENTICADO, E É A ÚNICA COISA QUE ZERA AS FILAS. Quem fecha confirma com usuário e senha (tela destravada em cima do balcão não encerra o dia de ninguém), e o fechamento limpa o movimento DAQUELA loja — pedidos, bancada, cozinha, alarmes —, deixando as outras intactas`,`QUEDA DE LUZ NÃO FECHA LOJA — de propósito. Nada expira sozinho, nada fecha por horário, nada "esperto" acontece de madrugada: quem volta de um reboot encontra a loja exatamente onde parou, aberta, no mesmo mundo, com a mesma hora e o mesmo responsável. O contrário — expirar por tempo — transformaria uma queda de energia em fila zerada no meio do almoço`],correcoes:[`A VENDA PELO WHATSAPP MORRIA NA ÚLTIMA PERGUNTA. O atendente automático perguntava se o cliente queria CPF na nota e o cliente da simulação nunca respondia — a etapa do CPF entrou junto com a integração fiscal e ninguém escreveu a resposta dela no roteiro. Resultado: TODAS as conversas paravam ali, para sempre, e nenhuma venda pelo WhatsApp virava pedido no quadro. Agora parte dos clientes manda o CPF (com os dígitos verificadores certos — um número inventado no braço seria recusado pelo próprio atendente e a nota sairia sem documento) e parte dispensa; os dois caminhos fecham a venda, como no balcão`,`QUATRO RÉGUAS DE TELA ESTAVAM MEDINDO A COISA ERRADA — e régua vermelha por culpa própria é pior do que régua nenhuma, porque ensina a ignorar o vermelho. A do portão assinado procurava a chave pública por uma linha que mudou de forma e jurava que ela não estava instalada; a do mapa de rua SUPUNHA "sem internet" em vez de bloquear de fato, e numa máquina com rede o mapa de verdade carregava e ela reprovava o acerto; a das Entregas comparava largura com altura de cada fileira, e a coluna das viagens tem 340px de largura por decisão de tela; e a do ritmo cravava dois minutos para um movimento que chega em lote — agora ela pergunta à agenda a que horas o próximo pedido entra e espera o FATO (regra 9 da casa)`,`UMA CONEXÃO OCIOSA DERRUBADA DERRUBAVA A CENTRAL INTEIRA. O banco na nuvem fecha conexões paradas de rotina (manutenção do Neon, tempo de ociosidade), e um conjunto de conexões sem ouvinte de erro transforma isso em exceção sem dono — o servidor morria por causa de uma conexão que ninguém estava usando. Contra a regra 6 da casa: a casa não para. Agora o erro é anotado, a conexão é reaberta sozinha na consulta seguinte, e quem está atendendo não vê nada`]},{version:`0.29.12`,date:`2026-09-04`,titulo:`A simulação vira quatro interruptores encadeados — e a cozinha nunca é acionada pelo sistema`,melhorias:[`A SIMULAÇÃO GANHOU QUATRO INTERRUPTORES, ENCADEADOS DE CIMA PARA BAIXO (desenho do Ricardo): **Simulação ATIVA** é o mestre — desligado, nenhum botão de simulação funciona; **Simular o WhatsApp** liga a conversa de mentira e o robô fechando venda sozinho; **Esta tela está conduzindo** continua como era, marcando quem faz o mundo andar; e **automática / manual** decide se o pedido entra sozinho no ritmo escolhido ou se quem cria é você, na mão — o modo de olhar um caso de cada vez, com o relógio correndo e a moto andando mas sem pedido novo caindo em cima. Pai desligado apaga o filho, e essa regra mora num lugar só, no motor: tela que decide regra é tela que um dia discorda da outra tela`],correcoes:['FALTA DE ITEM E PEDIDO À COZINHA SÓ NASCEM DE GENTE — agora com teste que tranca. O Ricardo suspeitou que a simulação estivesse pedindo "couve refogada" à cozinha sozinha; a investigação mostrou que não existe caminho automático (o estado "pedido à cozinha" só nasce de `pedirParaCozinha`, que exige a lista de componentes escolhidos por alguém). Como a consequência de um pedido automático seria séria — o prato PARA de poder ser montado enquanto a cozinha dever algo, e o preparador fica olhando um cartão sem botão sem ter pedido nada —, a garantia virou régua: o relógio bate duzentas vezes com a simulação conduzindo e a bancada tem de sair intacta do outro lado']},{version:`0.29.11`,date:`2026-09-04`,titulo:`O prato montado some da fila do preparador sem ele ter feito nada — era o servidor`,melhorias:[],correcoes:['A CENTRAL NUNCA DEVOLVIA O PRATO MONTADO, E POR ISSO ELE SUMIA DA FILA DO PREPARADOR EM SEGUNDOS. A correção da v0.29.9 tratou o motor do navegador, mas o defeito tinha outra perna, do lado do servidor: a consulta da bancada filtrava `montado_em IS NULL`. A Central devolve o quadro inteiro de tempos em tempos e a tela troca a bancada pelo que veio — sem o recém-montado na resposta, o cartão evaporava, e evaporava da fila de quem prepara SEM ele ter feito nada, que é o que jamais pode acontecer. Agora a bancada que a Central devolve traz o montado junto, e quem decide por quanto tempo ele fica à vista é a tela: o parâmetro "liberado fica cinza à vista por N minutos" para quem prepara, sempre para o gestor (que conta os montados no cabeçalho). O corte do servidor passou a ser outro, e mais honesto: prato de pedido que já saiu do quadro não volta',`O AVISO "37 PEDIDOS SAÍRAM DA BANCADA HOJE SEM MONTAGEM" ACUSAVA PEDIDOS QUE NÃO EXISTEM MAIS. Esse rastro mora no navegador e serve para explicar um prato que evaporou AGORA. Quando o quadro vem da Central sem aqueles pedidos — dia novo, movimento limpo, outra tela concluindo tudo — o aviso vira uma acusação sobre pedidos que ninguém consegue mais abrir. Ele passou a ser reconciliado com o quadro, como já era o sino: aviso que aponta para o que não existe é pior do que aviso nenhum, porque ensina o operador a não ler os avisos`]},{version:`0.29.10`,date:`2026-09-04`,titulo:`O sino sem número: alarme de pedido que já saiu do quadro cala junto com ele`,melhorias:[],correcoes:[`A BARRA DIZIA "1 PEDIDO PRECISA DE ATENÇÃO!" E NÃO MOSTRAVA O NÚMERO AO LADO. O chip com o "#" só é desenhado quando o pedido do alarme ainda está no quadro — e ligada à Central o quadro vem inteiro do servidor de tempos em tempos, trocando a lista de pedidos. O alarme, porém, é local e não era reconciliado: pedido que outra tela concluiu (ou que saiu do dia) levava o cartão embora e deixava o sino tocando sozinho, sem número, sem como chegar até ele e sem como calar — porque quem cala o alarme é uma ação sobre um pedido que já não está na tela. Agora, toda vez que o quadro chega da Central, alarme sem pedido correspondente vai junto. Sino que toca para sempre é sino que todo mundo aprende a ignorar, e aí o alarme de verdade passa despercebido com ele`,"O MOTOR NÃO TINHA COMO PARAR O RELÓGIO. Tinha `start()` e não tinha o contrário: a tela desmontada — trocar de filial, sair da Central — deixava a batida de cada segundo rodando para sempre sobre um motor que ninguém mais olha, e o mesmo para o relógio da fila fiscal. Ganhou `parar()`, chamado quando a tela sai"]},{version:`0.29.9`,date:`2026-09-04`,titulo:`Aceitou, está em preparo — e o prato montado para de sumir da bancada`,melhorias:[`ACEITAR JÁ COLOCA O PEDIDO EM PREPARO, por padrão. Antes o pedido aceito parava numa fileira chamada "Em preparo" SEM estar em preparo, e a tela da Produção continuava vazia esperando um segundo clique que ninguém tinha motivo para adivinhar — o Ricardo pegou isso na primeira venda de teste ("já deveria aparecer para produção"). Quem quiser os dois passos separados desliga em Configurações › Geral › "Ao aceitar, já marcar em preparo"; a casa passa a começar com um passo só`],correcoes:[`O PRATO MONTADO SUMIA DA BANCADA NO SEGUNDO EM QUE ERA MONTADO. Montar o ÚLTIMO prato de um pedido deixa o pedido PRONTO — e PRONTO já está "depois da bancada", então a limpeza da produção apagava, no mesmo instante, o prato que a pessoa acabara de montar. O cartão piscava cinza por segundos e ia embora, com dois textos da própria tela virando mentira juntos: o parâmetro "liberado fica cinza à vista por N minutos", que é de quem prepara, e o "para o gestor ele continua à vista, em cinza", que é o olho que confere o dia (e conta os montados no cabeçalho). Agora o prato montado fica enquanto o PEDIDO viver, e quem decide por quanto tempo ele aparece é a tela — que é onde essa regra sempre esteve escrita`,`A LIMPEZA DA BANCADA SÓ RODAVA DENTRO DO RELÓGIO DA SIMULAÇÃO. Ligada à Central de verdade esse relógio não roda (ninguém finge ser a plataforma, desde a 0.29.2) — então prato de pedido cancelado, entregue ou arquivado ficava na bancada até alguém recarregar a página. A limpeza passou a acontecer também em cada ação de gente: aceitar, avançar, cancelar, arquivar, montar e concluir`]},{version:`0.29.8`,date:`2026-09-04`,titulo:`Loja zerada não vira parede de barrinhas: as fileiras vitais ficam sempre abertas`,melhorias:[],correcoes:['ABRIR A LOJA COM O QUADRO LIMPO COMPRIMIA O QUADRO INTEIRO. A regra sempre foi: fileira que zera vira uma barrinha em pé, e as vitais — Novos, Em preparo e Em entrega — ficam abertas de qualquer jeito, porque são o lugar para onde o pedido vai chegar. Só que a conferência de "esta fileira vazia comprime" estava solta, fora da conferência de "esta fileira PODE comprimir": com todas em zero (começo de expediente, ou logo depois de limpar o movimento), o operador abria a Central e via uma parede de barrinhas em vez do quadro de trabalho. As duas razões passaram a andar juntas, numa função só — `colunaComprimida`, em `ui/colunas.ts`, lida pela tela e pelo teste. A regra saiu do meio do desenho da tela e virou decisão declarada, ao lado de `ui/perfil.ts`, com teste que a tranca']},{version:`0.29.7`,date:`2026-09-04`,titulo:`A fileira do balcão passa a dizer o que é: “Entrega balcão”`,melhorias:[`A COLUNA "🧾 BALCÃO" VIROU "🧾 ENTREGA BALCÃO". "Balcão" sozinho não dizia se aquilo era o lugar, o canal de venda ou a forma de entrega — e o quadro já tem "Fila de entrega" e "Em entrega" ao lado, então a fileira do cliente que vem buscar precisa se apresentar na mesma língua das outras. As três réguas de tela que procuravam esse rótulo foram ajustadas junto e voltaram verdes`,"FERRAMENTA NOVA, `scripts/movimento-do-cliente.mjs`: conta (e, com `--zerar`, limpa) o movimento do dia de uma loja no Neon — pedido, prato, demanda, viagem, fato do celular e a trilha de avisos. Ela NÃO encosta no cadastro: motoboy, operador, cardápio e parâmetros ficam onde estão, porque cadastro de gente nunca é excluído (regra 4) e abrir a loja sem cardápio não é abrir a loja. Roda em transação: ou a loja abre limpa, ou nada muda. Serve para virar a chave entre um teste e a operação de verdade"],correcoes:[]},{version:`0.29.6`,date:`2026-09-04`,titulo:`Só o dono liga a simulação — e o rodapé conta quando ela está ligada`,melhorias:["O INTERRUPTOR DA SIMULAÇÃO PASSA A SER DO DONO. Ele grava pedido de mentira no movimento de verdade da loja, e o que ele grava desce para todas as telas — não é botão para quem está no caixa ou na cozinha. Quem não tem o poder continua vendo os ajustes de ritmo (para saber o que está acontecendo quando a simulação está ligada), mas no lugar do interruptor lê uma frase dizendo de quem é a decisão. A regra mora junto com todas as outras do tipo, em `ui/perfil.ts`, e ganhou teste próprio — mudá-la passa a exigir alguém dizer por quê",`O RODAPÉ AVISA QUANDO ESTA TELA ESTÁ CONDUZINDO, com a tarja "🎬 conduzindo a simulação" ao lado dos outros indicadores. Sem isso, o interruptor ficava escondido três cliques adentro das Configurações: dava para esquecer ligado e passar o dia com pedido de mentira entrando no movimento, sem ninguém entender de onde vinha. Decisões do Ricardo, 04/09/2026`],correcoes:[]},{version:`0.29.5`,date:`2026-09-04`,titulo:`O condutor da simulação não mexe mais no que é dos outros — cinco furos fechados na véspera`,melhorias:[],correcoes:[`LIGAR O CONDUTOR CANCELAVA PEDIDO DE VERDADE. O relógio da simulação cancela sozinho, como "a loja não aceitou no prazo", todo pedido parado há mais de oito minutos — regra que existe para a demonstração doer como dói na vida real. Só que o pedido que vem da Central chega com a hora de criação DELE, muitas vezes de horas atrás: ligar o interruptor varria o quadro cancelando em massa pedidos de gente, e o cancelamento subia para a Central e aparecia em todas as outras telas. Agora existe um MARCO — o instante em que esta tela virou condutora — e nada anterior a ele é tocado pela automação. O mesmo marco cala o vigia do entregador da plataforma, que carimbava como entregue pedido que só estava parado`,`O INTERRUPTOR ERA DO NAVEGADOR, NÃO DA TELA. Ele era lembrado numa chave única no armazenamento do navegador — então a SEGUNDA aba aberta lia a marca da primeira e virava condutora sozinha, dois condutores no mesmo computador, que é exatamente a bagunça que o interruptor existe para evitar. E a chave não tinha a filial: conduzir a loja do Centro ligava a simulação ao trocar para a do Shopping, gravando pedido de mentira no banco da outra loja. Agora a lembrança é por ABA e por FILIAL`,`A MOTO SALTAVA A VIAGEM INTEIRA ao religar. O trajeto guarda a hora em que saiu, e despachar motoboy é clique de gente — acontece com o interruptor desligado. Ao ligar, a conta de progresso via uma saída de horas atrás e dava a viagem por chegada no primeiro segundo, na frente de quem estava olhando o mapa. Os trajetos abertos agora são reancorados no instante em que a condução começa`,`AS FILAS COM HORA MARCADA ESTOURAVAM JUNTAS. Confirmação da plataforma, conclusão automática e resposta do robô nas conversas continuavam sendo enfileiradas pelos cliques de gente enquanto a automação estava desligada, e ninguém as consumia. Ligar o interruptor despejava tudo o que tinha vencido de uma vez. O que já venceu é descartado ao ligar`,`TROCAR O RITMO DESPEJAVA UMA RAJADA. Mexer nos "pedidos por hora" remontava a agenda sem limpar o registro do que ela já tinha entregue naquele ciclo — e desde a 0.29.3 o ritmo chega sincronizado de outra tela, então a rajada podia nascer de um clique dado noutro computador. Agora a troca de ritmo passa pelo mesmo caminho do interruptor, que já cuidava disso`]},{version:`0.29.4`,date:`2026-09-04`,titulo:`A simulação volta a ter dono: um interruptor diz qual tela conduz o movimento`,melhorias:[`A SEÇÃO "RITMO DA SIMULAÇÃO" GANHOU UM INTERRUPTOR — "Conduzir a simulação nesta tela". Ela sempre serviu para ver o quadro no aperto, mas ligada à Central tinha virado enfeite: os controles estavam lá e não moviam nada, porque quem inventava pedido tinha sido desligado para as telas pararem de brigar entre si. Agora a regra é explícita e fica na mão de quem testa: com várias telas na mesma loja, UMA conduz — ela inventa os pedidos no ritmo escolhido e os faz andar, e todas as outras recebem o mesmo movimento pela Central, como se viesse da plataforma. O interruptor é DESTA tela e mora no navegador dela, de propósito: se fosse parâmetro sincronizado (as Configurações passaram a viajar entre telas na 0.29.3), ligaria em todas de uma vez e traria de volta exatamente a bagunça que ele existe para evitar. Recarregar a página não desliga: quem conduzia continua conduzindo`],correcoes:["LIGAR O CONDUTOR DEPOIS DE DESLIGAR, DENTRO DA MESMA HORA, deixava a tela muda até virar a hora seguinte. A agenda de pedidos é ancorada na hora cheia e guarda o registro do que já entregou; sem limpar esse registro ao religar, os horários daquele ciclo já contavam como usados e nenhum pedido nascia — o operador apertava o botão e não acontecia nada, sem nenhuma pista do porquê. Religar agora recomeça a agenda a partir do instante do clique (e sem despejar de uma vez o que teria acontecido enquanto esteve desligada). O teste `src/ui/demo/condutor.test.ts` tranca as quatro pontas: nasce parado na Central, nasce conduzindo na demonstração, liga/desliga de verdade, e religar na mesma hora volta a produzir movimento"]},{version:`0.29.3`,date:`2026-09-04`,titulo:`Configurações e Cardápio entram no fio da sincronização — uma tela ou cem, tudo igual`,melhorias:[`CONFIGURAÇÕES E CARDÁPIO AGORA VIAJAM PELO MESMO FIO QUE O PEDIDO. Eles sempre tiveram lugar no servidor (a tabela de documentos por filial existia desde a fase 2) — mas ninguém os levava até lá: cada navegador guardava a própria cópia, e duas telas na mesma loja mostravam parâmetros diferentes. Regra definida pelo Ricardo: *"1 tela, 100 telas, mesmo perfil, tudo igual e sem delay — a verdade mora na Central, o navegador é só cache"*. Mexeu num parâmetro numa tela, chega nas outras pela mesma via de avisos em tempo real do quadro; a cópia do navegador vira só o aquecimento da partida. E uma trava nova: NADA sobe antes de a primeira carga do servidor chegar — sem ela, uma tela recém-aberta subiria o cache local (possivelmente velho) por cima do que outra tela acabou de gravar`],correcoes:[`A seção "Ritmo da simulação" volta a aparecer em toda tela de Configurações, igual em todo lugar — a versão anterior a escondia só na Central, criando duas versões da mesma tela sem ninguém ter pedido. Tela é uma só, em qualquer ambiente.`]},{version:`0.29.2`,date:`2026-09-04`,titulo:`Ligado na Central de verdade, ninguém mais finge ser a plataforma — o motivo de duas telas verem números diferentes`,melhorias:[],correcoes:["ACHADO NO PRIMEIRO TESTE COM DUAS TELAS NA CENTRAL DE VERDADE (Neon, ao vivo): cada aba aberta continuava rodando o relógio da simulação por baixo — o mesmo que dá vida à demonstração, fingindo aceite automático, cancelamento por prazo e rider chegando. Duas abas na MESMA loja tinham, cada uma, o seu próprio relógio fingindo essas coisas por conta própria, e as duas escreviam versões diferentes do mesmo pedido uma por cima da outra: pedido preparado por um lado não aparecia no outro, e até atualizar a página não resolvia, porque cada lado voltava a fingir de novo. `engine.pararAutomacaoDaPlataforma()` desliga esse relógio quando a tela está ligada à Central — o pedido só muda quando uma pessoa aperta um botão, exatamente como o servidor manda","NO MESMO CAMINHO: a tela ligada à Central ainda chamava a semeadura de pedidos e conversas fictícias (a mesma da demonstração vazia) antes da carga real chegar — se a subida automática disparasse primeiro (a carga é uma chamada de rede; a semeadura é instantânea), esse pedido de mentira ia para o banco de verdade do cliente. `engine.start(false)` desliga a semeadura quando ligado à Central",'A seção "Ritmo da simulação" (e o "Relógio da entrega") aparecia na tela de Configurações mesmo ligada à Central, onde não faz nada — mexer nela não muda nenhum comportamento real, e não havia aviso nenhum disso além de uma frase pequena. Some da tela quando não é a demonstração (`HubExtras.simulado`)',`A via de avisos em tempo real (empurrão) verificava novidade a cada 1 segundo; caiu para 300ms — o delay perceptível entre uma tela agir e a outra ver.`]},{version:`0.29.1`,date:`2026-09-03`,titulo:`O movimento de cada cliente também vai para o Neon — um banco por holding, agora de verdade`,melhorias:['O MOVIMENTO (pedidos, produção, cozinha, viagens, motoboys, cardápio e parâmetros) SAI DO ARQUIVO SQLITE POR CLIENTE E VAI PARA UM BANCO POSTGRES POR CLIENTE, no Neon — a segunda metade do ADR-040. `src/central/movimento.ts` virou assíncrono sobre `pg`, mantendo a garantia que importa (ADR-028): a conexão já é a do banco daquele cliente, não existe "where filial = X" para alguém esquecer. O nome do banco (`holding_<id>`) é derivado do id da holding com a mesma trava que antes protegia o nome do arquivo, e a Central cria o banco sob demanda (`CREATE DATABASE`, que o Postgres não faz condicional — a conferência contra `pg_database` fica por conta da Central)',"`rotas-movimento.ts` e o EMPURRÃO (as notificações em tempo real para o celular do motoboy, por Server-Sent Events) foram ajustados para aguardar cada leitura e gravação — o empurrão em especial, porque ele acorda sozinho a cada segundo e agora consulta um banco de verdade, não um arquivo já aberto no processo"],correcoes:['ACHADO TESTANDO A PRÓPRIA MIGRAÇÃO: o banco do movimento tem nome determinístico por holding (é assim que o cliente sempre encontra o dele) — e os testes que usam o mesmo id fictício "grupo-bonatto" em arquivos diferentes (`servidor.test.ts`, `cliente.test.ts`, `sincronizador.test.ts`) colidiam quando o executor de testes roda os arquivos em paralelo, um criando o banco por baixo do outro. Cada arquivo de teste ganhou um id de holding só dele, e o encerramento de cada teste agora derruba a conexão que sobrou antes de apagar o banco, em vez de tentar de nome no relógio.',"O script de backup por cópia de arquivo SQLite (`scripts/backup-central.mjs`, `npm run backup`) foi aposentado: não existe mais arquivo `.db` da Central para copiar — o backup agora é o do próprio Neon (retenção e recuperação por ponto no tempo, gerenciadas pelo provedor)."]},{version:`0.29.0`,date:`2026-09-03`,titulo:`O cadastro da Central sai do arquivo local e vai para o Neon — banco na nuvem de verdade (ADR-040)`,melhorias:["O CADASTRO DA CENTRAL (holdings, empresas, filiais, módulos contratados, contas e sessões) MORA AGORA NO NEON — Postgres na nuvem, um projeto só para todos os clientes (ADR-039 a 041 deixavam isso desenhado; agora está no ar). `src/central/banco.ts` inteiro virou assíncrono, com `pg` no lugar do `node:sqlite`: mesma API, mesmas regras de negócio (a isca contra o relógio que entrega quem existe, a senha que nunca chega em texto puro, a conta que nunca é excluída), driver diferente. O servidor da Central (`servidor.ts`) e o ponto de entrada (`main.ts`) foram ajustados para aguardar cada chamada, e a Central agora exige `DATABASE_URL_APP` para subir — sem banco na nuvem, ela não sobe mais com um arquivo local por baixo do pano","OS TESTES DO CADASTRO RODAM CONTRA POSTGRES DE VERDADE, não contra um dublê. Um Postgres 17 local via Docker (a mesma convenção do xcodef-pdv: senha de desenvolvimento, porta própria) cria e apaga um banco descartável a cada teste — 42 testes ao todo entre `banco.test.ts`, `servidor.test.ts`, `cliente.test.ts` e `sincronizador.test.ts` — e a mesma connection string, trocada de lugar, sobe para o Neon em produção. Nenhum segredo entra no repositório: a connection string do Neon vive só em `.env`, que já estava (e continua) fora do git"],correcoes:[]},{version:`0.28.9`,date:`2026-09-03`,titulo:`A chave pública real do Delivery, confirmada pelo Ricardo e embutida`,melhorias:['O PORTÃO DA LICENÇA ASSINADA PASSA A CONFERIR DE VERDADE: `src/core/licenca/chave-publica-delivery.ts` estava vazio desde que o caminho da chave assinada nasceu — ninguém tinha ainda gerado o par de produção no License Center. O Ricardo confirmou por captura de tela qual sistema era dono da chave pública gerada ("é do Delivery") e autorizou a troca; a chave e a digital SHA-256 de conferência (`ee7968f4…`) foram gravadas com `npm run licenca:publica`. A partir desta versão, uma licença assinada de verdade — emitida no painel do License Center — é aceita pela demonstração e pela Central; antes disso só a chave curta da demonstração entrava'],correcoes:["A checagem \"chave pública ainda não instalada\" comparava `CHAVE_PUBLICA_DELIVERY === ''`: com a chave real (um literal fixo) o TypeScript passou a apontar a comparação como impossível, porque os dois lados nunca podem ser iguais. Virou checagem de veracidade (`!CHAVE_PUBLICA_DELIVERY`), que continua certa nos dois estados — vazio ou preenchido — sem depender do valor exato"]},{version:`0.28.8`,date:`2026-09-03`,titulo:`Os 7 dias de tolerância após o vencimento — a mesma regra que o main já usava em paralelo`,melhorias:['A LICENÇA VENCIDA GANHA 7 DIAS DE TOLERÂNCIA antes de recusar de vez — regra permanente da XCODEF, em todos os produtos. Ela nasceu num verificador irmão (licenca/verificarLicenca.mjs) que evoluiu direto no `main` deste repositório enquanto esta frente trabalhava separada, e chega agora ao núcleo de verdade (`src/core/licenca/chave-assinada.ts`, `src/central/licenca-central.ts`, e a demonstração publicada). Dentro dos 7 dias a chave continua valendo — com um aviso dizendo quantos dias restam —, e só no 8º dia vira recusa. Veio junto a lição que custou caro no lugar de origem: o vínculo de MÁQUINA agora é conferido ANTES da data, nunca depois — invertido, uma chave vencida-em-tolerância voltaria "ok" sem nunca passar pela conferência de máquina, e uma chave copiada para outro computador escaparia da trava justamente no caso em que ela mais precisa valer. Um teste de regressão prova isso: chave de outra máquina, mesmo dentro da tolerância, continua recusada'],correcoes:[]},{version:`0.28.7`,date:`2026-09-01`,titulo:`O segundo fator ganha QR Code — e o caderno passa a dizer o que o XCODEF Emissor é de verdade`,melhorias:[`A ATIVAÇÃO DO SEGUNDO FATOR MOSTRA UM QR CODE, e o aplicativo autenticador lê com a câmera em vez de a pessoa digitar trinta e duas letras. O código é desenhado dentro do próprio programa — sem rede e sem biblioteca — com o codificador que o XCODEF Emissor já usa no cupom fiscal (a mesma matriz, copiada com o nome de origem no cabeçalho: um codificador de QR é utilidade, não integração entre módulos). E ele LÊ: o teste de unidade pinta a figura como pixels e manda um leitor independente decodificar, comparando com o endereço original — porque QR Code é a coisa que "parece certa" e não lê, e quem descobre é quem está com o celular na mão. A chave digitada continua embaixo para quem não tem câmera; se o nome da casa for comprido demais para caber no código, some a figura e fica a chave, nunca o contrário. A régua da Central de verdade passou a conferir que o QR carrega o MESMO segredo da chave digitada`],correcoes:[`O CADERNO DIZIA QUE O XCODEF EMISSOR ERA UM MÓDULO DE VENDA AVULSA DE LICENÇA — e não é. O Emissor é o emissor FISCAL da família (NFC-e, NF-e e NFS-e nacional), produto próprio já na versão 0.2.0, do qual o Delivery é CLIENTE por parâmetro: é por ele que a venda avulsa do WhatsApp e do balcão ganha cupom fiscal quando o operador quiser. O mapa de integrações, o plano e o quadro foram corrigidos; a ligação saiu da Onda 1 (licenciamento), onde não tinha o que fazer, e foi para a Onda 6 (fiscal), com os dois parâmetros que ela vai pedir já nomeados`,`A RÉGUA DA CENTRAL DE VERDADE MEDIA UMA INTERFACE DE 28/08. Ela sobe o servidor e serve a pasta dist/ui — que só o comando de compilar a interface atualiza, e esse comando não estava na esteira. Resultado: a régua passava verde conferindo uma tela quatro versões atrás, e foi o QR Code novo, que ela não achou, que denunciou. Agora o comando check:central compila a interface antes de medir; régua que mede a coisa errada é a família de defeito mais comum daqui, e esta estava escondida atrás de um verde`,`O CADERNO GANHOU O QUADRO DE ATIVIDADES no lugar da lista seca de pendências: para cada passo que depende do Ricardo, o link exato onde clicar, o que fazer, o que devolver e como obter, de que módulo se trata e para que serve — e três colunas de estado, pronta, em andamento e a fazer. Nasceu de uma queixa justa ("como se eu soubesse o contexto inteiro") e virou regra da casa (CLAUDE.md, regra 13), espelhada no License Center`]},{version:`0.28.6`,date:`2026-09-01`,titulo:`A licença passa a valer dentro da Central, a entrada ganha segundo fator, e a viagem iniciada para de aparecer em dois lugares`,melhorias:[`A CENTRAL INSTALADA OBEDECE A LICENÇA, e não só a tela da demonstração. Ela confere a chave assinada na subida (e uma vez por dia, que é quando o resultado pode mudar), conta os pedidos do mês POR FILIAL — que é como o xcodef cobra —, e responde a pergunta "quanto do pacote já foi usado" numa rota própria, para a tela mostrar ao gestor. A regra que manda em tudo isso está escrita no código com todas as letras: A CASA NÃO PARA. Licença ausente, vencida ou que não confere faz a Central AVISAR, nunca travar — problema de licença é entre o xcodef e o cliente, e não pode virar pedido perdido no balcão às oito da noite de sexta. A única sanção possível é barrar pedido NOVO quando o teto do mês chega E a chave manda barrar (ao_atingir), e mesmo assim o que já entrou segue até a entrega. Vira o mês, a conta zera sozinha`,`A VIAGEM QUE JÁ SAIU MORA NUM LUGAR SÓ (sua queixa: "pq a do jeferson ainda aparece no painel principal? ambas deveriam estar no viagens em andamento"). Ela sai da coluna do motoboy e fica só em "Viagens em andamento"; no lugar dela a coluna diz onde ela está e que ele volta quando fechar. O mesmo trabalho contado duas vezes era justamente o que fazia perder a conta do que ainda estava na loja`,`TODO DESPACHO ABRE VIAGEM — inclusive o feito pelo QUADRO, não pelo botão do motoboy. Era esse o caso da Talita: pelo botão, abria viagem; pelo quadro (Prontos → em entrega), o pedido ia para a rua sem viagem nenhuma, e o que não tem viagem não aparece na coluna das viagens. A casa já chamava isso de furo em outro arquivo (pedidosEmEntregaSemViagem); agora o furo não existe mais. Se o motoboy já está na rua, a parada entra na viagem dele em vez de abrir uma segunda — dois "na rua" da mesma pessoa seria mentira na tela`,`DESFAZER SUGESTÕES FICOU HONESTO COM O PRÓPRIO NOME. Ele agora protege a viagem iniciada por DUAS provas (o pedido despachado E a viagem aberta — antes só olhava a primeira, e por isso dava para desmontar a rota de quem estava com a comida na mochila), e não encosta mais na VIAGEM MONTADA À MÃO: ela não é sugestão nenhuma, é trabalho do gestor, e um botão que apaga trabalho de gente é armadilha. Sai o que o programa propôs e ninguém despachou — o seu "fazer com os que ainda não saíram"`,`NOVO PARÂMETRO: "PRONTO SÓ DEPOIS DE MONTADO" (Configurações › Operação). Ligado, o quadro não passa o pedido para PRONTO enquanto a bancada tiver prato dele por montar, e a recusa diz QUANTOS pratos faltam. Desligado — que é o padrão, porque parâmetro novo não muda a casa de ninguém sozinho — tudo segue como sempre foi, com o rastro 👻 registrando o que saiu sem montagem. É a segunda metade da resposta ao "bateu na fila dele e sem ele fazer nada sumiu": a primeira foi mostrar; esta é poder impedir`,`A ENTRADA DA CENTRAL GANHOU SEGUNDO FATOR (o seu pedido: "entrar com usuário e senha e código 2 fatores de segurança"). A senha certa deixa de ser, sozinha, a porta aberta: com o segundo fator ligado, ela devolve um desafio de cinco minutos, e a sessão só nasce depois do código de 6 dígitos do aplicativo autenticador (Google Authenticator, Microsoft, Authy, 1Password — o padrão TOTP, conferido aqui contra os vetores oficiais do RFC 6238, que é a prova de que o número bate com o do telefone). Três travas que quase toda implementação esquece estão fechadas: CÓDIGO JÁ USADO NÃO ENTRA DE NOVO (código espiado por cima do ombro não serve para uma segunda entrada); o desafio é de uso único; e DESLIGAR EXIGE A SENHA — tela destravada esquecida no balcão não desliga a tranca. Telefone perdido não vira casa trancada: saem oito códigos de recuperação na ativação, mostrados uma vez só, guardados com o mesmo resumo lento das senhas, cada um valendo uma entrada. Quem liga é a própria pessoa, na conta dela, pelo botão 🔓 na tarja — ninguém liga o segundo fator de outro, porque é o telefone DELA que gera o código`,`NO LICENSE CENTER, UM RISCO DE PRODUÇÃO SILENCIOSO FOI FECHADO ANTES DE MESCLAR. Numa hospedagem o programa novo sobe ANTES de a migração rodar — é sempre nessa ordem —, e nesse intervalo a consulta do catálogo quebraria por causa da coluna nova do cofre. Como aquele arquivo tem rede de proteção, não daria tela branca: daria coisa pior — o site inteiro passaria a mostrar em silêncio o catálogo velho, com preço velho e sem os sistemas novos, e a emissão do Delivery responderia "este sistema não está no catálogo". A consulta agora nomeia as colunas uma a uma, e uma régua nova monta um banco sem a coluna para provar isso a cada rodada. De brinde, a tela do sistema passou a mostrar em vermelho o estado que ninguém pode descobrir só na hora de emitir: chave no cofre e cofre trancado`],correcoes:[`A RÉGUA QUE EU TINHA "CONSERTADO" NA v0.28.3 VOLTOU A FICAR VERMELHA, e a causa estava um passo antes de onde eu olhei. Eu tinha trocado a espera fixa DEPOIS de digitar no filtro de clientes; só que o filtro era preenchido assim que o menu era clicado — antes de a lista existir. Campo controlado preenchido cedo demais é campo que a primeira renderização apaga, e a régua concluía "o cadastro sumiu ao recarregar" sobre um cadastro intacto, que é a acusação mais grave que ela sabe fazer. Agora ela espera a LISTA ESTAR VIVA antes de digitar. Três rodadas seguidas verdes`,`DUAS RÉGUAS MINHAS MEDIAM O DESENHO ANTIGO e teriam passado a mentir em silêncio — a pior forma de régua quebrada. A de arrastar contava viagens na rua procurando o cartão dentro da coluna do motoboy; com o cartão morando agora na coluna das viagens, ela acharia ZERO e diria "nenhuma viagem na rua neste instante", passando de olhos fechados. A da gestão de entrega falhava de vez pelo mesmo motivo. As duas passaram a medir a verdade nova, e ganharam a asserção que antes não existia: a viagem despachada NÃO pode aparecer também na coluna do motoboy`]},{version:`0.28.4`,date:`2026-09-01`,titulo:`A licença obedece a política no cliente — e a chave privada nunca mais aparece numa tela`,melhorias:[`O PORTÃO PASSA A ACEITAR A LICENÇA ASSINADA DO XCODEF.COM, além da chave curta da demonstração. Cole a chave longa (a que começa com "XCODEF.") e a página confere a ASSINATURA ali mesmo, com a criptografia do próprio navegador (WebCrypto, a mesma conta Ed25519 da Central) contra a chave pública EMBUTIDA no programa — embutida porque chave que o programa baixasse da internet seria chave trocável por quem controla a rede. Cada recusa tem a sua frase: chave truncada, assinatura que não confere, licença vencida, chave de outro sistema — porque o que a pessoa precisa FAZER é diferente em cada caso. E quem entra vê no selo o que comprou: o plano, o teto de pedidos e, na última semana, o aviso de vencimento`,`O TETO DE PEDIDOS DO MÊS VIROU MOTOR (core/licenca/limite-mensal.ts): conta o uso do mês, avisa a partir de 80% do teto e sabe o que fazer quando ele chega. O QUE fazer viaja DENTRO da chave assinada (campo ao_atingir), porque é cláusula do contrato entre o xcodef e o cliente — se fosse parâmetro editável da casa, o teto seria decorativo. E o padrão, quando o campo não vem, é AVISAR E SEGUIR: restaurante às oito da noite de sexta não para porque um contador virou; parar no teto é escolha explícita de quem emite, e mesmo ela só barra pedido NOVO — o que já entrou segue até o fim`,`NASCEU O "npm run licenca:publica": um comando que busca a chave PÚBLICA no License Center, grava no código-fonte e imprime a digital (o resumo SHA-256) para conferência humana. Com trava na porta: qualquer coisa com cara de chave PRIVADA é recusada na hora — chave privada não entra neste repositório nem por engano. É o fim do copia-e-cola de chave: uma linha de comando e a versão seguinte já confere as licenças de verdade`,`NO LICENSE CENTER (o outro lado desta conversa), A CHAVE PRIVADA GANHOU COFRE: ela nasce CIFRADA no banco (AES-256-GCM, a criptografia autenticada que denuncia qualquer byte alterado) e NENHUMA tela a exibe — nunca mais a caixa amarela que pedia para copiar uma chave privada, que foi exatamente como um par se queimou num print. Uma senha de cofre configurada UMA vez na vida do ambiente, e daí em diante gerar par é um clique sem nada para copiar, colar ou reimplantar. O emissor que encontra o cofre trancado PARA com erro claro em vez de emitir com a chave errada em silêncio. ScanFácil Pro e IngestCore seguem intocados no caminho antigo`,`O PRATO QUE SOME DA BANCADA DEIXA RASTRO (o seu relato: "bateu na fila do Jefferson e sem ele fazer nada sumiu"). O comportamento é a regra combinada — quando o pedido fica PRONTO por outro caminho (o quadro, o caixa), o trabalho da bancada acabou e os pratos saem —, mas até aqui ele era MUDO. Agora a tela da Produção mostra a faixa 👻 com pedido, hora e pratos de cada sumiço do dia. Se a regra deve mudar ("pronto só depois de montado"), é outra decisão, e está aberta; o que não fica é o mistério`],correcoes:[]},{version:`0.28.3`,date:`2026-08-28`,titulo:`O registro do dia sai da disputa por espaço — e as decisões de infraestrutura ficam escritas`,melhorias:[`O REGISTRO DO DIA VIROU BOTÃO NA BARRA E ABRE EM TELA CHEIA, como você desenhou: "colocar um botão para essa função do lado de desfazer sugestões e abrir frame maximizando com todas as informações". Era o mesmo defeito de sempre, na terceira forma: relatório de catorze colunas disputando espaço com a operação. Dentro da coluna estreita ele perdia as LINHAS; em faixa embaixo do quadro ele perdia a ALTURA quando havia moto na rua. Agora não disputa com nada — o botão fica sempre no mesmo lugar da barra, e o painel toma a tela inteira (a régua mede: 98% da largura, 96% da altura) e fecha no ✕ ou no Esc`,`O ROTEIRO DAS CREDENCIAIS E DA HOMOLOGAÇÃO nas quatro plataformas (DOCUMENTACAO.html#plano): quem pede o quê, em que ordem, quanto tempo cada fila leva e o que não pode começar antes do quê. Com a armadilha do iFood em destaque (reprovar na homologação custa outra semana, então o checklist deles vira suíte de teste desde o começo) e com a Rappi tratada com honestidade: ela existe como cadastro no sistema, mas não tem pesquisa de integração como as outras três — e eu não vou inventar endereço nem prazo`,`COMO ACHAR O ENDEREÇO DE NÚMEROS DA MÁQUINA (pergunta sua: "como saber isso?"), pelos três caminhos, com o aviso que economiza um susto: por padrão esse número MUDA quando a máquina reinicia, e aí o xcodef.com/delivery cai sem ninguém entender por quê. Reservar é de graça enquanto estiver em uso`,`A LICENÇA ON-LINE DO XCODEF LICENSE CENTER PASSA A SER CONFERIDA AQUI. Antes de desenhar, fui ler o license-center — e o plano do Delivery já existe lá, do jeito certo: Essencial R$ 149 com teto de 1.000 pedidos/mês, Profissional R$ 249 sem teto, Rede sob proposta a partir de 4 lojas, tudo cobrado por FILIAL, que é exatamente a unidade que a Central já sabe ligar e desligar. Não havia modalidade a inventar, havia uma a ligar. Entrou o leitor da chave assinada (Ed25519 — a assinatura digital em que a chave privada assina e a pública só confere) com 12 réguas, e a que mais importa comercialmente é esta: pegar a chave Essencial e reescrever o pacote para "pro" com teto de 999999 NÃO funciona. Confere sem internet, que é o requisito de verdade — restaurante às oito da noite de sexta não para porque o servidor de licença espirrou`,`AS DECISÕES DE INFRAESTRUTURA VIRARAM TEXTO, com o custo de cada uma. ADR-040: SQLite no PC da loja, Neon (o Postgres na nuvem, não a fintech de nome parecido) na Central — e a trava que não pode se perder no caminho, que é um banco por holding, para a separação entre clientes continuar sendo de construção e não de lembrança. ADR-041: Vercel na frente, o programa na GCP, os dados no Neon — e a segunda via para o aviso do motoboy atravessar o repassador da Vercel, que é o preço de manter xcodef.com/delivery ao pé da letra`],correcoes:[`EU DISSE QUE PRECISAVA DO ANDROID STUDIO PARA COMPILAR. Está errado, e a imprecisão atrapalha quem vai instalar: o Android Studio é o EDITOR — quem compila o .aab é o SDK do Android, mais o Gradle, mais o Java. Tentei fazer aqui: Java 21 e Gradle 8.14.3 já existem nesta máquina e o projeto Android está no repositório; o que impede é a política de rede deste ambiente, que bloqueia os servidores de download da Google. Então a compilação é na sua máquina, e a receita ficou completa — inclusive a chave de assinatura, que é o item que ninguém pode perder: perder a chave é nunca mais atualizar o aplicativo publicado`,`A CONTA DO GOOGLE PLAY ESTÁ TRAVADA NUM PONTO QUE A TELA NÃO DEIXA ÓBVIO. Pelo print: a conta XCODEF existe e está paga, mas "Criar app" está apagado até as verificações fecharem — e elas têm ordem obrigatória: identidade, depois organização (é esta que o Google analisa à mão e leva dias), depois site, e só então telefone. Adiantar o site sem mandar os documentos da empresa não destrava nada`,`UMA RÉGUA MINHA ERA FROUXA E INSTÁVEL AO MESMO TEMPO — a pior combinação. A do ritmo cobrava "de 0,5 a 3 pedidos por minuto, esperado ~1" numa amostra de dois minutos. Só que os pedidos chegam EM LOTE (é assim que restaurante recebe, e é o que a agenda faz de propósito): na mesma janela eu medi 20, 19 e 16 pedidos em execuções seguidas, sem nada mudar. Ou seja: ela aprovava o TRIPLO do esperado e mesmo assim ficava vermelha de vez em quando, no ponto exato onde a faixa acabava. A taxa exata quem cobra é o teste de unidade, que abre a agenda da hora inteira e exige 60 pedidos para o ritmo padrão — função pura, nada a flutuar. No navegador ficou o que só ele prova: que a agenda vira pedido na tela, que eles continuam chegando, e que o painel aguenta`,`MAIS DUAS RÉGUAS MINHAS ACUSAVAM DEFEITO ONDE NÃO HAVIA — e as duas pelo mesmo vício: fotografar um instante em vez de esperar sossegar. A dos DOIS NAVEGADORES tirava uma foto de cada um e comparava na hora; ficava vermelha quando um aparecia com o selo "FORA DO PERÍMETRO" e o outro ainda não — os dois certos, só que a conta da distância termina um instante depois do cartão aparecer, e dois navegadores não desenham no mesmo milissegundo. Agora ela espera cada um parar de mudar antes de comparar. A de POR EMPRESA clicava na aba logo depois de recarregar, quando o botão já está desenhado mas ainda não está LIGADO: o clique caía no vazio e a espera estourava contando que "a cozinha não pergunta de qual empresa é" — sobre uma cozinha que pergunta perfeitamente. Agora tenta três vezes, e se em três não abrir, aí é defeito e ela diz isso`,`ACHEI A FAMÍLIA DO DEFEITO DAS RÉGUAS, E ELA É GRANDE: ESPERA FIXA SEGUIDA DE CONFERÊNCIA IMEDIATA. Cada execução da bateria ficava vermelha em réguas DIFERENTES, e todas passavam sozinhas — três vezes seguidas, e até sob seis processos queimando CPU numa máquina de quatro núcleos. Disco e memória folgados. O que elas têm em comum é o método: esperam um número de milissegundos que alguém chutou e conferem logo depois. O chute é o tempo que a tela COSTUMA levar, não o que ela PODE levar. Duas acusações graves saíram daí: "o cadastro sumiu ao recarregar" (sobre um cadastro que estava lá, só que o filtro ainda não tinha aplicado — 300 ms) e "a tela não diz o que acontece agora" (sobre uma tela que diz, 700 ms depois). Consertei as quatro que apareceram, trocando relógio por FATO. Mas a bateria tem mais de 150 esperas fixas, então isto vai voltar: é trabalho agendado, não resolvido`,`AS "ABAS EM BRANCO" DAS CONFIGURAÇÕES: varri as 11 abas nos 6 monitores e NÃO REPRODUZI — toda aba que um perfil alcança entregou conteúdo, medido em pixels, campos e letras. Ficou a ferramenta que mede (scripts/shots-configuracoes.mjs), que na primeira versão media só dois monitores e achava que media seis: uma vez no Caixa não há como voltar, porque só o gestor troca de monitor, e o monitor escolhido fica guardado. Se a queixa voltar, o print é de um clique`]},{version:`0.28.2`,date:`2026-08-28`,titulo:`O caminho até o pagamento — e um botão que não baixava nada`,melhorias:[`O CAMINHO ATÉ A TELA DE PAGAMENTO, CLIQUE A CLIQUE (pedido seu: "me leve até o ambiente para pagamento"). Está em DOCUMENTACAO.html#arquitetura 7.5: onde entrar, o que cada tela pede, a escolha que NÃO muda mais depois (a moeda), o CNPJ para a nota sair no nome da xcodef, e o alarme de gasto de cinco minutos que evita descobrir o problema pela fatura. Junto, a conta inteira do que vai custar: domínio R$ 0 (já é seu), cadeado R$ 0, máquina R$ 0 na faixa grátis, backup centavos — o cartão existe porque o Google exige mesmo para o que é de graça, não porque haja o que pagar`],correcoes:[`UM BOTÃO QUE NÃO BAIXAVA NADA. Em "Cardápio → Exportar" havia o "💾 Baixar cardapio.csv" que, na demonstração publicada, NÃO FUNCIONA: o download é barrado quando a página está dentro da moldura de outra, e é assim que o link publicado abre. Barrado em silêncio — o clique acontece, a pasta de downloads continua vazia, e a tela não diz nada. Agora o botão só aparece onde o baixar funciona; onde não funciona, a tela explica por quê e o Copiar (que funciona sempre) fica no lugar dele. Com régua nova que abre a página dos DOIS jeitos, porque nenhuma das quarenta enxergava isso: todas abriam por cima`,`A RECEITA DE SUBIDA AINDA DIZIA QUE A FASE 2 NÃO EXISTIA. DOCUMENTACAO.html#arquitetura abria afirmando que o movimento não roda pela Central e que domínio e backup estavam em aberto — três coisas desmentidas pela v0.28.0 e pela v0.28.1. Quem lesse para pôr no ar concluiria que o piloto não tinha como acontecer`,`O NOME "FASE 2" QUERIA DIZER DUAS COISAS DIFERENTES. No glossário, F2 é "Keeta integrada"; no documento da Central, fase 2 é o movimento passar a viver no servidor. Numeração igual, assuntos sem nenhuma relação — e a v0.28.0 "entregou a fase 2" pela segunda definição, o que faria qualquer leitor achar que o Keeta entrou. As duas agora estão nomeadas e apartadas, com o aviso no glossário e a ressalva na primeira vez que cada documento usa o termo`,`O ACHADO DO DOMÍNIO, QUE MUDA O CAMINHO DA SUBIDA: o xcodef.com JÁ EXISTE e já aponta para a Vercel, onde mora um site seu. Como um nome aponta para um lugar só, fazer a Central atender em xcodef.com/delivery ao pé da letra exige que a Vercel repasse — e repassador no meio é justamente o que costuma cortar a conexão aberta que leva o aviso ao celular do motoboy. Recomendo delivery.xcodef.com, que tem o mesmo efeito para quem usa e nenhuma incógnita; se você preferir o endereço original, eu subo assim e testo o aviso em primeiro lugar (ADR-039)`]},{version:`0.28.1`,date:`2026-08-28`,titulo:`O aplicativo do motoboy entra na Central, e a Central vai morar em xcodef.com/delivery`,melhorias:[`O APLICATIVO INSTALADO ENTRA NA CENTRAL. Aberto como página ele continua sendo a demonstração; instalado no celular, o motoboy entra com usuário e senha e vê a viagem DELE, vinda do servidor. É a mesma tela nos dois casos — ela nunca soube de onde vêm os dados. Sem sinal, uma tarja avisa que o que ele marcar sobe quando a rede voltar, em vez de fingir que já chegou`,`A CENTRAL PASSA A CABER EM xcodef.com/delivery. Servir num subcaminho quebra duas coisas que só aparecem servidas assim: a página pedindo os arquivos a partir da raiz do domínio (tela branca) e o cliente chamando a raiz para entrar (recusa). As duas foram arrumadas, e a régua de ponta a ponta agora roda ATRAVÉS de um proxy que tira o prefixo — exatamente como o servidor de verdade vai fazer`,`DÁ PARA CRIAR AS CONTAS DE QUEM VAI USAR. A Central nascia com UM gestor e não havia caminho nenhum para pôr um caixa, uma cozinha ou — o que trava o piloto — um ENTREGADOR: só escrevendo código na máquina do cliente, com senha dentro. Agora é um comando. O do entregador cria a conta E o cadastro da operação de uma vez, porque separados eles não funcionam: só a conta entra e não vê viagem nenhuma; só o cadastro aparece na escala e não consegue entrar`,`BACKUP AUTOMÁTICO, NO MAIS BARATO QUE EXISTE: cópia consistente com o servidor rodando (a cópia online do próprio SQLite, não um tar da pasta), receita de cron diário e Google Cloud Storage na classe Archive — centavos por ano para o banco de um restaurante. Com o teste de RESTAURAÇÃO junto: backup que ninguém restaurou é esperança, não backup`],correcoes:[`A CENTRAL SERVIA A TELA ERRADA NA RAIZ. Ela entregava o painel da fase 1 — aquele que conversa por WebSocket com um hub rodando no PC da loja —, e esse hub não existe no servidor. Quem seguisse a receita e abrisse o endereço veria uma tela tentando falar com uma coisa que não está no ar, sem nada explicando por quê`,`UMA RÉGUA MINHA MEDIA NADA. A que garante que o aplicativo publicado não fala com servidor nenhum descartava todo endereço começado em "file:" — e o arquivo publicado é aberto JUSTAMENTE assim, então uma chamada que escapasse virava "file:///api/…" e passava batido. Ela passava verde com o vazamento na frente dela. Só descobri porque plantei a isca; agora descarta só o endereço da própria página`]},{version:`0.28.0`,date:`2026-08-28`,titulo:`FASE 2 — o movimento sai do navegador e passa a viver no servidor`,melhorias:[`O QUE RESPONDIA "movimento do cliente ainda não ligado nesta Central" AGORA GUARDA E DEVOLVE DE VERDADE: pedido, prato da bancada, pedido à cozinha, viagem, motoboy, cardápio e parâmetros. Cada cliente tem o arquivo de banco dele — a conexão JÁ É a do cliente, então não existe o "onde cliente = X" que alguém pode esquecer`,`A CENTRAL AVISA, EM VEZ DE ESPERAR PERGUNTAREM. Era o que você cobrou com todas as letras: "as entregas precisam chegar até ele, já não pode ser só no navegador". A via fica aberta, o servidor escreve nela quando alguma coisa muda, e o aparelho reconecta sozinho — voltando do sem-sinal ele continua DO PONTO EM QUE PAROU, sem perder o que passou e sem repetir o que já viu`,`GUARDAR E AVISAR VIRARAM O MESMO ATO, na mesma transação. Não existe "grava aqui, avisa ali": se avisar fosse uma chamada separada, o primeiro lugar em que alguém esquecesse viraria uma tela que não atualiza — e o defeito apareceria como "às vezes some", que é o pior de caçar`,`O MOTOBOY ENTRA COM USUÁRIO E SENHA, e o corte é feito NO SERVIDOR: ele vê a viagem dele e mais nada — nem os pedidos da loja, nem a bancada, nem quanto os colegas recolheram. Antes essa regra era a tela escondendo; com o movimento no servidor, esconder na tela e deixar a rota aberta não esconde nada`,`A FILA DE QUANDO CAI O SINAL: o motoboy entra no elevador, marca "entreguei" e sai. O toque fica guardado no aparelho e sobe quando o sinal volta. Mandar duas vezes NÃO dobra a entrega no relatório (cada toque tem identificador próprio), a ordem dos passos nunca embaralha, e um fato que jamais vai dar certo sai da fila em vez de travar tudo o que está atrás`,`E A TELA PASSOU A VER OS DADOS DA CENTRAL. O motor continua o mesmo — a regra de negócio não muda por estar num servidor —; o que mudou é ONDE o estado vive. Uma régua nova sobe uma Central de verdade, abre DUAS telas nela e prova sem truque: o pedido lançado numa aparece na outra SEM NINGUÉM RECARREGAR, recarregar não perde nada (o estado mora no banco, não na aba) e quem abre depois já entra com o quadro cheio`,`TRAVA CONTRA VAZAMENTO ENTRE LOJAS DO MESMO CLIENTE: quem alcança um endereço não lê nem grava no endereço do lado, nem digitando o outro na barra. E a recusa é a MESMA para "não existe" e "não é sua" — responder diferente ensina a quem está sondando quantas lojas o cliente tem`],correcoes:[`DOIS COMPUTADORES DESPACHANDO AO MESMO TEMPO derrubavam a rota com erro interno. O número da viagem é único no dia daquela loja e o banco garante isso — o segundo esbarrava na trava, que estava fazendo o trabalho dela, e recebia um "quebrou aqui dentro" que não diz o que fazer. Agora recebe "esse número já foi usado hoje, peça um novo"`]},{version:`0.27.2`,date:`2026-08-27`,titulo:`O relógio da entrega virou parâmetro, e o pedido na rua encolhe até a corrida acabar`,melhorias:[`O TEMPO DA VIAGEM AGORA É SEU. Estava embutido no código — de 60 a 110 SEGUNDOS para sair, entregar tudo e voltar — e a moto chegava antes de dar tempo de olhar a tela do motoboy. Virou parâmetro em MINUTOS, em Configurações › Geral › Ritmo da simulação › 🕐 Relógio da entrega`,`QUATRO RITMOS PRONTOS, para não ter de pensar em número: Rápido (1-2 min, a fila gira depressa) · Normal (6-11 min, o novo padrão: dá para acompanhar a moto e apertar cada botão) · Calmo (15-25 min, para demonstrar explicando cada etapa) · Aula (30-45 min, para treinar a equipe sem pressa)`,`TAMBÉM PARAMETRIZADOS: quanto o entregador da plataforma demora para chegar buscar o pedido, e quanto tempo o pedido entregue fica à vista antes de virar histórico. Eram três números fixos espalhados pelo motor`,`PEDIDO NA RUA VIRA TIRA FININHA e fica até a corrida acabar — de 120 para 30 pixels, 75% menor. Mesma linguagem do prato pronto na bancada: o que ainda pede decisão fica inteiro e colorido; o que já saiu da mão encolhe, esfria e continua à vista sem roubar espaço. O que ele vai RECEBER na porta continua legível, porque é dinheiro na rua`],correcoes:[`O "COPIAR PARA PLANILHA" NÃO COLAVA EM COLUNA NENHUMA — e não era só na tela de Entregas: eram os SETE botões de copiar do sistema (entregas, equipe, cardápio, clientes, fechamento, link de rastreio, link do trajeto). O relatório saía repartido por PONTO E VÍRGULA, que é o certo dentro de um arquivo .csv e é justamente o que nem o Excel nem o Google Planilhas repartem no Ctrl+V: colava tudo numa célula só. Ao colar, os dois repartem por TABULAÇÃO. Agora cada relatório tem duas saídas, mesmo conteúdo e mesma ordem de colunas — uma para arquivo, outra para colar`,`E O AVISO "COPIADO" MENTIA, nos mesmos sete. O painel pedia a cópia, engolia qualquer erro e escrevia "copiado" de qualquer jeito — inclusive quando o navegador barrava a área de transferência (acontece com a página aberta do arquivo, sem permissão, ou com a aba fora de foco). A pessoa ia à planilha, dava Ctrl+V e colava outra coisa, e procurava o defeito no lugar errado. Agora tenta pelo jeito moderno, tenta pelo antigo e, se os dois falharem, DIZ que não copiou. Dois guardrails no código impedem o padrão de voltar`,`O REGISTRO DO DIA MOSTRAVA OS TÍTULOS E NENHUMA LINHA. A tabela tem catorze colunas — 1.444 pixels — e estava servida dentro da coluna de viagens, de 340. Sobrava para ela a altura que a lista não usou: 34 pixels, exatamente o cabeçalho. A coluna cortava o resto, e as viagens do dia ficavam invisíveis. Agora o registro se abre em faixa embaixo de todas as colunas, com a largura da tela e rolagem própria`,`PRATO QUE ALGUÉM JÁ TINHA PEGADO SUMIA DA BANCADA quando o pedido ficava pronto por outro caminho: o trabalho da pessoa evaporava no meio, que é o "caiu no limbo" ao contrário. Prato assumido agora fica até ser montado — só sai da bancada quando o pedido morre`,`O REGISTRO DO DIA FICAVA TRANCADO ATRÁS DO FIM DO EXPEDIENTE. A coluna de viagens comprime numa barrinha de 46 pixels quando não há moto na rua — e nela não cabem os botões, então sumia o "📒 Registro do dia" e o "📤 Copiar para planilha". Só que a coluna zera exatamente quando a ÚLTIMA moto volta, que é a hora em que o gestor senta para fechar o dia e quer justamente aquela tabela. Agora a barrinha inteira abre o registro com um toque, e o copiar passou a morar também dentro do painel do relatório — onde ele está sempre à vista`,`OS BOTÕES DA TELA DE CONVERSAS VOLTARAM A DIZER O QUE FAZEM. Cinco deles nunca tiveram explicação — entre eles o "➜ Converter em pedido", que é o que muda a vida do pedido, e o "Enviar assim" da resposta sugerida pelo atendente. Numa tela que a atendente usa correndo, botão sem explicação é botão que ninguém aperta na dúvida. Agora os treze explicam ao encostar o mouse, e uma régua reprova o próximo que nascer mudo`,`O SELO 🚀 ADIANTAR SÓ APARECIA COM SORTE. Ele nasce do par "entrega pronta esperando rota" + "pedido na cozinha para o mesmo bairro longe DA MESMA LOJA", e os dois pedidos-semente pegavam uma empresa sorteada cada um: o par se formava em cerca de uma abertura a cada nove. O que se mostra ao cliente não pode depender de sorteio — os dois nascem na mesma empresa agora`]},{version:`0.27.1`,date:`2026-08-27`,titulo:`Pente fino: uma fonte só para os números, e o pedido pronto saindo da bancada`,melhorias:[`UM PEDIDO GRANDE NA BANCADA, de propósito, para entender a montagem: quatro pratos diferentes do MESMO pedido, cada um com a sua ficha. Dá para ver a regra inteira — quem assume um prato fica dono só dele; "Montei o prato" fecha UM e a tira diz "aguarda 3"; o pedido só cai na entrega quando o último for montado`,`VIAGENS EM ANDAMENTO virou a ÚLTIMA fileira, à direita de todas. É a ordem de quem trabalha: o que pede decisão fica à esquerda, o que já saiu e só se acompanha fica no fim da linha`,`OS NÚMEROS DO MOTOBOY DIZEM O QUE ELES SÃO: "entregues" (chegou na mão do cliente), "na mochila" (saiu com ele) e "esperando sair" (já é dele, ainda na loja). Antes estava escrito "2 entregas" para quem tinha entregado ZERO`],correcoes:[`AS DUAS TELAS MOSTRAVAM NÚMEROS DIFERENTES PARA A MESMA PESSOA, no mesmo instante: 4,9 km na tela do gestor e 0,7 km na do entregador; 2 entregas numa e 0 na outra. Eram TRÊS contas concorrentes — um contador que o motor incrementava por parada, a soma das paradas da rota, e a soma das viagens. Agora todo número do dia sai de um lugar só (core/delivery/numeros.ts), derivado das viagens, com 10 testes`,`PEDIDO PRONTO CONTINUAVA OCUPANDO A BANCADA DA PRODUÇÃO. A limpeza só olhava estado final (entregue, concluído, cancelado) — e PRONTO não é final. O pedido ficava nos dois lugares ao mesmo tempo: na fila de entrega esperando motoboy, e ainda na bancada como se faltasse montar. Era o "os cards prontos não aparecem disponíveis para entrega": apareciam, mas a bancada poluída de trabalho que já saiu não deixava ver o que ainda falta`,`CONTADOR MANTIDO À MÃO NUNCA MAIS: os dois mapas que o motor incrementava por fora foram apagados. Contador atualizado a cada caminho desanda no primeiro que alguém esquecer — e desanda em silêncio, que é o pior jeito`,`A régua do acerto clicava no PRIMEIRO card da coluna e conferia se OUTRO pedido tinha sumido: passava só enquanto os dois eram o mesmo. Agora ela aponta para o pedido certo`]},{version:`0.27.0`,date:`2026-08-27`,titulo:`Entregas em pé, e o prato pronto encolhendo e caindo para o cinza`,melhorias:[`A TELA DE ENTREGAS VIROU FILEIRAS VERTICAIS: pedidos sem motoboy · viagens em andamento · retirada no balcão · o cartão de cada motoboy, todos lado a lado. As viagens eram uma faixa DEITADA no rodapé que brigava por altura com o quadro de agrupamento; em pé, cada fileira tem a altura inteira e rola por dentro. A tela cresce para o LADO, que é o que sobra num monitor de loja, e não para baixo, que é o que falta`,`NENHUMA FILEIRA ESPREME A OUTRA — todas com a mesma altura, cada uma rolando por dentro. A trava dos 50% que segurava a faixa antiga deixou de ser necessária: em pé, não existe altura para roubar`,`A COLUNA DE VIAGENS ZERADA COMPRIME numa barrinha vertical, com o título deitado de lado, igual às bancadas da produção. Devolve o espaço para quem tem trabalho`,`O PRATO PRONTO ENCOLHE, FICA CINZA E DESCE. Depois do "Montei o prato" o cartão vira uma TIRA FININHA — hora, número do pedido, o que era e para onde foi — e cai para o rodapé da bancada. Os coloridos, que ainda dão trabalho, ficam em cima, mais antigo primeiro`,`E O PRÓXIMO SOBE SOZINHO. Era a queixa do "montei o prato e caiu no limbo": antes o cartão ficava do mesmo tamanho, no mesmo lugar, só que cinza — nada se MOVIA, então nada dizia "acabou, o próximo é aquele ali em cima". Agora o movimento é a resposta`,`A ORDEM DA BANCADA VIROU REGRA DE NÚCLEO, com teste: qual prato sai primeiro é decisão de operação, não detalhe de estilo. Duas zonas (em pé e pronto), mais antigo em cima nas duas, e empate resolvido pelo identificador — cartão que dança entre duas atualizações é cartão que ninguém encontra`,`A RESPOSTA DO "E AGORA?" CONTINUA NA TELA: a tira carrega "→ PRONTOS" ou "aguarda 2" na ponta, e a frase inteira aparece ao encostar. Esconder isso numa dica seria desfazer o que a v0.21.5 arrumou`,`A BANCADA CONTA O QUE DÁ TRABALHO, não o que já saiu — e avisa "bancada limpa" quando tudo o que estava ali foi embora`,`CADA COLUNA DA TELA DE ENTREGAS AGORA DIZ O QUE ELA É (sem motoboy, coleta, balcão, viagens, motoboy). Sem isso, "todas as colunas de motoboy" e "todas as colunas" eram o mesmo seletor — e a coluna de viagens passou a ser contada como um entregador`],correcoes:[`A régua do layout de Entregas guardava a briga por ALTURA entre a faixa de viagens e o agrupamento — uma briga que a mudança para colunas acabou por construção. Ela foi refeita para o mesmo cuidado no outro eixo: fileiras da mesma altura, largura de coluna, e rolagem por dentro, com a rua cheia e em tela de notebook`,`A régua do arrastar soltava no vazio quando a coluna de destino nascia fora da tela — com a fileira crescendo para o lado, ela passa a ROLAR até o destino antes de arrastar, que é o que a pessoa faz. A falha parecia do programa e era da régua`]},{version:`0.26.0`,date:`2026-08-27`,titulo:`A Central ganhou os QUATRO NÍVEIS: holding → empresa → filial → módulos`,melhorias:[`QUATRO NÍVEIS, e cada um responde a uma pergunta que o negócio faz todo dia: a HOLDING é o cliente da xcodef (quem assina e quem paga), a EMPRESA é o CNPJ (quem emite nota), a FILIAL é o endereço (de onde a comida sai) e os MÓDULOS são o que ele contratou. Antes eram dois níveis, e dois obrigam a escolher qual dessas perguntas fica sem resposta`,`O ARQUIVO DE BANCO PASSOU A SER POR CLIENTE, e não por CNPJ: a fronteira de isolamento foi para onde ela pertence, que é onde um cliente termina e o outro começa. Dentro do grupo, a mesma pessoa transita entre as lojas — separar por arquivo ali impediria a consulta mais banal`,`ESCOPO, E NÃO LISTA DE PERMISSÕES: cada conta tem um NÍVEL e um ALVO — o grupo inteiro (o dono), um CNPJ (o gerente) ou um endereço (a caixa daquela loja). Lista de permissão sempre acaba com alguém esquecendo de tirar uma; um par nível+alvo, não`,`A PODA É DO SERVIDOR, NÃO DA TELA: quando a pessoa entra, o servidor devolve a árvore JÁ podada pelo escopo dela e os módulos JÁ resolvidos por filial. Quem esconde botão na tela e deixa a rota aberta no servidor não escondeu nada`,`MÓDULOS COM HIERARQUIA DE MÃO ÚNICA: a holding CONTRATA; empresa e filial só ESTREITAM. Filial nenhuma liga sozinha um módulo que o grupo não comprou — senão o contrato viraria sugestão. Já estreitar pode: a matriz tem cozinha e a filial do shopping não, e isso é operação, não contrato`,`LIGAR UM MÓDULO LIGA O QUE ELE PRECISA, e desligar derruba quem depende dele — em cascata, nas duas direções. Vender o aplicativo do motoboy sem entregas é vender uma tela que não recebe viagem, e o cliente só descobriria depois de pagar`,`TREZE MÓDULOS mapeados a partir do que o sistema faz de verdade, cada um com o texto que vai na proposta: quadro, produção, cozinha, buffet e compras, entregas, aplicativo do motoboy, cardápio, WhatsApp, atendente automático, ficha do cliente, fechamento, mapa ao vivo e conformidade`,`O QUADRO DE PEDIDOS NÃO É OPCIONAL: vender o sistema sem ele não é vender menos, é vender nada — então ele fica sempre de pé, aconteça o que acontecer com o resto do contrato`,`PREÇO NÃO ENTRA NO PROGRAMA, de propósito: quanto custa cada módulo é conversa comercial e muda p
