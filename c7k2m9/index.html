ble_strictMode&&(n=!0),t.identifierPrefix!==void 0&&(r=t.identifierPrefix),t.onUncaughtError!==void 0&&(i=t.onUncaughtError),t.onCaughtError!==void 0&&(a=t.onCaughtError),t.onRecoverableError!==void 0&&(o=t.onRecoverableError)),t=ep(e,1,!1,null,null,n,r,null,i,a,o,Pp),e[pt]=t.current,Sd(e),new Fp(t)}})),c=e(((e,t)=>{function n(){if(!(typeof __REACT_DEVTOOLS_GLOBAL_HOOK__>`u`||typeof __REACT_DEVTOOLS_GLOBAL_HOOK__.checkDCE!=`function`))try{__REACT_DEVTOOLS_GLOBAL_HOOK__.checkDCE(n)}catch(e){console.error(e)}}n(),t.exports=s()})),l=n(),u=c(),d=`xcodef-delivery`,f=[{version:`0.28.4`,date:`2026-09-01`,titulo:`A licença obedece a política no cliente — e a chave privada nunca mais aparece numa tela`,melhorias:[`O PORTÃO PASSA A ACEITAR A LICENÇA ASSINADA DO XCODEF.COM, além da chave curta da demonstração. Cole a chave longa (a que começa com "XCODEF.") e a página confere a ASSINATURA ali mesmo, com a criptografia do próprio navegador (WebCrypto, a mesma conta Ed25519 da Central) contra a chave pública EMBUTIDA no programa — embutida porque chave que o programa baixasse da internet seria chave trocável por quem controla a rede. Cada recusa tem a sua frase: chave truncada, assinatura que não confere, licença vencida, chave de outro sistema — porque o que a pessoa precisa FAZER é diferente em cada caso. E quem entra vê no selo o que comprou: o plano, o teto de pedidos e, na última semana, o aviso de vencimento`,`O TETO DE PEDIDOS DO MÊS VIROU MOTOR (core/licenca/limite-mensal.ts): conta o uso do mês, avisa a partir de 80% do teto e sabe o que fazer quando ele chega. O QUE fazer viaja DENTRO da chave assinada (campo ao_atingir), porque é cláusula do contrato entre o xcodef e o cliente — se fosse parâmetro editável da casa, o teto seria decorativo. E o padrão, quando o campo não vem, é AVISAR E SEGUIR: restaurante às oito da noite de sexta não para porque um contador virou; parar no teto é escolha explícita de quem emite, e mesmo ela só barra pedido NOVO — o que já entrou segue até o fim`,`NASCEU O "npm run licenca:publica": um comando que busca a chave PÚBLICA no License Center, grava no código-fonte e imprime a digital (o resumo SHA-256) para conferência humana. Com trava na porta: qualquer coisa com cara de chave PRIVADA é recusada na hora — chave privada não entra neste repositório nem por engano. É o fim do copia-e-cola de chave: uma linha de comando e a versão seguinte já confere as licenças de verdade`,`NO LICENSE CENTER (o outro lado desta conversa), A CHAVE PRIVADA GANHOU COFRE: ela nasce CIFRADA no banco (AES-256-GCM, a criptografia autenticada que denuncia qualquer byte alterado) e NENHUMA tela a exibe — nunca mais a caixa amarela que pedia para copiar uma chave privada, que foi exatamente como um par se queimou num print. Uma senha de cofre configurada UMA vez na vida do ambiente, e daí em diante gerar par é um clique sem nada para copiar, colar ou reimplantar. O emissor que encontra o cofre trancado PARA com erro claro em vez de emitir com a chave errada em silêncio. ScanFácil Pro e IngestCore seguem intocados no caminho antigo`,`O PRATO QUE SOME DA BANCADA DEIXA RASTRO (o seu relato: "bateu na fila do Jefferson e sem ele fazer nada sumiu"). O comportamento é a regra combinada — quando o pedido fica PRONTO por outro caminho (o quadro, o caixa), o trabalho da bancada acabou e os pratos saem —, mas até aqui ele era MUDO. Agora a tela da Produção mostra a faixa 👻 com pedido, hora e pratos de cada sumiço do dia. Se a regra deve mudar ("pronto só depois de montado"), é outra decisão, e está aberta; o que não fica é o mistério`],correcoes:[]},{version:`0.28.3`,date:`2026-08-28`,titulo:`O registro do dia sai da disputa por espaço — e as decisões de infraestrutura ficam escritas`,melhorias:[`O REGISTRO DO DIA VIROU BOTÃO NA BARRA E ABRE EM TELA CHEIA, como você desenhou: "colocar um botão para essa função do lado de desfazer sugestões e abrir frame maximizando com todas as informações". Era o mesmo defeito de sempre, na terceira forma: relatório de catorze colunas disputando espaço com a operação. Dentro da coluna estreita ele perdia as LINHAS; em faixa embaixo do quadro ele perdia a ALTURA quando havia moto na rua. Agora não disputa com nada — o botão fica sempre no mesmo lugar da barra, e o painel toma a tela inteira (a régua mede: 98% da largura, 96% da altura) e fecha no ✕ ou no Esc`,`O ROTEIRO DAS CREDENCIAIS E DA HOMOLOGAÇÃO nas quatro plataformas (docs/CREDENCIAIS-PLATAFORMAS.md): quem pede o quê, em que ordem, quanto tempo cada fila leva e o que não pode começar antes do quê. Com a armadilha do iFood em destaque (reprovar na homologação custa outra semana, então o checklist deles vira suíte de teste desde o começo) e com a Rappi tratada com honestidade: ela existe como cadastro no sistema, mas não tem pesquisa de integração como as outras três — e eu não vou inventar endereço nem prazo`,`COMO ACHAR O ENDEREÇO DE NÚMEROS DA MÁQUINA (pergunta sua: "como saber isso?"), pelos três caminhos, com o aviso que economiza um susto: por padrão esse número MUDA quando a máquina reinicia, e aí o xcodef.com/delivery cai sem ninguém entender por quê. Reservar é de graça enquanto estiver em uso`,`A LICENÇA ON-LINE DO XCODEF LICENSE CENTER PASSA A SER CONFERIDA AQUI. Antes de desenhar, fui ler o license-center — e o plano do Delivery já existe lá, do jeito certo: Essencial R$ 149 com teto de 1.000 pedidos/mês, Profissional R$ 249 sem teto, Rede sob proposta a partir de 4 lojas, tudo cobrado por FILIAL, que é exatamente a unidade que a Central já sabe ligar e desligar. Não havia modalidade a inventar, havia uma a ligar. Entrou o leitor da chave assinada (Ed25519 — a assinatura digital em que a chave privada assina e a pública só confere) com 12 réguas, e a que mais importa comercialmente é esta: pegar a chave Essencial e reescrever o pacote para "pro" com teto de 999999 NÃO funciona. Confere sem internet, que é o requisito de verdade — restaurante às oito da noite de sexta não para porque o servidor de licença espirrou`,`AS DECISÕES DE INFRAESTRUTURA VIRARAM TEXTO, com o custo de cada uma. ADR-040: SQLite no PC da loja, Neon (o Postgres na nuvem, não a fintech de nome parecido) na Central — e a trava que não pode se perder no caminho, que é um banco por holding, para a separação entre clientes continuar sendo de construção e não de lembrança. ADR-041: Vercel na frente, o programa na GCP, os dados no Neon — e a segunda via para o aviso do motoboy atravessar o repassador da Vercel, que é o preço de manter xcodef.com/delivery ao pé da letra`],correcoes:[`EU DISSE QUE PRECISAVA DO ANDROID STUDIO PARA COMPILAR. Está errado, e a imprecisão atrapalha quem vai instalar: o Android Studio é o EDITOR — quem compila o .aab é o SDK do Android, mais o Gradle, mais o Java. Tentei fazer aqui: Java 21 e Gradle 8.14.3 já existem nesta máquina e o projeto Android está no repositório; o que impede é a política de rede deste ambiente, que bloqueia os servidores de download da Google. Então a compilação é na sua máquina, e a receita ficou completa — inclusive a chave de assinatura, que é o item que ninguém pode perder: perder a chave é nunca mais atualizar o aplicativo publicado`,`A CONTA DO GOOGLE PLAY ESTÁ TRAVADA NUM PONTO QUE A TELA NÃO DEIXA ÓBVIO. Pelo print: a conta XCODEF existe e está paga, mas "Criar app" está apagado até as verificações fecharem — e elas têm ordem obrigatória: identidade, depois organização (é esta que o Google analisa à mão e leva dias), depois site, e só então telefone. Adiantar o site sem mandar os documentos da empresa não destrava nada`,`UMA RÉGUA MINHA ERA FROUXA E INSTÁVEL AO MESMO TEMPO — a pior combinação. A do ritmo cobrava "de 0,5 a 3 pedidos por minuto, esperado ~1" numa amostra de dois minutos. Só que os pedidos chegam EM LOTE (é assim que restaurante recebe, e é o que a agenda faz de propósito): na mesma janela eu medi 20, 19 e 16 pedidos em execuções seguidas, sem nada mudar. Ou seja: ela aprovava o TRIPLO do esperado e mesmo assim ficava vermelha de vez em quando, no ponto exato onde a faixa acabava. A taxa exata quem cobra é o teste de unidade, que abre a agenda da hora inteira e exige 60 pedidos para o ritmo padrão — função pura, nada a flutuar. No navegador ficou o que só ele prova: que a agenda vira pedido na tela, que eles continuam chegando, e que o painel aguenta`,`MAIS DUAS RÉGUAS MINHAS ACUSAVAM DEFEITO ONDE NÃO HAVIA — e as duas pelo mesmo vício: fotografar um instante em vez de esperar sossegar. A dos DOIS NAVEGADORES tirava uma foto de cada um e comparava na hora; ficava vermelha quando um aparecia com o selo "FORA DO PERÍMETRO" e o outro ainda não — os dois certos, só que a conta da distância termina um instante depois do cartão aparecer, e dois navegadores não desenham no mesmo milissegundo. Agora ela espera cada um parar de mudar antes de comparar. A de POR EMPRESA clicava na aba logo depois de recarregar, quando o botão já está desenhado mas ainda não está LIGADO: o clique caía no vazio e a espera estourava contando que "a cozinha não pergunta de qual empresa é" — sobre uma cozinha que pergunta perfeitamente. Agora tenta três vezes, e se em três não abrir, aí é defeito e ela diz isso`,`ACHEI A FAMÍLIA DO DEFEITO DAS RÉGUAS, E ELA É GRANDE: ESPERA FIXA SEGUIDA DE CONFERÊNCIA IMEDIATA. Cada execução da bateria ficava vermelha em réguas DIFERENTES, e todas passavam sozinhas — três vezes seguidas, e até sob seis processos queimando CPU numa máquina de quatro núcleos. Disco e memória folgados. O que elas têm em comum é o método: esperam um número de milissegundos que alguém chutou e conferem logo depois. O chute é o tempo que a tela COSTUMA levar, não o que ela PODE levar. Duas acusações graves saíram daí: "o cadastro sumiu ao recarregar" (sobre um cadastro que estava lá, só que o filtro ainda não tinha aplicado — 300 ms) e "a tela não diz o que acontece agora" (sobre uma tela que diz, 700 ms depois). Consertei as quatro que apareceram, trocando relógio por FATO. Mas a bateria tem mais de 150 esperas fixas, então isto vai voltar: é trabalho agendado, não resolvido`,`AS "ABAS EM BRANCO" DAS CONFIGURAÇÕES: varri as 11 abas nos 6 monitores e NÃO REPRODUZI — toda aba que um perfil alcança entregou conteúdo, medido em pixels, campos e letras. Ficou a ferramenta que mede (scripts/shots-configuracoes.mjs), que na primeira versão media só dois monitores e achava que media seis: uma vez no Caixa não há como voltar, porque só o gestor troca de monitor, e o monitor escolhido fica guardado. Se a queixa voltar, o print é de um clique`]},{version:`0.28.2`,date:`2026-08-28`,titulo:`O caminho até o pagamento — e um botão que não baixava nada`,melhorias:[`O CAMINHO ATÉ A TELA DE PAGAMENTO, CLIQUE A CLIQUE (pedido seu: "me leve até o ambiente para pagamento"). Está em docs/CENTRAL.md 7.5: onde entrar, o que cada tela pede, a escolha que NÃO muda mais depois (a moeda), o CNPJ para a nota sair no nome da xcodef, e o alarme de gasto de cinco minutos que evita descobrir o problema pela fatura. Junto, a conta inteira do que vai custar: domínio R$ 0 (já é seu), cadeado R$ 0, máquina R$ 0 na faixa grátis, backup centavos — o cartão existe porque o Google exige mesmo para o que é de graça, não porque haja o que pagar`],correcoes:[`UM BOTÃO QUE NÃO BAIXAVA NADA. Em "Cardápio → Exportar" havia o "💾 Baixar cardapio.csv" que, na demonstração publicada, NÃO FUNCIONA: o download é barrado quando a página está dentro da moldura de outra, e é assim que o link publicado abre. Barrado em silêncio — o clique acontece, a pasta de downloads continua vazia, e a tela não diz nada. Agora o botão só aparece onde o baixar funciona; onde não funciona, a tela explica por quê e o Copiar (que funciona sempre) fica no lugar dele. Com régua nova que abre a página dos DOIS jeitos, porque nenhuma das quarenta enxergava isso: todas abriam por cima`,`A RECEITA DE SUBIDA AINDA DIZIA QUE A FASE 2 NÃO EXISTIA. docs/CENTRAL.md abria afirmando que o movimento não roda pela Central e que domínio e backup estavam em aberto — três coisas desmentidas pela v0.28.0 e pela v0.28.1. Quem lesse para pôr no ar concluiria que o piloto não tinha como acontecer`,`O NOME "FASE 2" QUERIA DIZER DUAS COISAS DIFERENTES. No glossário, F2 é "Keeta integrada"; no documento da Central, fase 2 é o movimento passar a viver no servidor. Numeração igual, assuntos sem nenhuma relação — e a v0.28.0 "entregou a fase 2" pela segunda definição, o que faria qualquer leitor achar que o Keeta entrou. As duas agora estão nomeadas e apartadas, com o aviso no glossário e a ressalva na primeira vez que cada documento usa o termo`,`O ACHADO DO DOMÍNIO, QUE MUDA O CAMINHO DA SUBIDA: o xcodef.com JÁ EXISTE e já aponta para a Vercel, onde mora um site seu. Como um nome aponta para um lugar só, fazer a Central atender em xcodef.com/delivery ao pé da letra exige que a Vercel repasse — e repassador no meio é justamente o que costuma cortar a conexão aberta que leva o aviso ao celular do motoboy. Recomendo delivery.xcodef.com, que tem o mesmo efeito para quem usa e nenhuma incógnita; se você preferir o endereço original, eu subo assim e testo o aviso em primeiro lugar (ADR-039)`]},{version:`0.28.1`,date:`2026-08-28`,titulo:`O aplicativo do motoboy entra na Central, e a Central vai morar em xcodef.com/delivery`,melhorias:[`O APLICATIVO INSTALADO ENTRA NA CENTRAL. Aberto como página ele continua sendo a demonstração; instalado no celular, o motoboy entra com usuário e senha e vê a viagem DELE, vinda do servidor. É a mesma tela nos dois casos — ela nunca soube de onde vêm os dados. Sem sinal, uma tarja avisa que o que ele marcar sobe quando a rede voltar, em vez de fingir que já chegou`,`A CENTRAL PASSA A CABER EM xcodef.com/delivery. Servir num subcaminho quebra duas coisas que só aparecem servidas assim: a página pedindo os arquivos a partir da raiz do domínio (tela branca) e o cliente chamando a raiz para entrar (recusa). As duas foram arrumadas, e a régua de ponta a ponta agora roda ATRAVÉS de um proxy que tira o prefixo — exatamente como o servidor de verdade vai fazer`,`DÁ PARA CRIAR AS CONTAS DE QUEM VAI USAR. A Central nascia com UM gestor e não havia caminho nenhum para pôr um caixa, uma cozinha ou — o que trava o piloto — um ENTREGADOR: só escrevendo código na máquina do cliente, com senha dentro. Agora é um comando. O do entregador cria a conta E o cadastro da operação de uma vez, porque separados eles não funcionam: só a conta entra e não vê viagem nenhuma; só o cadastro aparece na escala e não consegue entrar`,`BACKUP AUTOMÁTICO, NO MAIS BARATO QUE EXISTE: cópia consistente com o servidor rodando (a cópia online do próprio SQLite, não um tar da pasta), receita de cron diário e Google Cloud Storage na classe Archive — centavos por ano para o banco de um restaurante. Com o teste de RESTAURAÇÃO junto: backup que ninguém restaurou é esperança, não backup`],correcoes:[`A CENTRAL SERVIA A TELA ERRADA NA RAIZ. Ela entregava o painel da fase 1 — aquele que conversa por WebSocket com um hub rodando no PC da loja —, e esse hub não existe no servidor. Quem seguisse a receita e abrisse o endereço veria uma tela tentando falar com uma coisa que não está no ar, sem nada explicando por quê`,`UMA RÉGUA MINHA MEDIA NADA. A que garante que o aplicativo publicado não fala com servidor nenhum descartava todo endereço começado em "file:" — e o arquivo publicado é aberto JUSTAMENTE assim, então uma chamada que escapasse virava "file:///api/…" e passava batido. Ela passava verde com o vazamento na frente dela. Só descobri porque plantei a isca; agora descarta só o endereço da própria página`]},{version:`0.28.0`,date:`2026-08-28`,titulo:`FASE 2 — o movimento sai do navegador e passa a viver no servidor`,melhorias:[`O QUE RESPONDIA "movimento do cliente ainda não ligado nesta Central" AGORA GUARDA E DEVOLVE DE VERDADE: pedido, prato da bancada, pedido à cozinha, viagem, motoboy, cardápio e parâmetros. Cada cliente tem o arquivo de banco dele — a conexão JÁ É a do cliente, então não existe o "onde cliente = X" que alguém pode esquecer`,`A CENTRAL AVISA, EM VEZ DE ESPERAR PERGUNTAREM. Era o que você cobrou com todas as letras: "as entregas precisam chegar até ele, já não pode ser só no navegador". A via fica aberta, o servidor escreve nela quando alguma coisa muda, e o aparelho reconecta sozinho — voltando do sem-sinal ele continua DO PONTO EM QUE PAROU, sem perder o que passou e sem repetir o que já viu`,`GUARDAR E AVISAR VIRARAM O MESMO ATO, na mesma transação. Não existe "grava aqui, avisa ali": se avisar fosse uma chamada separada, o primeiro lugar em que alguém esquecesse viraria uma tela que não atualiza — e o defeito apareceria como "às vezes some", que é o pior de caçar`,`O MOTOBOY ENTRA COM USUÁRIO E SENHA, e o corte é feito NO SERVIDOR: ele vê a viagem dele e mais nada — nem os pedidos da loja, nem a bancada, nem quanto os colegas recolheram. Antes essa regra era a tela escondendo; com o movimento no servidor, esconder na tela e deixar a rota aberta não esconde nada`,`A FILA DE QUANDO CAI O SINAL: o motoboy entra no elevador, marca "entreguei" e sai. O toque fica guardado no aparelho e sobe quando o sinal volta. Mandar duas vezes NÃO dobra a entrega no relatório (cada toque tem identificador próprio), a ordem dos passos nunca embaralha, e um fato que jamais vai dar certo sai da fila em vez de travar tudo o que está atrás`,`E A TELA PASSOU A VER OS DADOS DA CENTRAL. O motor continua o mesmo — a regra de negócio não muda por estar num servidor —; o que mudou é ONDE o estado vive. Uma régua nova sobe uma Central de verdade, abre DUAS telas nela e prova sem truque: o pedido lançado numa aparece na outra SEM NINGUÉM RECARREGAR, recarregar não perde nada (o estado mora no banco, não na aba) e quem abre depois já entra com o quadro cheio`,`TRAVA CONTRA VAZAMENTO ENTRE LOJAS DO MESMO CLIENTE: quem alcança um endereço não lê nem grava no endereço do lado, nem digitando o outro na barra. E a recusa é a MESMA para "não existe" e "não é sua" — responder diferente ensina a quem está sondando quantas lojas o cliente tem`],correcoes:[`DOIS COMPUTADORES DESPACHANDO AO MESMO TEMPO derrubavam a rota com erro interno. O número da viagem é único no dia daquela loja e o banco garante isso — o segundo esbarrava na trava, que estava fazendo o trabalho dela, e recebia um "quebrou aqui dentro" que não diz o que fazer. Agora recebe "esse número já foi usado hoje, peça um novo"`]},{version:`0.27.2`,date:`2026-08-27`,titulo:`O relógio da entrega virou parâmetro, e o pedido na rua encolhe até a corrida acabar`,melhorias:[`O TEMPO DA VIAGEM AGORA É SEU. Estava embutido no código — de 60 a 110 SEGUNDOS para sair, entregar tudo e voltar — e a moto chegava antes de dar tempo de olhar a tela do motoboy. Virou parâmetro em MINUTOS, em Configurações › Geral › Ritmo da simulação › 🕐 Relógio da entrega`,`QUATRO RITMOS PRONTOS, para não ter de pensar em número: Rápido (1-2 min, a fila gira depressa) · Normal (6-11 min, o novo padrão: dá para acompanhar a moto e apertar cada botão) · Calmo (15-25 min, para demonstrar explicando cada etapa) · Aula (30-45 min, para treinar a equipe sem pressa)`,`TAMBÉM PARAMETRIZADOS: quanto o entregador da plataforma demora para chegar buscar o pedido, e quanto tempo o pedido entregue fica à vista antes de virar histórico. Eram três números fixos espalhados pelo motor`,`PEDIDO NA RUA VIRA TIRA FININHA e fica até a corrida acabar — de 120 para 30 pixels, 75% menor. Mesma linguagem do prato pronto na bancada: o que ainda pede decisão fica inteiro e colorido; o que já saiu da mão encolhe, esfria e continua à vista sem roubar espaço. O que ele vai RECEBER na porta continua legível, porque é dinheiro na rua`],correcoes:[`O "COPIAR PARA PLANILHA" NÃO COLAVA EM COLUNA NENHUMA — e não era só na tela de Entregas: eram os SETE botões de copiar do sistema (entregas, equipe, cardápio, clientes, fechamento, link de rastreio, link do trajeto). O relatório saía repartido por PONTO E VÍRGULA, que é o certo dentro de um arquivo .csv e é justamente o que nem o Excel nem o Google Planilhas repartem no Ctrl+V: colava tudo numa célula só. Ao colar, os dois repartem por TABULAÇÃO. Agora cada relatório tem duas saídas, mesmo conteúdo e mesma ordem de colunas — uma para arquivo, outra para colar`,`E O AVISO "COPIADO" MENTIA, nos mesmos sete. O painel pedia a cópia, engolia qualquer erro e escrevia "copiado" de qualquer jeito — inclusive quando o navegador barrava a área de transferência (acontece com a página aberta do arquivo, sem permissão, ou com a aba fora de foco). A pessoa ia à planilha, dava Ctrl+V e colava outra coisa, e procurava o defeito no lugar errado. Agora tenta pelo jeito moderno, tenta pelo antigo e, se os dois falharem, DIZ que não copiou. Dois guardrails no código impedem o padrão de voltar`,`O REGISTRO DO DIA MOSTRAVA OS TÍTULOS E NENHUMA LINHA. A tabela tem catorze colunas — 1.444 pixels — e estava servida dentro da coluna de viagens, de 340. Sobrava para ela a altura que a lista não usou: 34 pixels, exatamente o cabeçalho. A coluna cortava o resto, e as viagens do dia ficavam invisíveis. Agora o registro se abre em faixa embaixo de todas as colunas, com a largura da tela e rolagem própria`,`PRATO QUE ALGUÉM JÁ TINHA PEGADO SUMIA DA BANCADA quando o pedido ficava pronto por outro caminho: o trabalho da pessoa evaporava no meio, que é o "caiu no limbo" ao contrário. Prato assumido agora fica até ser montado — só sai da bancada quando o pedido morre`,`O REGISTRO DO DIA FICAVA TRANCADO ATRÁS DO FIM DO EXPEDIENTE. A coluna de viagens comprime numa barrinha de 46 pixels quando não há moto na rua — e nela não cabem os botões, então sumia o "📒 Registro do dia" e o "📤 Copiar para planilha". Só que a coluna zera exatamente quando a ÚLTIMA moto volta, que é a hora em que o gestor senta para fechar o dia e quer justamente aquela tabela. Agora a barrinha inteira abre o registro com um toque, e o copiar passou a morar também dentro do painel do relatório — onde ele está sempre à vista`,`OS BOTÕES DA TELA DE CONVERSAS VOLTARAM A DIZER O QUE FAZEM. Cinco deles nunca tiveram explicação — entre eles o "➜ Converter em pedido", que é o que muda a vida do pedido, e o "Enviar assim" da resposta sugerida pelo atendente. Numa tela que a atendente usa correndo, botão sem explicação é botão que ninguém aperta na dúvida. Agora os treze explicam ao encostar o mouse, e uma régua reprova o próximo que nascer mudo`,`O SELO 🚀 ADIANTAR SÓ APARECIA COM SORTE. Ele nasce do par "entrega pronta esperando rota" + "pedido na cozinha para o mesmo bairro longe DA MESMA LOJA", e os dois pedidos-semente pegavam uma empresa sorteada cada um: o par se formava em cerca de uma abertura a cada nove. O que se mostra ao cliente não pode depender de sorteio — os dois nascem na mesma empresa agora`]},{version:`0.27.1`,date:`2026-08-27`,titulo:`Pente fino: uma fonte só para os números, e o pedido pronto saindo da bancada`,melhorias:[`UM PEDIDO GRANDE NA BANCADA, de propósito, para entender a montagem: quatro pratos diferentes do MESMO pedido, cada um com a sua ficha. Dá para ver a regra inteira — quem assume um prato fica dono só dele; "Montei o prato" fecha UM e a tira diz "aguarda 3"; o pedido só cai na entrega quando o último for montado`,`VIAGENS EM ANDAMENTO virou a ÚLTIMA fileira, à direita de todas. É a ordem de quem trabalha: o que pede decisão fica à esquerda, o que já saiu e só se acompanha fica no fim da linha`,`OS NÚMEROS DO MOTOBOY DIZEM O QUE ELES SÃO: "entregues" (chegou na mão do cliente), "na mochila" (saiu com ele) e "esperando sair" (já é dele, ainda na loja). Antes estava escrito "2 entregas" para quem tinha entregado ZERO`],correcoes:[`AS DUAS TELAS MOSTRAVAM NÚMEROS DIFERENTES PARA A MESMA PESSOA, no mesmo instante: 4,9 km na tela do gestor e 0,7 km na do entregador; 2 entregas numa e 0 na outra. Eram TRÊS contas concorrentes — um contador que o motor incrementava por parada, a soma das paradas da rota, e a soma das viagens. Agora todo número do dia sai de um lugar só (core/delivery/numeros.ts), derivado das viagens, com 10 testes`,`PEDIDO PRONTO CONTINUAVA OCUPANDO A BANCADA DA PRODUÇÃO. A limpeza só olhava estado final (entregue, concluído, cancelado) — e PRONTO não é final. O pedido ficava nos dois lugares ao mesmo tempo: na fila de entrega esperando motoboy, e ainda na bancada como se faltasse montar. Era o "os cards prontos não aparecem disponíveis para entrega": apareciam, mas a bancada poluída de trabalho que já saiu não deixava ver o que ainda falta`,`CONTADOR MANTIDO À MÃO NUNCA MAIS: os dois mapas que o motor incrementava por fora foram apagados. Contador atualizado a cada caminho desanda no primeiro que alguém esquecer — e desanda em silêncio, que é o pior jeito`,`A régua do acerto clicava no PRIMEIRO card da coluna e conferia se OUTRO pedido tinha sumido: passava só enquanto os dois eram o mesmo. Agora ela aponta para o pedido certo`]},{version:`0.27.0`,date:`2026-08-27`,titulo:`Entregas em pé, e o prato pronto encolhendo e caindo para o cinza`,melhorias:[`A TELA DE ENTREGAS VIROU FILEIRAS VERTICAIS: pedidos sem motoboy · viagens em andamento · retirada no balcão · o cartão de cada motoboy, todos lado a lado. As viagens eram uma faixa DEITADA no rodapé que brigava por altura com o quadro de agrupamento; em pé, cada fileira tem a altura inteira e rola por dentro. A tela cresce para o LADO, que é o que sobra num monitor de loja, e não para baixo, que é o que falta`,`NENHUMA FILEIRA ESPREME A OUTRA — todas com a mesma altura, cada uma rolando por dentro. A trava dos 50% que segurava a faixa antiga deixou de ser necessária: em pé, não existe altura para roubar`,`A COLUNA DE VIAGENS ZERADA COMPRIME numa barrinha vertical, com o título deitado de lado, igual às bancadas da produção. Devolve o espaço para quem tem trabalho`,`O PRATO PRONTO ENCOLHE, FICA CINZA E DESCE. Depois do "Montei o prato" o cartão vira uma TIRA FININHA — hora, número do pedido, o que era e para onde foi — e cai para o rodapé da bancada. Os coloridos, que ainda dão trabalho, ficam em cima, mais antigo primeiro`,`E O PRÓXIMO SOBE SOZINHO. Era a queixa do "montei o prato e caiu no limbo": antes o cartão ficava do mesmo tamanho, no mesmo lugar, só que cinza — nada se MOVIA, então nada dizia "acabou, o próximo é aquele ali em cima". Agora o movimento é a resposta`,`A ORDEM DA BANCADA VIROU REGRA DE NÚCLEO, com teste: qual prato sai primeiro é decisão de operação, não detalhe de estilo. Duas zonas (em pé e pronto), mais antigo em cima nas duas, e empate resolvido pelo identificador — cartão que dança entre duas atualizações é cartão que ninguém encontra`,`A RESPOSTA DO "E AGORA?" CONTINUA NA TELA: a tira carrega "→ PRONTOS" ou "aguarda 2" na ponta, e a frase inteira aparece ao encostar. Esconder isso numa dica seria desfazer o que a v0.21.5 arrumou`,`A BANCADA CONTA O QUE DÁ TRABALHO, não o que já saiu — e avisa "bancada limpa" quando tudo o que estava ali foi embora`,`CADA COLUNA DA TELA DE ENTREGAS AGORA DIZ O QUE ELA É (sem motoboy, coleta, balcão, viagens, motoboy). Sem isso, "todas as colunas de motoboy" e "todas as colunas" eram o mesmo seletor — e a coluna de viagens passou a ser contada como um entregador`],correcoes:[`A régua do layout de Entregas guardava a briga por ALTURA entre a faixa de viagens e o agrupamento — uma briga que a mudança para colunas acabou por construção. Ela foi refeita para o mesmo cuidado no outro eixo: fileiras da mesma altura, largura de coluna, e rolagem por dentro, com a rua cheia e em tela de notebook`,`A régua do arrastar soltava no vazio quando a coluna de destino nascia fora da tela — com a fileira crescendo para o lado, ela passa a ROLAR até o destino antes de arrastar, que é o que a pessoa faz. A falha parecia do programa e era da régua`]},{version:`0.26.0`,date:`2026-08-27`,titulo:`A Central ganhou os QUATRO NÍVEIS: holding → empresa → filial → módulos`,melhorias:[`QUATRO NÍVEIS, e cada um responde a uma pergunta que o negócio faz todo dia: a HOLDING é o cliente da xcodef (quem assina e quem paga), a EMPRESA é o CNPJ (quem emite nota), a FILIAL é o endereço (de onde a comida sai) e os MÓDULOS são o que ele contratou. Antes eram dois níveis, e dois obrigam a escolher qual dessas perguntas fica sem resposta`,`O ARQUIVO DE BANCO PASSOU A SER POR CLIENTE, e não por CNPJ: a fronteira de isolamento foi para onde ela pertence, que é onde um cliente termina e o outro começa. Dentro do grupo, a mesma pessoa transita entre as lojas — separar por arquivo ali impediria a consulta mais banal`,`ESCOPO, E NÃO LISTA DE PERMISSÕES: cada conta tem um NÍVEL e um ALVO — o grupo inteiro (o dono), um CNPJ (o gerente) ou um endereço (a caixa daquela loja). Lista de permissão sempre acaba com alguém esquecendo de tirar uma; um par nível+alvo, não`,`A PODA É DO SERVIDOR, NÃO DA TELA: quando a pessoa entra, o servidor devolve a árvore JÁ podada pelo escopo dela e os módulos JÁ resolvidos por filial. Quem esconde botão na tela e deixa a rota aberta no servidor não escondeu nada`,`MÓDULOS COM HIERARQUIA DE MÃO ÚNICA: a holding CONTRATA; empresa e filial só ESTREITAM. Filial nenhuma liga sozinha um módulo que o grupo não comprou — senão o contrato viraria sugestão. Já estreitar pode: a matriz tem cozinha e a filial do shopping não, e isso é operação, não contrato`,`LIGAR UM MÓDULO LIGA O QUE ELE PRECISA, e desligar derruba quem depende dele — em cascata, nas duas direções. Vender o aplicativo do motoboy sem entregas é vender uma tela que não recebe viagem, e o cliente só descobriria depois de pagar`,`TREZE MÓDULOS mapeados a partir do que o sistema faz de verdade, cada um com o texto que vai na proposta: quadro, produção, cozinha, buffet e compras, entregas, aplicativo do motoboy, cardápio, WhatsApp, atendente automático, ficha do cliente, fechamento, mapa ao vivo e conformidade`,`O QUADRO DE PEDIDOS NÃO É OPCIONAL: vender o sistema sem ele não é vender menos, é vender nada — então ele fica sempre de pé, aconteça o que acontecer com o resto do contrato`,`PREÇO NÃO ENTRA NO PROGRAMA, de propósito: quanto custa cada módulo é conversa comercial e muda por cliente. Aqui fica o que está LIGADO; a fatura lê isso`,`FEITO ANTES DE A MÁQUINA SUBIR, que era o momento certo: mexer na estrutura com cliente em produção é migração de dados, e migração de dados é cara`,`PROVADO DE VERDADE: 484 testes (31 novos), e a Central subida de fato — criou o primeiro cliente com empresa, filial e os 13 módulos, recusou a senha errada, aceitou a certa e devolveu a árvore inteira com os módulos resolvidos. E o parâmetro do endereço continua sendo ignorado: quem manda é a sessão`],correcoes:[`A CAIXA DE UMA LOJA ENXERGAVA O OUTRO CNPJ DO GRUPO — vazio, mas com o nome à mostra. A árvore era montada com todas as empresas e só depois as filiais eram filtradas. Quem trabalha num CNPJ não precisa saber quantos outros o grupo tem. São duas perguntas diferentes e agora são duas funções diferentes: a estrutura inteira, para administrar (onde uma empresa recém-criada PRECISA aparecer, senão não dá para cadastrar a primeira filial dela), e o que aquela pessoa alcança`]},{version:`0.25.1`,date:`2026-08-27`,titulo:`A chave-mestra saiu do código-fonte — ela era o “valor padrão” de uma verificação`,melhorias:[],correcoes:[`A CHAVE-MESTRA DA DEMONSTRAÇÃO ESTAVA ESCRITA NO CÓDIGO, como valor padrão de uma verificação automática. O cadastro sempre guardou só a impressão digital (nunca a chave) — mas a chave inteira estava ali ao lado, num script. Quem tivesse uma cópia do código-fonte tinha a chave junto, o que anulava metade da tranca criada justamente porque o link caiu em mãos erradas. Agora a chave vem do ambiente de quem roda a verificação e some quando o terminal fecha`,`E UM TESTE NOVO IMPEDE QUE VOLTE: ele varre scripts, código e documentação atrás de qualquer coisa com cara de chave emitida de verdade, e reprova a entrega se achar. As chaves inventadas dos próprios testes continuam passando — o teste sabe distinguir material de teste de segredo de verdade`]},{version:`0.25.0`,date:`2026-08-27`,titulo:`O APLICATIVO DO MOTOBOY existe — Android e iPhone, com a mesma tela e a trava de print do Android`,melhorias:[`O APLICATIVO INSTALADO DO MOTOBOY está montado: aplicativo de verdade, Android e iPhone, com o programa EMBUTIDO (não é casca abrindo site — abre com sinal ruim, e é o que as duas lojas exigem para aceitar)`,`É A MESMA TELA, e isso não é economia, é decisão: o aplicativo importa o MESMO componente que o painel usa. Duas telas para a mesma pessoa é a receita certa de uma delas envelhecer — e a prova veio de graça: a política de visibilidade da v0.24.0 (o dono da loja decidindo o que o motoboy vê) passou a valer no aplicativo SEM UMA LINHA A MAIS`,`TRAVA DE PRINT NO ANDROID, de verdade: FLAG_SECURE, do próprio sistema. O aparelho RECUSA a captura de tela e a janela sai preta na gravação e no espelhamento. Não é aviso educado, é o sistema operacional negando`,`NO IPHONE NÃO DÁ PARA BLOQUEAR PRINT — e isso está escrito no código, na tela e na documentação. A Apple não oferece equivalente. O que dá é o sistema AVISAR depois que a pessoa tirou o print: então o aplicativo REGISTRA quem e quando, e mostra AO PRÓPRIO MOTOBOY. Ninguém é vigiado às escondidas, e ninguém recebe promessa que o aparelho não cumpre`,`POSIÇÃO COM A TELA APAGADA e AVISO NA TELA DE BLOQUEIO: as duas coisas que navegador nenhum faz. É o que mantém a motinha andando no mapa do gestor enquanto ele dirige, e o que faz a viagem despachada tocar com o celular no bolso`,`A BARRA DO APARELHO, no rodapé, DIZ A VERDADE: qual sistema, se o print está bloqueado ou apenas registrado, se a posição está indo. A tela é a mesma no navegador e no aplicativo — sem essa barra, alguém acharia que o print está bloqueado quando não está`,`UMA PORTA SÓ PARA O APARELHO, e ela degrada sozinha: aberto no navegador, cada recurso devolve "isso só existe no aplicativo instalado" e a tela continua funcionando igual. Um programa só, e não um para cada lugar`,`O QUE É NOSSO NÃO MORA NA PASTA GERADA: as pastas do Android e do iPhone são geradas pelo Capacitor, e quem edita à mão perde a trava de print na primeira regeneração. O código nativo mora em nativo/, versionado e legível, e um script o costura de volta quantas vezes for preciso`,`O PROJETO ANDROID JÁ ESTÁ NO REPOSITÓRIO, gerado e costurado: com o Android Studio instalado é abrir e apertar ▶ para o aplicativo entrar no celular pelo cabo — inclusive com a trava de print funcionando`,`PERMISSÕES E TEXTOS PRONTOS nos dois sistemas: posição em segundo plano, serviço em primeiro plano e avisos no Android; no iPhone, os textos que explicam ao usuário por que cada permissão é pedida — texto genérico ali é recusa na revisão da Apple, e a recusa vem semanas depois`,`A TELA FOI FEITA PARA A MÃO DE QUEM ESTÁ NA RUA: uma coluna só, botão de etapa de 64 pixels de altura (dedo de luva), campo do código de 52, letra que o iPhone não amplia sozinho, e nada de rolagem para o lado`,`UM ARQUIVO SÓ PARA ABRIR NO CELULAR HOJE, sem instalar nada: npm run app:artifact gera a demonstração do aplicativo num endereço próprio — a tela exata do entregador, na mão, agora`,`RECEITA COMPLETA em docs/APP-MOTOBOY.md: do zero ao aplicativo no celular, como gerar o arquivo de publicação, o que a chave de assinatura significa (perdeu a chave, perdeu o aplicativo) e o que cada loja cobra, pede e demora`],correcoes:[]},{version:`0.24.0`,date:`2026-08-27`,titulo:`O PATRÃO decide o que o motoboy vê no aplicativo — e o mínimo da entrega não tem chave para desligar`,melhorias:[`CADA DONO DE LOJA DECIDE O QUE O MOTOBOY DELE VÊ. Aba nova nos Parâmetros ("📱 App do motoboy") com 11 itens que ligam e desligam um a um: nome do cliente, telefone, o que ele pediu, valor do pedido, botões de apontar problema, trajeto inteiro no mapa, contadores do dia, dinheiro recolhido, histórico de viagens, comparação com os colegas e escala do dia`,`O MÍNIMO DA ENTREGA CORRENTE NÃO TEM CHAVE, e isso está escrito na tela, em verde, antes de qualquer opção: número do pedido, número e paradas da viagem, ordem da rota, endereço completo de cada parada, botões de etapa, horário previsto, como se paga na porta (forma, troco e maquininha) e o código de confirmação do cliente. Esconder qualquer um desses não seria decisão de gestão, seria impedir o trabalho — então o programa nem oferece a opção`,`CADA CNPJ MANDA NO SEU, de verdade: um motoboy que roda para duas lojas no mesmo dia vê a política de cada uma no cartão da viagem daquela loja. E os números do dia só somam as viagens das lojas que liberaram aquele número — o consolidado de uma casa não vaza para a outra pelo bolso de quem entrega`,`TRÊS ESTADOS EM CADA ITEM, e não dois: "segue a casa", "mostra" e "esconde". Sem o primeiro, a loja que quisesse voltar atrás teria de adivinhar qual era o padrão; agora tem um botão que apaga as escolhas dela e volta a seguir a casa inteira`,`O RISCO DE CADA ITEM ESCRITO AO LADO DA CHAVE, em vermelho e sem letra miúda: contador do dia, dinheiro recolhido, histórico e comparação avisam que são registro de jornada na tela de quem trabalha; o telefone avisa que é dado pessoal do seu cliente saindo da sua casa`,`MOSTRAR E COLETAR SÃO COISAS DIFERENTES — e a tela diz isso com todas as letras. Ligado e operando para a sua loja, o aplicativo continua coletando a operação inteira para você (posição, horário de cada etapa, entregas confirmadas, ocorrências, dinheiro recolhido), independentemente do que esteja desligado na tela dele. Desligar aqui esconde do motoboy; não apaga registro nenhum do gestor`,`PADRÃO CONTINUA FECHADO no que é histórico e consolidado — a tela de v0.20.0 é exatamente o que a loja recebe sem mexer em nada. Quem quiser abrir, abre sabendo o que está abrindo; loja nova nasce seguindo a casa`,`AS TRÊS LOJAS DA DEMONSTRAÇÃO JÁ VÊM DIFERENTES, para a regra aparecer funcionando: Sabor da Vila abriu a lista de itens e o contador do dia, Grill do Parque é o patrão fechado que nem o nome do cliente entrega, e a Cantina Bella Massa segue o padrão da casa`,`O TELEFONE DO CLIENTE APARECE ESCRITO, nunca como link que disca — e com o código localizador do 0800 ao lado, que é o que a plataforma exige para completar a ligação. Link para discador seria caminho de tirar a conversa de dentro do sistema, e a trava de conformidade barra isso em todas as telas`,`QUEM CONFIGURA É O DONO, NÃO O CAIXA: a aba fica no mesmo bloco do cadastro de lojas (tabela de perfis), porque é decisão de quem contrata o entregador — não de quem toca o turno`],correcoes:[]},{version:`0.23.0`,date:`2026-08-27`,titulo:`A CENTRAL nasceu: um servidor, um banco por empresa e a senha conferida no servidor — não mais na página`,melhorias:[`SERVIDOR DA CENTRAL no ar (fase 1): cadastro de empresas, contas de entrada e sessões. É o que faz você e o cliente verem a MESMA informação, em vez de cada computador com a sua massa de dados`,`UM BANCO POR EMPRESA, e não um banco gigante com todo mundo dentro. A conexão JÁ É a da empresa, então consulta que "esqueceu o filtro" não existe — vazamento entre clientes vira impossível por construção. E é o mesmo formato de arquivo que a loja usa hoje: dá para baixar o banco de uma empresa e voltar a operar local, sem ficar refém`,`SENHA DE VERDADE, conferida no servidor: guardada com scrypt e sal próprio (nunca em texto puro, nunca com resumo rápido) e comparada em tempo constante. A tranca de licença do navegador sempre foi honesta sobre o que era — esta é a fechadura`,`A PORTA NÃO CONTA QUEM EXISTE: usuário inventado e senha errada recebem a MESMA resposta, e o servidor gasta o mesmo tempo nos dois casos — sem isso, o relógio entregaria a lista de usuários de graça`,`A EMPRESA SAI DA SESSÃO, NUNCA DO ENDEREÇO: mexer na barra do navegador não troca de empresa, e o identificador é conferido contra travessia de pasta antes de virar nome de arquivo`,`SESSÃO POR COOKIE que o JavaScript da página não lê, que outro site não consegue usar e que sai cifrado atrás de HTTPS. Conta desligada derruba a sessão aberta na hora`,`EMPACOTADA EM DOCKER e pronta para a máquina gratuita do Google Cloud: arquivo de imagem em duas etapas, volume para os dados, container rodando sem privilégio de administrador e verificação de saúde automática`,`RECEITA COMPLETA em docs/CENTRAL.md — do "não tenho nada" ao "está no ar": criar a máquina, instalar, subir, pôr o cadeado, fazer backup, atualizar. Com a lista do que ainda depende de decisão sua`,`PROVADO POR TESTE, não por promessa: 23 testes novos, e o do servidor sobe a Central de verdade numa porta livre e fala pela rede de verdade — inclusive conferindo que a senha de uma empresa NÃO abre a outra`],correcoes:[`A versão do package.json estava parada em 0.21.3 havia quatro lançamentos: a troca procurava o número anterior e falhava EM SILÊNCIO quando ele não batia. A versão que você via no rodapé sempre foi a certa (sai do changelog), mas agora existe um teste que trava as duas juntas — errar aqui passou a custar dez segundos em vez de uma entrega com a versão errada`]},{version:`0.22.1`,date:`2026-08-27`,titulo:`Cada monitor enxergando só a sua empresa — quando a casa opera com cozinha e bancada separadas`,melhorias:[`O PARÂMETRO "POR EMPRESA" AGORA VALE NAS TELAS: ligado, a bancada e a cozinha perguntam de qual empresa aquela estação é e passam a mostrar só o que é dela. A cozinha do Sabor da Vila parou de olhar prato da Bella Massa, que não é problema dela`,`ESTRUTURA ÚNICA (o padrão) CONTINUA SEM FILTRO NENHUM — uma cozinha atende todas as empresas, e é exatamente isso que a tela mostra. O seletor de empresa nem aparece`,`ESTOQUE, COZINHA E BANCADA SÃO PARÂMETROS SEPARADOS: dá para ter uma cozinha só e estoques por empresa, ou o contrário. A falta de insumo relatada segue o parâmetro do ESTOQUE, e a reposição de buffet segue o da cozinha`,`A EMPRESA DA ESTAÇÃO FICA GUARDADA naquele monitor: recarregou, ele continua sendo a cozinha da mesma loja — ninguém escolhe de novo no meio do turno`,`NADA DE TRABALHO SUMINDO NA TROCA: pedido feito antes de a casa separar por empresa continua à vista para todos, em vez de desaparecer quando o parâmetro muda`],correcoes:[`A bateria passou a rodar os testes do buffet e das compras que estavam fora da lista antiga — 418 para 426 testes`]},{version:`0.22.0`,date:`2026-08-27`,titulo:`Plataforma nova entra por CADASTRO — Rappi e o que vier —, o ADIANTAR diz com quem agrupar e o "longe" passou a ser medido`,melhorias:[`CADASTRO DE PLATAFORMAS (Configurações › 🛒 Plataformas): faltava o lugar de cadastrar e descadastrar. Agora as quatro de fábrica aparecem numa lista com liga-desliga, e uma NOVA entra pelo botão "+ Cadastrar" — nome, cor automática e como ela conversa`,`A TELA É HONESTA SOBRE O PRAZO: plataforma que fala Open Delivery (o padrão aberto que a Keeta e a 99Food já usam) entra sem código novo, só com a credencial — e a tela diz isso; plataforma de interface própria avisa que depende de um adaptador escrito para ela. Nada de prometer o que não é`,`PLATAFORMA DE FÁBRICA NÃO SE DESCADASTRA — o programa depende dela. O que se faz é DESLIGAR: some da operação e continua no cadastro, com a chave ali para religar. A que a casa cadastrou sai a qualquer momento`,`O CADASTRO FICA GUARDADO neste computador e recusa nome repetido com explicação, não em silêncio`,`O SELO "ADIANTAR" AGORA DIZ COM QUEM: além do bairro, mostra os pedidos que já esperam rota para o mesmo lado — "🚀 ADIANTAR — sai na rota p/ Jardim América ⧉ com #1206, #1211". Sem os números, quem lê tinha de adivinhar se valia correr`,`O "LONGE" DEIXOU DE SER LISTA DIGITADA e passou a ser MEDIDO: a distância do bairro até a loja, com o mesmo cálculo do perímetro de entrega. A casa decide UM número — a partir de quantos quilômetros vale segurar a entrega para juntar mais uma — e zero desliga a regra`,`E O LONGE VIROU POR LOJA: o Jardim América fica a 5,6 km da Sabor da Vila e a 1,9 km do Grill do Parque — para uma é longe, para a outra é ali do lado. A lista digitada não sabia disso`],correcoes:[`A bateria de testes era uma LISTA ESCRITA À MÃO no package.json, e arquivo de teste novo só rodava se alguém lembrasse de acrescentar. O do buffet tinha ficado de fora e nunca rodava. Agora a bateria varre a pasta inteira — de 403 para 418 testes, sem escrever uma linha de teste nova`]},{version:`0.21.5`,date:`2026-08-26`,titulo:`"Montei o prato — e agora?" respondido no próprio cartão, e a documentação de infra corrigida onde estava errada`,melhorias:[`DEPOIS DO "MONTEI O PRATO", O CARTÃO DIZ O QUE ACONTECEU: ou "pedido #1204 completo → foi para PRONTOS (pronto para delivery)", ou "esperando 2 prato(s) do #1204 — com Marcos Pereira, Jefferson Souza. O pedido só vai para PRONTOS quando o último for montado". A regra da casa é essa: o cliente recebe o PEDIDO, não o prato — montar um prato sozinho não manda nada para lugar nenhum`,`E TEM PRÓXIMA AÇÃO SIM: com o seu prato montado e nada mais na mão da cozinha, o botão "🛵 Concluir #1204 — pronto p/ delivery" aparece no próprio cartão. Antes ele sumia junto com o prato montado e a bancada ficava sem saída`,`PRATO JÁ MONTADO NÃO OFERECE MAIS "devolver para a fila" — não há o que devolver, ele está feito`],correcoes:[`A documentação de infra dizia que a operação "continua funcionando com a internet caída". ERRADO, e o Carlos corrigiu: com plataforma ligada é ONLINE o tempo todo — no iFood, ficar mudo derruba a loja no marketplace. Só numa casa configurada apenas com WhatsApp/balcão (parâmetro do cliente) é que a operação inteira roda na rede local. docs/INFRA.md §1.1 agora explica os três casos numa tabela`,`docs/INFRA.md ganhou as duas seções que faltavam: N estações de trabalho na rede local (uma por posto, sem limite no software, cada uma pregada no seu papel) e o aplicativo instalado do motoboy para ANDROID e IPHONE — com o caminho técnico, o custo das contas de loja (Google US$ 25 uma vez, Apple US$ 99 por ano) e a verdade sobre captura de tela no iPhone, onde não existe trava equivalente à do Android`]},{version:`0.21.4`,date:`2026-08-26`,titulo:`Cada bancada no seu lugar até o fim do expediente — e a lista do buffet passou a se mexer na própria bancada`,melhorias:[`AS BANCADAS TÊM LUGAR FIXO: a ordem das fileiras é a do cadastro e NÃO muda mais com nada — nem quando alguém toca no próprio nome, nem quando pega ou larga um prato. Quem aparecer trabalhando sem estar no cadastro ganha bancada nova, sempre À DIREITA das que já existem`,`OCULTAR A BANCADA INTEIRA: quem não está no turno some da tela com um toque no ✕ do cabeçalho. Volta tocando no nome da pessoa lá em cima — e volta mostrando o que já foi feito em cinza, pelos minutos do parâmetro, até ficar só com o gestor`,`RECOLHER A BANCADA numa barrinha vertical (⇤), como as fileiras do quadro de pedidos: a bancada de quem não está produzindo continua no mesmo lugar, ocupando quase nada, e abre num toque`,`TRAVA DE HONESTIDADE: bancada COM prato em aberto não recolhe nem some — trabalho aberto não se esconde de ninguém, nem por engano`,`O "CONCLUIR — PRONTO P/ DELIVERY" foi para DENTRO do cartão, do mesmo tamanho do "Montei o prato": é a mesma decisão vista de outro ângulo — em vez de fechar prato por prato, fecha o pedido inteiro e manda para o delivery`,`A LISTA DO BUFFET SE MEXE NA PRÓPRIA BANCADA: "✏️ editar lista" liga o modo de edição e aí dá para INCLUIR produto e APAGAR produto ali mesmo, sem ir às Configurações — quem sabe o que está na cuba é quem está diante dela`,`CARREGAR DO CARDÁPIO DE HOJE: um toque traz para o buffet os componentes das fichas dos pratos que valem no dia. São exatamente as coisas que vão ser pedidas naquele dia — não faz sentido digitar de novo. Nada é apagado: só entra o que ainda não estava lá`,`DOCUMENTO NOVO — docs/INFRA.md: o que está definido de infraestrutura, num lugar só e em português de gente — onde o sistema roda hoje (PC da loja, custo zero), como as plataformas entram (polling, sem abrir porta no roteador), onde ficam as credenciais e os dados, o que está desenhado esperando o "vai" (a Central no Google Cloud) e o que ainda depende de decisão sua`],correcoes:[`A lista do buffet misturava o parâmetro da casa com os componentes do cardápio na hora de desenhar, e por isso item apagado voltava sozinho; agora a lista é uma só, e o cardápio entra por botão`]},{version:`0.21.2`,date:`2026-08-26`,titulo:`Tela de toque na produção: o botão é o próprio item, cada profissional com a sua fileira e o pedido saindo pronto para delivery`,melhorias:[`OS NOMES VOLTARAM AO QUE A CASA USA: 🍽️ Produção e 👨‍🍳 Cozinha. A ordem continua a mesma — a produção monta os pratos e PEDE para a cozinha, e a cozinha só age quando a produção pede`,`CARTÕES SEMPRE VERTICAIS: as fileiras ganharam largura fixa de coluna. Antes, uma fileira sozinha esticava até o fim da tela e o cartão virava uma tira horizontal atravessando o monitor — era o defeito da foto`,`UMA FILEIRA PARA CADA PROFISSIONAL, SEMPRE — desde o começo do turno, mesmo vazia. A pessoa chega, toca no nome e já sabe onde o trabalho dela vai aparecer; a fileira dela vem primeiro, na cor dela`,`O BUFFET É A PRIMEIRA FILEIRA da produção (saiu da barra do topo): 🍲 Buffet — repor, com os insumos em botões de dedo e a urgência 🔴/🟡 ali em cima`,`PEDIR À COZINHA É UM TOQUE NO PRÓPRIO ITEM: acabaram a caixinha de marcar e o botão genérico "OK, pedir". A pessoa toca em "🍟 Fritas" e a cozinha recebe as fritas daquele prato. Prato ainda sem dono? O mesmo toque assume o prato para quem pediu — quem pede é quem monta`,`PREPARO INICIADO no cartão do gestor: assim que alguém da produção assume um prato, o quadro do gestor mostra quem pegou e quanto do pedido já saiu (0/3, 2/3…). Ninguém digita nada — a informação nasce da própria bancada, então nunca fica desencontrada`,`CONCLUIR E LEVAR AO DELIVERY: quando nada mais depende da cozinha, a bancada ganha o botão "🛵 Concluir #1204 — pronto para delivery" e num toque o pedido inteiro cai em PRONTOS. O fecho é do PEDIDO, não do prato — é o pedido inteiro que o cliente recebe`,`A FALTA DE INSUMO virou a 4ª FILEIRA da cozinha, em cartões: a barra de digitar saiu do topo da tela e virou coluna, como todo o resto`,`AS FILEIRAS DE RECADO SE FECHAM SOZINHAS: 🧺 Solicitações e 🛒 Compras só ficam abertas enquanto há algo EM ABERTO. Atendido o último, comprimem na hora — cartão cinza de coisa resolvida não ocupa coluna do quadro. O gestor ou o caixa toca na barrinha para conferir, e ela fecha de novo quando o próximo item sair`],correcoes:[`O botão de concluir continuava aparecendo para um pedido que já tinha saído da bancada inteiro montado`]},{version:`0.21.0`,date:`2026-08-26`,titulo:`A ordem da casa: o PREPARO pede, a COZINHA (produção) faz — buffet reposto aos poucos e falta de insumo virando compra`,melhorias:[`A ORDEM FICOU DEFINIDA E ESCRITA: a ÁREA DE PREPARO monta os pratos e PEDE para a COZINHA — e cozinha e produção são a MESMA coisa, um posto só, que nunca age por conta própria. Os postos mudaram de nome nas telas (🥗 Preparo · 👨‍🍳 Cozinha (produção)); por baixo nada quebrou, o perfil já guardado em cada computador continua valendo`,`AS DUAS TELAS VIRARAM FILEIRAS VERTICAIS de cartões, lado a lado como o quadro: no preparo, uma fileira "sem dono" e uma para CADA pessoa (a sua vem primeiro); na cozinha, uma fileira por urgência. Cada bancada tem lugar fixo — ninguém procura o próprio prato no meio do serviço`,`BARRA DO BUFFET, fora dos cartões: um toque em "+ Feijão", "+ Arroz", "+ Fritas" e a cozinha recebe. São solicitações avulsas, sem pedido de cliente atrás — é a cuba baixando. O botão trava depois de pedido, para ninguém pedir duas vezes`,`SEMÁFORO DA URGÊNCIA, escolhido por quem está olhando a cuba: 🔴 urgente (acabou ou está acabando) e 🟡 em breve (dá para esperar a próxima leva). Na cozinha, componente de prato entra em 🟡 e SOBE sozinho para 🔴 quando passa do tempo combinado esperando — é a bancada parada por causa dele`,`LIBERADO FICA CINZA e depois desce para o LOG DO DIA: passados os minutos do parâmetro (2, no combinado), o cartão sai da fileira e o histórico fica guardado no log da cozinha. O mesmo vale para o prato montado na bancada — some do preparo e continua à vista, em cinza, só para o GESTOR`,`FICHAS DE MONTAGEM POR INSUMO: os pratos da casa nasceram com a ficha certa (a parmegiana é bife à parmegiana + fritas + arroz; a marmita G é arroz + feijão + picanha + farofa + fritas), então a sugestão da bancada virou o insumo de verdade, e não o nome do prato repetido`,`A COZINHA RELATA FALTA DE INSUMO ao caixa/gestor: escreve o que acabou e aperta 🔴 acabou ou 🟡 acabando. Vira a fileira 🛒 Compras no quadro de quem tem o dinheiro e o carro, com o botão "✔️ Chegou" — que deixa o cartão ⬜ cinza e some depois do parâmetro`,`ESTRUTURA DA CASA PARAMETRIZADA (Configurações › Geral › Buffet e área de preparo): estoque, cozinha/produção e área de preparo, cada um ÚNICO para todas as empresas ou UM POR EMPRESA — cada casa monta a sua, e as telas obedecem`,`ITENS DO BUFFET são lista da casa, não código: feijão, arroz, farofa, fritas, bife contra, ovo frito, maionese, feijoada, filé de frango grelhado — e a bancada ainda soma sozinha os componentes das fichas do cardápio do dia, para o que o cardápio pede aparecer no botão`,`TRÊS PESSOAS NOVAS NA ÁREA DE PREPARO (Marcela Dias, Luciana Prado e Tati Ramos), cada uma com a sua cor de bancada — a fileira de cada uma nasce assim que ela assume o primeiro prato`],correcoes:[`A demonstração ficava com a TELA BRANCA em alguns navegadores: a página não declarava a codificação e o navegador adivinhava errado, transformando os emoji em lixo e o programa em texto inválido. Agora vem declarado (UTF-8), e não há mais o que adivinhar`]},{version:`0.20.0`,date:`2026-08-26`,titulo:`Cada monitor no seu lugar: celular do motoboy sem histórico, solicitações do preparo em fileira e tudo que fecha vira cinza`,melhorias:[`O CELULAR DO MOTOBOY mostra SÓ a viagem atual: saíram os contadores do dia (viagens, entregas, quilômetros, valor recolhido), o registro de passos e o relógio de "minutos na rua". O que ele precisa para cumprir a viagem — paradas, endereço, forma de pagamento, troco, maquininha e o código da porta — e nada que sirva de histórico de jornada na mão errada (proteção contra ação trabalhista). No aplicativo de verdade a tela ainda bloqueará captura de imagem; nesta demonstração de navegador isso não existe, e está dito com todas as letras em docs/DECISOES.md`,`DESEMPENHO DE HOJE por entregador — viagens, entregas, quilômetros, minutos por entrega, valor recolhido, ocorrências e um gráfico de barras por pessoa — leitura EXCLUSIVA do perfil gestor, na tela App do entregador`,`O REGISTRO DO DIA das viagens (e o copiar para planilha) também virou leitura exclusiva do gestor — os outros monitores veem só o que está acontecendo agora`,`TROCAR O MONITOR É COISA DE GESTOR: o seletor de perfis e o botão das 5 telas só existem no monitor do gestor (ou para quem entrou com atribuição de gestor). Os demais monitores ficam pregados no papel deles — o da cozinha na cozinha, o do preparo na sala de preparo`,`FILEIRA NOVA — 🧺 SOLICITAÇÕES DO PREPARO: o que a sala de preparo pediu à cozinha/produção agora é uma fileira do quadro, com botão "✔️ Feito — liberado para o preparo"; atendida fica CINZA por uns minutos e sai sozinha. Entra no quadro do gestor e, EM DESTAQUE (tarja roxa), no monitor da cozinha`,`O MONITOR DA COZINHA mostra só o que é da cozinha: Novos, Em preparo e as Solicitações em destaque — prontos, fila de entrega e cancelados saíram de lá (parede de cozinha mostra o que a cozinha produz, não o que a rua faz)`,`SUGESTÃO AUTOMÁTICA na bancada do preparo: assim que o pedido cai, a tela já previu o que vai faltar, o cartão PISCA com a sugestão ("pedir à cozinha — frango empanado, batata frita") e um único OK manda a solicitação inteira — no prato sem dono, o OK também assume o prato para quem clicou`,`TUDO QUE FECHOU VIRA CINZA, em qualquer fileira e monitor: entregue, concluído e o cancelado marcado como "Ciente" ficam monocromáticos, descem para o fim da fileira e saem sozinhos depois dos minutos do parâmetro da expedição — nada de colorido em pedido que já acabou`,`FILEIRA ZERADA COMPRIME SOZINHA, em todos os perfis: coluna sem nenhum cartão vira a barrinha vertical automaticamente e reabre no momento em que chegar pedido`,`VIAGENS EM ANDAMENTO virou fileira com o mesmo conceito: zerada, comprime numa tira encostada à DIREITA e devolve toda a altura ao quadro de agrupamento`,`O CÓDIGO DA ENTREGA agora é DEVOLVIDO À PLATAFORMA na ordem combinada: registra primeiro no nosso sistema (conferido na porta) e logo em seguida na plataforma de origem — o detalhe do pedido mostra os dois carimbos ("conferido na porta às 21:38 · registrado no iFood às 21:38")`],correcoes:[`Quem entrou com usuário sem atribuição de gestor não perdia mais o botão Sair ao ficar sem o seletor de monitores`,`A escala da vez saiu da faixa que roubava altura do quadro de agrupamento em monitor de notebook: virou selo no cabeçalho com a fila flutuando por cima`]},{version:`0.19.0`,date:`2026-08-26`,titulo:`A PRODUÇÃO entra em cena: 5 telas, cozinha por demanda, cor de cada pessoa, código na porta e escala da vez`,melhorias:[`TELA NOVA — 🍽️ PRODUÇÃO: a bancada onde os pratos são MONTADOS ganhou tela própria, separada da cozinha (onde a comida é feita). São 5 monitores agora: Gestor, Caixa, Produção, Cozinha e Entregadores`,`FICHA DE MONTAGEM no cardápio: cada prato pode listar as partes que o compõem (frango empanado + molho + queijo + batata frita). Prato sem ficha continua valendo como peça única — a casa cadastra no ritmo dela e nada quebra no primeiro dia`,`A COZINHA VIROU SUBORDINADA À PRODUÇÃO: a funcionária assume o prato, marca o que já tem na bancada e pede à cozinha SÓ o que falta. Faltou só a batata? A cozinha recebe "2 batatas fritas para o #1207", não o prato inteiro. Faltou tudo? Vai tudo`,`Tela da cozinha reorganizada por COMPONENTE, do jeito que a cozinha trabalha: "🍟 Batata frita — 5" com o total grande, quem está esperando há mais tempo primeiro, e o relógio de espera de cada pedido`,`UM PRATO, UMA PESSOA: ao assumir, o prato fica com a cor da funcionária (Vitória vermelha, Enzo amarelo, Marcela azul…) e ninguém mais mexe nele. A cor é cadastrada em Configurações, e quem não escolheu ganha uma da paleta pelo nome`,`CÓDIGO DE CONFIRMAÇÃO DA ENTREGA: o número que o cliente diz na porta agora existe no sistema. Nas plataformas ele vem com o pedido e a confirmação volta para elas; nos pedidos do nosso WhatsApp a casa GERA o código e manda ao cliente na conversa`,`O entregador confere o código no aplicativo dele antes de dar a entrega por feita — e existe a saída honesta para quando o cliente não tem o código: alguém autoriza e fica registrado, com nome e motivo`,`O MOTOBOY PASSA A SABER COMO SE PAGA: cada parada mostra a forma (dinheiro com troco, maquininha, Pix, pago pelo aplicativo) e a viagem avisa em cima "🧾 LEVAR A MAQUININHA" e quanto levar de troco`,`Endereço completo na parada: complemento e ponto de referência deixaram de ser descartados no caminho — é o que evita a ligação "cadê você?" na porta do prédio`,`ESCALA DA VEZ: o "Cheguei, estou na loja" passou a gravar a HORA, e a tela de Entregas mostra a fila do dia (1º da vez, 2º…) com hora de chegada, quilômetros e entregas`,`Novo parâmetro "quem é o próximo da vez": ordem de chegada (padrão), menos quilômetros ou menos entregas — era o "ou outro critério definido pelo restaurante"`,`O CAIXA ganhou os poderes de operação do gestor: cardápio, entregas, mapa, aplicativo do entregador, fechamento do DIA e as configurações de operação. O gerencial continua fora: gráficos, semana, mês e os números do negócio`,`Contagem das colunas em "total/abertos": 35 pedidos no quadro de Prontos, 14 ainda em andamento — o que está colorido é o que pede trabalho`],correcoes:[`A MESMA fila mostrava números diferentes em cada monitor (10 na tela do gestor, 8 na do entregador) porque o monitor dos entregadores escondia o que não era entrega própria. Agora o quadro é um só, para todo mundo — quem pode AGIR em cada pedido continua sendo decidido por perfil`,`A planilha do cardápio ganhou a coluna da ficha de montagem sem quebrar quem já usa: a planilha antiga, de 9 colunas, continua entrando com os preços na coluna certa`]},{version:`0.18.1`,date:`2026-08-25`,titulo:`O pedido que você foi buscar fica amarelão até você decidir, e Cancelados vira fileira como as outras`,melhorias:[`O cartão que a busca (ou o aviso "precisam de atenção") encontra agora fica AMARELÃO piscando, no meio do quadro — acabou o destaque discreto que passava despercebido`,`E ele NÃO apaga sozinho com o tempo: o amarelão só sai quando você mexe no cartão (clica nele ou num botão dele), porque aí a decisão foi tomada`,`A coluna Cancelados passou a usar a MESMA barrinha em pé das outras fileiras: recolhe pelo ⇤ do cabeçalho e volta com um clique na barrinha`,`O parâmetro "cancelados começam ocultos" continua valendo — ele decide como a fileira abre da primeira vez, e daí em diante o computador lembra a sua escolha`],correcoes:[`O botão de olho "👁 Cancelados / 🙈 ocultar" era o único jeito diferente de esconder coluna no quadro — dois mecanismos para a mesma coisa, cada um num canto`]},{version:`0.18.0`,date:`2026-08-25`,titulo:`Demonstração fechada por licença, lojas fictícias, achar pedido pela barra e fileiras que recolhem`,melhorias:[`PORTA COM CHAVE: a demonstração agora abre só com uma CHAVE DE LICENÇA. Sem ela não aparece pedido, coluna, nome de loja — nada. Quem entra fica marcado no rodapé ("acesso liberado para…") e o botão 🔒 tranca de novo neste computador`,`Cada acesso tem a sua própria chave, com validade opcional: chave vencida deixa de abrir sozinha, e tirar a chave da lista revoga o acesso na publicação seguinte`,`A chave NUNCA fica escrita no programa — o arquivo guarda apenas a impressão digital dela (uma conta de mão única), então quem abre o código não descobre a senha`,`IDENTIDADE FICTÍCIA: as três lojas da demonstração viraram Sabor da Vila, Cantina Bella Massa e Grill do Parque — os nomes reais do cliente saíram do produto inteiro (telas, mapa, relatórios, documentos)`,`Quem já usava não fica para trás: a configuração e o histórico gravados no computador trocam de identidade sozinhos na abertura, sem perder venda nem ajuste`,`BARRA PARA ACHAR PEDIDO no alto da tela: procura por número do chamado, nome do cliente, telefone, bairro, rua ou loja — sem acento e sem diferença de maiúscula`,`Achou, clicou: o quadro ROLA até o cartão, onde quer que ele esteja, e o cartão fica PISCANDO alguns segundos para a decisão ser tomada na hora`,`O aviso "🔔 pedidos precisam de atenção" virou botão: clicar no número leva direto ao cartão, piscando do mesmo jeito`,`FILEIRAS MAIS ESTREITAS: as colunas dividem a largura por igual e cabem lado a lado, sem empurrar ninguém para a linha de baixo`,`RECOLHER FILEIRA INTEIRA: Prontos, Balcão, Fila de entrega, Acerto da rua e Concluídos viram uma barrinha em pé quando você quer espaço, e voltam com um clique — as vitais (Novos, Em preparo e Em entrega) ficam sempre abertas`,`A fileira recolhida abre SOZINHA quando a busca acha um pedido lá dentro — e o computador lembra quais ficaram recolhidas`],correcoes:[`O link da demonstração era porta aberta: quem tivesse o endereço via a operação inteira. Agora o endereço sozinho não basta — precisa da chave`]},{version:`0.17.12`,date:`2026-08-25`,titulo:`Os botões do cabeçalho não se dissolvem mais no vermelho do alarme`,melhorias:[`A barra de telas (Painel, Conversas, Clientes…) virou uma ILHA escura fixa, com contorno claro quando o alarme acende: o cabeçalho pisca vermelho no fundo e os botões continuam parados e legíveis`,`Todo controle do cabeçalho ganhou fundo sólido no lugar do branco transparente — abas, "↩ Movimentos", a etiqueta da versão e o monitor fixo`,`Régua de contraste virou verificação automática: cada botão é medido no estado de alarme e reprovado se ficar avermelhado, translúcido ou abaixo de 4,5 para 1 (o mínimo de acessibilidade)`],correcoes:[`Com o alarme aceso, os botões do cabeçalho eram branco transparente: viravam rosa por cima do vermelho, perdiam o contraste e piscavam junto com o fundo — o visual da barra morria justamente na hora do aperto`]},{version:`0.17.11`,date:`2026-08-25`,titulo:`Na tela de Entregas quem manda é o agrupamento: as viagens param na metade e cedem espaço`,melhorias:[`A tela de Entregas virou uma moldura com DUAS áreas: o quadro de agrupamento (em cima) é a principal e as viagens em andamento (embaixo) são a variável — as viagens nunca passam de METADE da tela e, quando aperta, cedem espaço três vezes mais rápido que o agrupamento`,`Cada área rola por dentro, com o cabeçalho das viagens fixo enquanto você rola — a tela em si não rola mais, então o quadro de agrupamento fica sempre à vista para arrastar`,`As viagens têm piso: mesmo cedendo espaço elas não somem da tela (dá para ver e rolar dentro delas)`,`Em tela baixa de notebook, o texto de ajuda do rodapé sai de cena e o cabeçalho encolhe — a área de trabalho vem antes do texto explicativo`],correcoes:[`Com muitas viagens na rua, o quadro de agrupamento era ESPREMIDO até virar uma tirinha de uns 60 pixels, com os cartões cortados — ficava impossível agrupar e arrastar enquanto a rua estava cheia`]},{version:`0.17.10`,date:`2026-08-25`,titulo:`Prontos vira leitura pura, balcão ganha coluna própria, viagens ganham travas e o mapa abre sempre`,melhorias:[`O aviso "🔔 pedidos precisam de atenção" agora DIZ QUAIS, entre parênteses (#…, #…) — acabou caçar no quadro quem está gritando`,`Quadro PRONTOS 100% leitura: nenhum botão nos cartões — a expedição é para ACOMPANHAR; o único gesto é clicar no cartão e ver os detalhes`,`No Prontos, pedido ENTREGUE vira cartão cinza com as letras sem cor e desce para o fim; os coloridos ficam em cima, mais recentes primeiro`,`Detalhes abertos do Prontos são só informativos: sem botão nenhum, e um clique em QUALQUER parte fecha`,`Coluna própria "🧾 Balcão" no painel: é ali que mora a AÇÃO da retirada (🛍️ Retirado ✓ e 💰 Receber) — para o gestor, o caixa e, se o parâmetro apontar, o gestor de entregas`,`Viagem que JÁ SAIU para a rua não se desfaz nem muda de dono: o ✕ some, o seletor trava com o selo 🔒 na rua, e "Desfazer sugestões" preserva quem está rodando`,`Viagem só vai para entregador NO EXPEDIENTE: arrastar, "mover para", os seletores e o "+ viagem" só aceitam quem está na escala (fora dela, aviso na hora) — o agrupamento continua livre para SUGERIR na coluna "Sem motoboy", agrupado e sem dono, até uma pessoa distribuir`,`Mapa ao vivo abre SEMPRE, na hora — mesmo sem ninguém na rua ele desenha as lojas e os perímetros (antes ficava em branco, "carregando…" para sempre)`,`O mapa decide em ~2 segundos entre mapa de rua e desenho da cidade; onde a hospedagem bloqueia, ele nem tenta baixar os quadradinhos — a tela fica leve`,`App do entregador: os celulares de TODOS aparecem lado a lado, em tempo real — o seletor "ver pelos olhos de" morreu (tela de celular é pequena, cabem várias)`,`Pedido AGENDADO entra sozinho na esteira NA HORA do preparo (mesmo aceite automático, mesma trava de capacidade) — e aceite antecipado não começa a cozinhar antes da hora`],correcoes:[`O Mapa ao vivo nunca abria quando não havia viagem na rua — a tela ficava em branco com "carregando o mapa de rua…" eterno (era exatamente o caso de quem abria para conhecer)`,`Pedido agendado com a hora vencida apodrecia em Novos sem ninguém vigiar o relógio dele — o rodapé chegava a mostrar "próx. agendado" no passado`,`Os botões do balcão e da coleta apareciam DUPLICADOS no quadro de Prontos — ação repetida em dois lugares é convite para clique errado`,`A viagem vazia criada pelo "+ viagem" sumia SOZINHA em um segundo se nada fosse arrastado para dentro na hora — a limpeza do relógio apagava o que o gestor tinha acabado de montar`]},{version:`0.17.7`,date:`2026-08-25`,titulo:`Prontos virou a expedição: etapa viva no cartão, coleta da plataforma na mão do gestor e balcão por parâmetro`,melhorias:[`NADA sai da loja sozinho: pedido pronto com entrega pela plataforma fica na fila do GESTOR DE ENTREGAS até ele entregar a sacola na mão do entregador e LIBERAR no sistema (botão 🤝 no cartão e na tela de Entregas)`,`Quando o entregador da plataforma chega na loja, o botão vira "🛵 Entregador CHEGOU — entregar e liberar" piscando, e a chegada fica na linha do tempo do pedido`,`Coluna "🤝 Coleta da plataforma" na tela de Entregas: a fila de coleta é do gestor de entregas, tudo no painel dele`,`O parâmetro do balcão agora manda de verdade: com "quem confirma a retirada" apontando para o Gestor de Entrega, os prontos do balcão caem também no quadro dele — coluna "🧾 Retirada no balcão" com o botão Retirado ✓ (com o caixa, segue como era)`,`O quadro PRONTOS virou a EXPEDIÇÃO: todo pedido pronto fica nele até o fim, com a etapa viva escrita no cartão — no balcão, na fila de entrega, na rua com o motoboy (com o nome dele), com o entregador da plataforma, entregue`,`Pedido entregue ainda fica alguns minutos à vista no quadro de Prontos antes de sair — e o tempo é PARÂMETRO ("entregue some do quadro após", padrão 3 minutos), nada fixo no código`,`Cores do quadro combinadas: Prontos verde-esmeralda claro, Fila de entrega vermelho claro (prioridade da operação), Em preparo azul claro — e Novos segue amarelo claro`],correcoes:[`O sistema "coletava" sozinho o pedido da plataforma depois de um tempo parado — agora o vigia só marca a CHEGADA do entregador; entregar e liberar é sempre de uma pessoa`,`Pedido de entrega sumia do quadro de Prontos assim que ficava pronto — o balcão perdia o pedido de vista antes mesmo de a sacola sair da loja`]},{version:`0.17.5`,date:`2026-08-25`,titulo:`Cadastro de gente nunca se apaga: quarentena, Ativar de volta e "está na loja" na mão`,melhorias:[`REGRA SAGRADA NO CÓDIGO: "excluir" um entregador NUNCA apaga o cadastro — manda para a 🗄️ QUARENTENA, com a data, de onde dá para DEVOLVER AO CADASTRO quando você quiser (o caso Joao Manuel não se repete)`,`Quem volta da quarentena volta INATIVO: readmitir exige o "↩️ Ativar" de propósito — nem excluir por engano, nem readmitir por descuido`,`Botão "↩️ Ativar" para entregador inativo: ele voltou a trabalhar na casa, o gestor reativa na hora (antes só existia Inativar, sem volta)`,`Botão "🟢 Está na loja" para o gestor marcar NA MÃO que o entregador chegou — para o dia em que ele aparece sem GPS, sem bateria ou sem o aplicativo: a pessoa está na porta e entra no rateio do mesmo jeito`,`Ativar não joga ninguém na escala sem querer: volta "fora do expediente" até alguém (ele ou o gestor) marcar que chegou`,`A quarentena fica fora de tudo: rateio, colunas, seletores — mas o histórico das viagens da pessoa continua intacto`],correcoes:[`O ✕ do cadastro de entregadores APAGAVA a pessoa de verdade, sem volta — cadastro de humano excluído por engano era perda definitiva`]},{version:`0.17.3`,date:`2026-08-25`,titulo:`Fila de entrega no quadro, vigia contra pedido preso, aceite em lote e a tela de Entregas remodelada`,melhorias:[`COLUNA NOVA "🛵 FILA DE ENTREGA", entre Prontos e Em entrega: é a fila do gestor de entrega — TODO pedido de entrega espera ali (própria até o gestor despachar; plataforma até o entregador chegar e coletar). NADA pula para "Em entrega" sozinho`,`Prontos virou o balcão de verdade: só retirada aguardando o cliente vir buscar`,`A coleta do entregador da plataforma agora leva minutos (dá para VER a fila) e fica registrada na linha do tempo: "🛵 Entregador da plataforma coletou o pedido"`,`VIGIA DA RUA: evento de plataforma que se perde não deixa mais pedido preso em "Em entrega" para sempre (o caso das 6 horas do print) — o vigia dá o passo que faltou e ESCREVE na linha do tempo que foi ele`,`ACEITE AUTOMÁTICO EM LOTE: esvaziou o "Em preparo", os novos entram NA HORA até encher o limite do parâmetro (limite 10 e preparo vazio → entram 10 de uma vez), os mais antigos primeiro`,`Pedido do WhatsApp/balcão também entra no aceite automático — antes ficava apodrecendo em Novos com o relógio negativo`,`TELA DE ENTREGAS REMODELADA: colunas com largura de quadro (nada mais esticado na tela inteira), cartões compactos como os do painel, a ordem da parada virou uma bolinha azul (adeus tarja preta) e os cabeçalhos de viagem ficaram azul-claro`,`O quadro semente abre sempre com um pedido de entrega própria COBRANDO na porta — o fluxo do acerto fica visível em toda abertura`],correcoes:[`Pedidos do entregador da plataforma pulavam de Prontos direto para "Em entrega" em segundos, sem fila visível — e podiam ficar presos lá para sempre se o evento de entrega se perdesse`,`O aceite automático lia o limite uma vez só e podia estourá-lo no mesmo lote`]},{version:`0.17.1`,date:`2026-08-25`,titulo:`Correção: "Receber" só no momento do acerto — e cobrança da plataforma é repasse`,melhorias:[`A verificação automática agora varre o quadro inteiro e reprova qualquer versão que mostre o botão "Receber" fora de hora (foi rodada contra a versão anterior e pegou exatamente o cartão do print)`],correcoes:[`O botão verde "💰 Receber" aparecia em pedido EM PREPARO. Agora ele só existe no momento do acerto: entrega própria depois de entregue E com o motoboy de volta; retirada de balcão do Pronto em diante (o cliente paga ao buscar)`,`COBRANÇA DO ENTREGADOR DA PLATAFORMA nunca passa pelo caixa: quem recebe na porta é o entregador dela e o valor entra no repasse. O cartão passou a dizer "💳 cobrança com o entregador da plataforma" (e "repasse" depois de entregue), sem botão de receber, sem virar pendência do caixa e sem inflar o "em aberto" do rodapé, do fechamento e da gerência`]},{version:`0.17.0`,date:`2026-08-25`,titulo:`Cadastro de clientes de verdade, rastreio do cliente, filas por número e perímetro no mapa`,melhorias:[`CADASTRO DE CLIENTES: botão "＋ Novo cliente" e "✏️ Editar" na ficha — nome, apelido, telefone, e-mail, ANIVERSÁRIO (com "faz aniversário em X dias" e o resumo 🎂 da semana), documento para a nota, ALERGIAS em destaque vermelho (a cozinha precisa ver), preferências, etiquetas (⭐ especial, 🌱 novo, ⚠️ atenção, 🏢 empresa), endereços com nome ("casa", "trabalho") e observações`,`O cadastro manual e a ficha automática se JUNTAM: o que a pessoa preenche nunca é sobrescrito pelo automático, e os números (pedidos, gastos, preferidos) continuam se montando sozinhos`,`Cadastro conferido campo a campo antes de salvar, dizendo o que falta; salvo no computador e sobrevive a fechar o navegador`,`RASTREIO DO CLIENTE: botão "📡 Ver o rastreio como o cliente vê" no pedido — etapas com horário, quem está levando, a quantos km está e em quanto tempo chega; o atendente manda o link sozinho quando o pedido sai para entrega, e o link abre SÓ aquele pedido, sem login`,`FILAS POR NÚMERO DE WHATSAPP: cada loja (CNPJ) pode ter quantos números precisar, cada número vira uma fila própria na tela de Conversas (com o contador de não lidas), e dá para ligar/desligar o atendente automático POR FILA — números administrados nas Configurações, aba WhatsApp`,`PERÍMETRO DE ATUAÇÃO: raio de entrega global e por loja; pedido de endereço fora do raio ganha o aviso ⛔ FORA DO PERÍMETRO no cartão (a decisão de aceitar é sua) e o mapa desenha o círculo de cada loja`,`FECHAMENTO mais completo: formas de recebimento do dia (aplicativo, dinheiro, maquininha, Pix, vale), PENDÊNCIAS do dia (o que ainda está sem baixa, pedido por pedido) e as datas guardadas na base histórica`,`Cadastro rápido de motoboy pelo gestor entra ACEITO e no rateio na hora — o aceite é para o auto-cadastro pelo celular do entregador; a coluna de Entregas passou a mostrar o estado real (aguardando aceite / fora do expediente / livre / na rua)`],correcoes:[`Motoboy criado pelo atalho do gestor (caso Joao Manuel) ficava preso em "aguardando aceite" e fora do agrupamento — cadastros antigos nessa situação são reconhecidos e entram no rateio`,`Viagem já despachada não se arrasta mais para outro motoboy (ela está na rua)`]},{version:`0.16.0`,date:`2026-08-25`,titulo:`Acerto da rua: o dinheiro volta com o motoboy — e o agrupamento reparte entre todos`,melhorias:[`COLUNA NOVA NO QUADRO: "Acerto da rua" — pedido entregue com valor pago na porta fica ali, aguardando o motoboy voltar com o dinheiro, a maquininha e o comprovante`,`O BOTÃO VERDE "💰 Receber" SÓ APARECE QUANDO O MOTOBOY CHEGA: enquanto ele está na rua, o cartão diz "aguardando o motoboy voltar para o acerto" — o caixa não recebe o que ainda não voltou`,`Pedido pago pelo aplicativo não passa pelo acerto: vai direto para Concluídos`,`BOTÃO "ENTREGUE" DE ENTREGA É SÓ DO GESTOR DE ENTREGAS: é ele quem recebe o motoboy e sabe se a entrega aconteceu — os demais monitores veem a etapa, sem o botão`,`RETIRADA NO BALCÃO tem regra própria: novo parâmetro "quem confirma a retirada" — o caixa, por padrão (o balcão é dele: o cliente paga e leva ali); muda para o gestor de entregas se o balcão virar posto próprio`,`AGRUPAMENTO SEM NÚMERO ENGESSADO: o tamanho da viagem passou a ser CALCULADO pelos motoboys livres — cadastrou um motoboy novo, ele entra no rateio na hora; 8 entregas com 4 livres viram 4 viagens de 2, não 3 viagens cheias e um motoboy parado`,`O teto de paradas das Configurações continua valendo como limite do baú, nunca como tamanho padrão`],correcoes:[`O botão de receber aparecia com o pedido ainda na rua — dava para "receber" um dinheiro que estava no bolso do motoboy`]},{version:`0.15.0`,date:`2026-08-25`,titulo:`Mapa de rua de verdade, trajeto pelas ruas — e "em entrega" só depois de despachado`,melhorias:[`MAPA DE RUA DE VERDADE: o mapa ao vivo passa a carregar as ruas do bairro, com o crédito do OpenStreetMap na tela`,`TRAJETO PELAS RUAS: a linha da viagem deixa de ser reta e passa a seguir o caminho que o motoboy faz de verdade, com a quilometragem e o tempo estimado vindos do serviço de rotas`,`O painel da viagem passou a mostrar "5,4 km pelas ruas" e "18 min de trajeto" quando o traçado é real`,`HONESTIDADE NA TELA: quando o mapa de rua não carrega (o link do Claude bloqueia imagem de fora), a tela DIZ que está no desenho e em linha reta, e explica o motivo — nunca deixa parecer que é rua de verdade`,`O enquadramento passou a usar a mesma projeção dos mapas de rua, então as motos, as lojas e as paradas caem exatamente em cima das ruas certas`,`O mapa não deforma mais: a área é alargada até a proporção da tela em vez de ser esticada`,`O endereço do mapa e do serviço de rotas é configurável — no aplicativo instalado na loja, os dois rodam no próprio computador do Carlos, sem mensalidade`,`A mesma viagem não é pedida duas vezes ao serviço de rotas`],correcoes:[`FURO GRAVE: o quadro abria com um pedido de ENTREGA PRÓPRIA já em "Em entrega", sem viagem e sem motoboy — o painel dizia que a comida tinha saído enquanto a tela de Entregas mostrava "ninguém na rua". Agora esse pedido é despachado pelo caminho de verdade, com rota, motoboy e viagem. Entrega própria só entra em "Em entrega" DEPOIS DE DESPACHADA`,`Entrega feita pelo entregador da plataforma continua aparecendo em "Em entrega" sem viagem nossa — ali quem leva é o aplicativo deles, e o cartão diz isso`,`A verificação automática passou a vigiar essa coerência do começo ao fim da operação, e reprova qualquer versão que volte a mostrar pedido na rua sem alguém levando`]},{version:`0.14.0`,date:`2026-08-25`,titulo:`Movimento de verdade em bateria, ritmos prontos e o mapa cabendo na tela`,melhorias:[`RITMO DE TRABALHO: a simulação manda 1 pedido por minuto — 60 na hora, contra os 20 de antes. É o ritmo que deixa acompanhar a entrega do começo ao fim: chega pedido o tempo todo, forma rota, o motoboy sai, volta e sai de novo`,`RITMOS PRONTOS nas Configurações, para trocar sem fazer conta: Calmo (20/h), Movimento (60/h — o sugerido), Sexta à noite (180/h) e Pico (600/h, teste de estresse)`,`PEDIDO CHEGA EM BATERIA, não de um em um: 3 a 6 pedidos pipocando quase juntos, e depois o respiro — é assim que se descobre se o quadr
