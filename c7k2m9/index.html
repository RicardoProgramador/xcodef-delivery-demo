o aguenta, se o alarme atrapalha e se a cozinha dá conta`,`Quanto mais apertado o ritmo, mais rápido a bateria pipoca: no movimento calmo os pedidos vêm de 5 a 25 segundos; no pico, de 2 em 2`,`E o número exato continua ajustável na mão: pedidos por hora, com a conta de quantos dá por minuto ao lado, e o tamanho da bateria`,`Mudou o ritmo, a agenda é remontada na hora — sem recarregar a página`,`As conversas do WhatsApp acompanham o movimento dos pedidos, com teto para não afogar o painel`,`ARRASTAR A VIAGEM INTEIRA: pegue a viagem pelo cabeçalho (⠿) e largue no outro motoboy — o bolo todo passa de uma vez, sem mover pedido por pedido`,`A viagem sem motoboy também se arrasta inteira: do aviso na fila direto para quem vai levar`,`Largar uma viagem dentro de outra junta as duas`,`Viagem que já saiu para a rua não se arrasta — o motoboy está com ela`,`MAPA CABE NA TELA: abre já ajustado à janela, com todo mundo que está na rua aparecendo, sem estourar a altura e sem rolagem lateral`,`A verificação automática mede o ritmo DENTRO DO NAVEGADOR e confere se o painel continua respondendo, inclusive no pico`],correcoes:[`O mapa abria mais alto que a janela e obrigava a rolar a página para ver a operação inteira`,`A última conversa de cada hora caía no minuto 60 e era descartada — sumia do painel sem motivo`]},{version:`0.13.1`,date:`2026-08-25`,titulo:`Correção urgente: agrupar não some mais com pedido`,melhorias:[`REDE DE SEGURANÇA: viagem montada que ficar sem motoboy passa a aparecer em destaque na fila "Sem motoboy", com o seletor para dar a alguém e o ✕ para desfazer — pedido pronto SEMPRE fica visível, aconteça o que acontecer`,`Se ninguém estiver marcado como disponível, o agrupamento não trava mais: sugere assim mesmo e o gestor troca na mão`,`A verificação automática agora repete exatamente este caso antes de cada publicação (com o cadastro antigo salvo e com ninguém disponível) e reprova a versão que sumir com qualquer pedido`],correcoes:[`GRAVE: "Sugerir agrupamento" fazia os pedidos prontos SUMIREM da tela e não deixava montar viagem. Causa: motoboy cadastrado antes da versão 0.11.0 (quando o cadastro era só o nome) ficou sem os campos de situação e de "está na loja"; com isso ninguém passava na escolha automática, a viagem nascia sem dono e a tela não desenhava viagem sem dono. Cadastro antigo passou a ser reconhecido como aceito e disponível — quem já rodava continua rodando`]},{version:`0.13.0`,date:`2026-08-25`,titulo:`Mapa ao vivo com a moto andando, passo a passo do entregador e uma tela só de entregas`,melhorias:[`NOVA TELA "🗺️ Mapa ao vivo": todas as entregas acontecendo ao mesmo tempo, numa tela só — a motinha ANDA de verdade, parada a parada, até voltar para a loja`,`Cada loja, cada endereço e cada moto num ponto do mapa; o trajeto aparece pontilhado e vai virando linha cheia conforme ele anda`,`Clique numa moto para acompanhar só ela; as outras ficam apagadas`,`Painel ao lado com o que o desenho não cabe: onde ele está, quanto por cento do trajeto já andou, quantas entregas fez, quanto tempo está na rua, quantos quilômetros faltam até a próxima parada e quanto já recolheu de dinheiro`,`PASSO A PASSO NO APLICATIVO DO ENTREGADOR: um botão de cada vez — "Saí da loja", "Cheguei no endereço do #1204", "Entreguei", "Estou voltando", "Cheguei na loja" — para ele não ter de decidir nada dirigindo`,`Cada passo marcado vira aviso na hora para a retaguarda: o gestor vê a viagem andando sem ligar perguntando "onde você está?"`,`BOTÕES DE NAVEGAR no aplicativo do entregador: "até a próxima parada" e "rota toda", abrindo no aplicativo de mapa que ele já tem no celular`,`O entregador passou a ver a ROTA MONTADA dele, numerada na ordem, com endereço, cliente e quanto receber em cada porta`,`BOTÃO "🏁 Finalizar viagem" para quando o aparelho do motoboy não estiver mandando posição (sem bateria, sem sinal, aplicativo fechado) — e o registro do dia diz se a viagem fechou pelo retorno do aparelho ou à mão, e por quem`,`DUAS TELAS VIRARAM UMA: "Gestão de Entrega" e "Entregas" eram a mesma coisa pela metade. Agora é uma só — fila, colunas por motoboy, ordem das paradas, mapa do trajeto, copiar link, despachar, viagens na rua e registro do dia`,`Dentro de cada viagem agora aparecem: selo de bairro longe, quanto o motoboy leva em cobranças, o trajeto no mapa e o botão de copiar o link para mandar para ele`,`O cadastro de entregadores passou para o "App do entregador", onde já ficam o aceite do gestor e a situação de cada um — inclusive inativar quem saiu`,`Quilometragem da viagem passou a sair do trajeto de verdade, não mais de estimativa por bairro`],correcoes:[`A soma de quilômetros por motoboy arredondava a cada viagem, acumulando erro no total do dia; agora soma tudo e arredonda uma vez só`,`As telas ao vivo podiam ficar paradas no tempo: guardavam o resultado pela identidade da lista de viagens, que o motor altera por dentro`]},{version:`0.12.0`,date:`2026-08-25`,titulo:`A base não zera mais: histórico, fechamento por jornada e a tela de Gerência`,melhorias:[`OS PEDIDOS NÃO SOMEM MAIS: tudo o que termina — entregue ou cancelado — entra numa base histórica que sobrevive a recarregar a página e a fechar o navegador`,`A JORNADA ZERA SÓ À MEIA-NOITE: às 00h o dia é fechado, o quadro começa limpo e o histórico continua inteiro para consulta`,`Viagem em andamento e pedido ainda vivo atravessam a virada — ninguém perde trabalho no meio`,`NOVA TELA "📊 Gerência": faturamento, ticket médio, taxa de cancelamento, dinheiro em aberto e fatia de venda fechada pelo atendente automático`,`Filtro por LOJA (cada CNPJ) e por período: hoje, últimos 7 dias e últimos 30 dias`,`CURVA DE PRODUTOS: o que vende mais e o que só ocupa lugar, classificado em A (faz 80% do dinheiro), B (sustenta) e C (candidato a sair do cardápio)`,`RITMO DE CADA SETOR medido de verdade, contra meta: atendimento/caixa (aceitar o pedido), cozinha (preparo), expedição (prato pronto até sair com o motoboy) e entrega (saída até a porta do cliente)`,`O SETOR QUE ESTÁ SEGURANDO A OPERAÇÃO aparece destacado, com quanto está acima da meta e o que fazer a respeito`,`Além da média, o "pior caso": o tempo abaixo do qual ficam 9 de cada 10 pedidos — é ele que mostra o dia ruim`,`GRÁFICOS na página: movimento por hora do dia, faturamento por canal, por dia da semana, por bairro e comparação entre as lojas`,`"O QUE OS NÚMEROS ESTÃO PEDINDO": frases de decisão montadas dos próprios dados — cardápio, escala, pico, concentração de canal, dinheiro na rua — e só aparecem quando há dado que as sustente`,`REGRA DE VERSÃO combinada: até 5 melhorias anda 1 no último número, de 6 a 10 anda 2, e assim por diante; pacote grande anda o número do meio. Um teste confere isso sozinho a cada entrega`],correcoes:[`A classificação da curva de produtos jogava para a classe B o prato que sozinho já passava dos 80% do faturamento — justamente o mais importante da casa. Agora quem cruza a linha continua classe A`]},{version:`0.11.0`,date:`2026-08-25`,titulo:`App do entregador: ele se cadastra, o gestor aceita, a viagem chega no celular`,melhorias:[`NOVA TELA "📱 App do entregador": é a tela que o motoboy vê no celular dele, aqui dentro da simulação para você acompanhar`,`ESCOLHER O ENTREGADOR: um seletor troca a visão — dá para ver o mesmo aplicativo pelos olhos de cada motoboy`,`CADASTRO PELO PRÓPRIO ENTREGADOR: nome, CPF, CNH com a validade, telefone, endereço completo e placa da moto`,`CPF e CNH conferidos de verdade pelos dígitos do documento: erro de digitação é recusado na hora, dizendo o que está errado`,`ELE NÃO ENTRA NA ESCALA SOZINHO: o cadastro fica AGUARDANDO o gestor (ou o caixa) aceitar — e a lista lateral mostra quem está esperando, com o botão de aceitar`,`BATER PONTO: "Cheguei, estou na loja" / "Encerrar por hoje" — só quem avisou que chegou entra no rodízio de viagens`,`A VIAGEM CHEGA NO CELULAR DELE: endereço de cada parada, cliente, quanto receber na porta, e o botão "Entreguei" por parada`,`OCORRÊNCIAS pelo aplicativo do entregador: problema na moto, blitz, trânsito, cliente ausente, entregador recusou e roubo — vão direto para a viagem e para o registro do gestor`,`O DIA DELE em números: viagens, entregas, quilômetros e quanto já recolheu de dinheiro`],correcoes:[`A escolha automática de motoboy pegava qualquer um cadastrado; agora só entra no rodízio quem foi aceito pelo gestor E avisou que está na loja`]},{version:`0.10.0`,date:`2026-08-25`,titulo:`Arrastar e soltar as entregas, e montar a viagem à mão`,melhorias:[`ARRASTAR E SOLTAR: pegue o cartão da entrega e largue na coluna de outro motoboy — sai de um, entra no outro, sem menu nenhum`,`Arraste também para DENTRO de uma viagem específica, quando o motoboy tem mais de uma`,`Arraste de volta para "sem motoboy" para tirar o pedido de quem estiver com ele`,`BOTÃO "+ VIAGEM" em cada motoboy: cria a viagem vazia e você vai arrastando os pedidos para dentro, na ordem que quiser`,`A viagem montada à mão mostra a loja de coleta, os bairros na ordem e os quilômetros conforme você monta`,`Enquanto o cartão está no ar, os destinos possíveis ficam acesos — não tem como largar no lugar errado`,`Quem prefere clicar continua com a marcação e o "mover para": os dois caminhos convivem`,`Pedido que já saiu para entrega não se arrasta — ele está na rua com o motoboy`],correcoes:[`Mover um pedido "para ninguém" criava uma viagem fantasma sem dono; agora ele volta direto para a fila "sem motoboy"`]},{version:`0.9.0`,date:`2026-08-25`,titulo:`Viagens do motoboy: o GPS fecha, o registro guarda`,melhorias:[`VIAGEM DE VERDADE: despachar um motoboy abre uma VIAGEM numerada, com a loja de coleta, os bairros na ordem, as paradas, a quilometragem prevista e a hora da saída`,`O APARELHO DO MOTOBOY MANDA A POSIÇÃO: dá para acompanhar na tela a que distância da loja ele está, e as entregas vão caindo sozinhas conforme ele passa em cada endereço — está assim na simulação, para você ver acontecer`,`A VIAGEM SE FECHA SOZINHA: entregou tudo e o aparelho voltou para a porta da loja? Viagem encerrada, sem ninguém precisar lembrar de clicar`,`Viagem concluída SAI da tela de quem despacha (gestor de entrega ou caixa, conforme a configuração) e vai para o REGISTRO DO DIA`,`REGISTRO DO DIA com tudo o que o gestor confere, na ordem de quem lê: nº da viagem, motoboy, loja, saiu, voltou, tempo, bairros, pedidos, entregues, quilômetros, minutos por entrega, dinheiro recolhido e ocorrências`,`Botão para copiar o registro inteiro para a planilha`,`OCORRÊNCIAS na viagem: problema na moto, blitz, trânsito, cliente ausente e roubo — apontadas durante a viagem e guardadas no registro`,`Cada entrega feita na viagem entra na linha do tempo do pedido: "🛵 Entregue por Jefferson · viagem 3"`,`Enquanto a viagem corre, a tela mostra quanto o motoboy já recolheu de dinheiro na porta`],correcoes:[]},{version:`0.8.0`,date:`2026-08-25`,titulo:`Guardrail de conformidade e conversa com o cliente sem sair do sistema`,melhorias:[`GUARDRAIL DE CONFORMIDADE: 16 regras das plataformas viraram teste automático — se algum desenvolvimento, hoje ou amanhã, esbarrar em regra de iFood, Keeta ou 99Food, a construção FALHA antes de chegar na homologação`,`Nova aba 🛡️ Conformidade nas Configurações: cada regra com o que a plataforma exige, o risco de descumprir, como o sistema cumpre e o estado agora (tudo certo / atenção / com você)`,`A tela separa o que o sistema garante sozinho do que depende de configuração e do que depende de pessoa (Carlos assinar a conta de desenvolvedor, agendar a sessão de homologação, vincular as lojas)`,`FALAR COM O CLIENTE NÃO SAI MAIS DO SISTEMA: o botão abre a conversa aqui dentro, pela mesma via em que o pedido chegou — nosso WhatsApp leva ao MESMO fio em que o pedido caiu; pedido de plataforma abre o chat dela, e a rotina manda a mensagem pela interface da própria plataforma`,`Botão "💬 falar" também no cartão do pedido, para chamar o cliente sem abrir nada`,`HISTÓRICO NO PEDIDO: tudo o que é dito ao cliente — por você ou pelo atendente automático — fica gravado na linha do tempo daquele pedido, com a hora e por qual via`,`Cada conversa mostra o selo da via (nosso WhatsApp, chat do iFood, da Keeta, da 99Food) na lista e no cabeçalho`,`Quando o pedido da plataforma termina, o chat dela fecha — e a tela explica isso em vez de deixar a pessoa escrevendo no vazio`,`A aba passou a se chamar 💬 Conversas: agora ela guarda todas as vias, não só o WhatsApp`,`Respostas rápidas mudam conforme a via: no nosso WhatsApp fala-se de Pix, troco e endereço; no chat da plataforma, só de preparo, prazo, troca de item e saída — combinar pagamento por fora ali é violação de política`,`A linha do tempo do pedido saiu do inglês: "pedido recebido", "pedido aceito", "saiu para entrega" — e as falas da conversa aparecem nela em verde`,`PEDIDO NO CARTÃO DA CONVERSA: depois que a conversa vira pedido, o cartão dela mostra o nº do chamado, em que etapa está e como está o dinheiro`,`PAGO x ABERTO: pedido pago pelo aplicativo já nasce quitado; pedido que paga na porta (dinheiro, maquininha, Pix na hora) fica ABERTO — é dinheiro na rua`,`BAIXA DO CAIXA: botão "💰 Receber" no cartão e no detalhe; o caixa escolhe a forma (dinheiro com o troco calculado, maquininha de crédito/débito, Pix na hora, vale) e o pedido passa a "✅ recebido", com quem confirmou na linha do tempo`,`O rodapé passou a mostrar quanto está EM ABERTO agora, além do que está na rua`],correcoes:[`A ficha do cliente oferecia "Falar no WhatsApp" abrindo o aplicativo por fora, inclusive para quem chegou pelo iFood/Keeta/99Food. Isso é violação de política das três, com risco de punição da loja — e ainda não funcionava, porque o telefone que elas entregam é intermediado. Agora a conversa é sempre por dentro, pela via certa`,`O detalhe do pedido também abria o WhatsApp por fora: passou a abrir a conversa do próprio pedido`,`"Converter em pedido" aparecia em conversa de plataforma, onde o pedido já existe — agora só no canal próprio`]},{version:`0.7.0`,date:`2026-08-25`,titulo:`Gestão de Entrega, papéis e operadores do sistema`,melhorias:[`DISPONÍVEL PARA ENTREGA: pedido pronto de entrega própria não tem mais o botão "Saiu para entrega" no cartão — ele fica aguardando alguém despachar, como é na vida real`,`TELA GESTÃO DE ENTREGA: uma coluna por motoboy com as entregas dele, a fila "sem motoboy" ao lado, e o botão "🛵 Despachar" — é aqui, e só aqui, que o pedido vira "saiu para entrega"`,`Marque um ou vários pedidos e passe para outro motoboy antes de despachar`,`RODÍZIO POR QUILOMETRAGEM: a sugestão dá a viagem ao motoboy livre com menos km hoje; a tela mostra km de cada um, entregas do dia e km da viagem atual — no fim do dia todos rodaram parecido`,`Novo perfil de monitor: GESTOR DE ENTREGA, com tela própria`,`Nas Configurações, escolha quem despacha: o Gestor de Entrega ou o próprio Caixa — quando é o caixa, a tela de gestão aparece para ele também`,`OPERADORES DO SISTEMA: cadastro com nome, CPF (validado de verdade), telefone, e-mail, atribuições (quais telas ele assume) e ativo/inativo`,`Importar a equipe inteira de uma planilha (colar do Excel ou arquivo), com aviso claro de linha recusada e por quê; exportar também`,`Entrar no sistema com usuário e senha: cada pessoa abre direto na tela da função dela e só troca entre as atribuições que tem`,`Quem sai da empresa vira inativo — não entra mais, mas continua no histórico dos pedidos que atendeu`],correcoes:[]},{version:`0.6.0`,date:`2026-08-25`,titulo:`Clientes (CRM) e o robô cuidando também de quem já pediu`,melhorias:[`TELA CLIENTES: a ficha de cada cliente se monta sozinha — telefone, endereços que já usou, como costuma pagar, o que mais pede, quantos pedidos, quanto já gastou, ticket médio, cancelados e há quantos dias não compra`,`Resumo no alto: faturamento por cliente, quantos voltaram a comprar e quantos sumiram há mais de 15 dias (para chamar de volta)`,`Quem só conversou pelo WhatsApp, sem comprar, também vira ficha — é cliente em potencial`,`Botão para copiar todos os clientes para a planilha`,`PÓS-VENDA PELO ROBÔ: quem já tem pedido em andamento agora é atendido também — "quanto tempo falta?" responde o estado real do pedido; "manda troco pra R$ 100" anota o troco no cartão; "tira a cebola" vira recado para a cozinha (se ainda der tempo); "me liga quando chegar" vira observação para o entregador`,`Mais conversas chegando (uma a cada ~5 minutos) para dar para acompanhar o atendente trabalhando de verdade`],correcoes:[`Conversa sobre um pedido em andamento nascia no meio ("manda troco pra R$ 100", sem contexto) e ficava PARADA, porque ia direto para uma pessoa. Agora abre como gente abre ("Oi! É sobre o pedido #1204 — …") e o atendente responde na hora`,`Pedido de ajuste em pedido que já saiu da cozinha passa para uma pessoa em vez de prometer o que não dá`]},{version:`0.5.0`,date:`2026-08-25`,titulo:`Atendente automático do WhatsApp: vende sozinho`,melhorias:[`O ROBÔ ATENDE E VENDE: lê a mensagem do cliente, entende o que é do cardápio, pergunta quando fica em dúvida ("é a Marmita P ou a G?"), combina entrega ou retirada, endereço, pagamento — e REGISTRA o pedido sozinho na esteira de produção`,`Fala como gente: frases curtas, informais e variadas — nunca repete a mesma frase na mesma conversa (são vários jeitos de dizer cada coisa)`,`Responde já no primeiro contato, com saudação sorteada, e conduz o cliente até fechar`,`Pagamento completo: pix (manda a CHAVE DA LOJA e espera o comprovante antes de mandar para a cozinha), cartão (avisa que o motoboy leva a maquininha) e dinheiro (pergunta se precisa de troco e para quanto — o valor vai no cartão do pedido)`,`O cliente pode MUDAR O PEDIDO no meio da conversa: acrescentar item, tirar item, ou desistir — tudo aparece na conversa e o total se ajusta`,`Travas de segurança: acima do valor máximo configurado ele não fecha sozinho; reclamação, pedido de falar com uma pessoa ou item fora do cardápio passam a conversa para o balcão na hora`,`Na tela do WhatsApp: selo 🤖 nas falas do robô, quadro com "o que o atendente já entendeu" (itens e total) e botões "Assumir conversa" / "Devolver ao atendente"`,`Três modos nas Configurações: só sugerir a resposta, conversar sozinho, ou conversar e registrar — com demora de resposta e nome de apresentação ajustáveis`,`Pedido fechado pelo robô nasce com o selo "🤖 fechado pelo atendente" no quadro`,`A tela "Parâmetros" passou a se chamar "Configurações"`],correcoes:[`O robô apagava o pedido quando o cliente escrevia "retirada" (a palavra contém "tira", que ele lia como "tirar item") — comparação agora é por palavra inteira`,`Resposta de pagamento com "troco p/ R$ 100" era lida como o prato "Marmita P" e travava a conversa em laço`]},{version:`0.4.3`,date:`2026-08-25`,titulo:`Correções de conta no pedido manual`,melhorias:[`Revisão automática do código encontrou e travou com teste três erros de conta antes que chegassem na loja`],correcoes:[`RECUPERAR VENDA: ao tocar num prato do cardápio, o valor do pedido cancelado era apagado e a loja cobraria só o item tocado (um pedido de R$ 67,80 virava R$ 7,00). Agora o valor que veio pronto é preservado, com o botão "usar este total" quando você quiser a soma do cardápio`,`O texto avulso deixou de virar um item de R$ 0,00 quando não sobra valor — nesse caso ele entra como observação do pedido (a cozinha via um prato para produzir de graça)`,`Colar do Excel com as colunas de preço vazias no fim voltou a limpar os ajustes por canal (o item volta a herdar o preço global)`,`O pedido com itens do cardápio agora chega inteiro ao programa da loja (a lista de pratos estava sendo descartada na entrada)`]},{version:`0.4.2`,date:`2026-08-24`,titulo:`WhatsApp e balcão com cardápio próprio`,melhorias:[`O WhatsApp/balcão virou canal de venda como os outros no Cardápio: aba própria, herdando o global até você dar um preço só dele — útil porque o canal próprio não paga comissão e pode sair mais barato`,`Canal próprio não pede publicação: o preço vale na hora (a barra de publicação continua só para iFood, Keeta e 99Food)`,`NO PEDIDO WHATSAPP/BALCÃO: o cardápio de hoje aparece em botões — um toque põe o prato, com quantidade no + e −, e o TOTAL É SOMADO SOZINHO com o preço do canal`,`O total continua editável para desconto ou combinado com o cliente, com o botão "usar este total" para voltar à soma do cardápio`,`O que estiver fora do cardápio continua como texto avulso, na mesma tela`,`O pedido nasce com os itens de verdade (nome, quantidade e preço), e não mais uma linha de texto — o fechamento do dia fica correto`,`Planilha do cardápio ganhou a coluna preco_whatsapp (exporta e importa junto com as outras)`,`Transferências valem para o canal próprio: dá para copiar o global para o WhatsApp, ou promover os preços do WhatsApp ao global`],correcoes:[]},{version:`0.4.1`,date:`2026-08-24`,titulo:`Dois computadores, os mesmos pedidos`,melhorias:[`Os pedidos novos da simulação agora seguem o RELÓGIO com semente fixa: dois computadores com a página aberta veem os MESMOS pedidos, conversas e cancelamentos chegando nos mesmos minutos — sem servidor e sem conta`,`Vale para demonstrar por telefone: "olha o pedido que acabou de tocar" é o mesmo número, mesmo prato e mesmo cliente nas duas telas`,`O que continua individual em cada tela (de propósito): os cliques de cada um (aceitar, pronto, entregar), o quadro de abertura e os pedidos digitados à mão — no aplicativo real da loja, as telas são espelhadas de verdade pela rede, como o modo 4 telas mostra`,`Números de pedido da agenda derivados do horário (não se repetem no dia e não conflitam com os do quadro de abertura)`],correcoes:[]},{version:`0.4.0`,date:`2026-08-24`,titulo:`Gerenciador de cardápios e rotas com coerência`,melhorias:[`CARDÁPIO POR DIA: cada item marca em quais dias da semana vale (filtro "Hoje"); pedido novo da simulação só traz prato do dia, com o preço do canal`,`Transferir/importar cardápio: importar DA plataforma para o global (item que só existe lá é criado, preço defasado é atualizado) e copiar entre global ↔ plataformas com um clique`,`Carga em lote: cole direto do Excel/planilha ou envie arquivo; exportar no mesmo formato para editar fora e trazer de volta`,`Fotos dos pratos com leitura automática: na simulação pelo nome do arquivo (declarado na tela); no aplicativo instalado, por inteligência artificial de visão que reconhece o prato pela imagem`,`Busca, filtro por categoria, criar e remover item direto na tela do Cardápio`,`ROTAS COERENTES: uma loja por rota (coleta num lugar só), bairros vizinhos juntos e na ordem geográfica, máximo de entregas por viagem nos Parâmetros`,`Bairro LONGE segura a rota: só solta com o mínimo de entregas juntas ou após a espera máxima — nada de viagem atravessando a cidade por 1 pedido`,`Pedido de bairro longe com rota juntando ganha o selo "🚀 ADIANTAR" na cozinha e sobe na coluna — sai na mesma viagem do motoboy`,`Escolha automática do motoboy: o LIVRE com MENOS entregas hoje (revezamento justo, contagem visível); a troca manual continua valendo`,`Link do Google Maps agora parte do endereço da loja com as paradas na ordem`],correcoes:[]},{version:`0.3.8`,date:`2026-08-24`,titulo:`Retirada no balcão de ponta a ponta`,melhorias:[`No pedido WhatsApp/balcão, escolha em destaque "Como o cliente recebe?": 🛵 Entrega ou 🛍️ Retirada no balcão (o endereço some e a cobrança vira "Cobrar na retirada")`,`Pedido pronto de retirada ganhou o botão "🛍️ Retirado ✓" no caixa e no gestor — conclui na hora, sem passar pela etapa de entrega`,`Cartão com selo roxo "🛍️ RETIRADA NO BALCÃO" e detalhe do pedido indicando que o cliente vem buscar`,`Cliente do WhatsApp também combina retirada na conversa — "Converter em pedido" já vem com 🛍️ marcado (conversa do Roberto Lima na simulação)`,`Tela da cozinha mostra "no balcão — cliente vem retirar" quando o pedido de retirada fica pronto; a tela dos entregadores não recebe retiradas`,`Exemplo pronto ao abrir a simulação (Cláudia Nunes, cobrar na retirada) para testar o botão`],correcoes:[`A opção de retirada existia escondida numa caixinha pequena do formulário — fácil de passar despercebida`,`Título das janelas (detalhe do pedido, novo pedido, histórico) estava branco sobre branco — invisível`]},{version:`0.3.7`,date:`2026-08-24`,titulo:`Recuperar venda só no canal próprio (WhatsApp)`,melhorias:[`"Recuperar venda" agora aparece SOMENTE em pedido cancelado do WhatsApp — o cliente das plataformas é relacionamento delas (contato direto para fechar por fora pode gerar punição)`,`Pedido cancelado das plataformas fica com "Ciente" (arquivar); a trava vale na tela e no motor`],correcoes:[]},{version:`0.3.6`,date:`2026-08-24`,titulo:`Rodapé por função e cadastro de lojas`,melhorias:[`Rodapé repensado por tela: cozinha vê "para começar / em produção / prontos / recados sem resposta / preparo médio"; entregadores veem "prontos p/ rota / em rota / levar em cobranças / rotas sem motoboy"; caixa vê fila, aceite médio, a receber na entrega, mensagens não lidas e concluídos; gestor vê o consolidado com faturamento`,`Lojas parametrizáveis: botão "Adicionar loja (CNPJ)" na aba Lojas dos Parâmetros — a loja nova entra automaticamente nas conexões das plataformas, no pedido WhatsApp e no fechamento`,`Remoção de loja com confirmação em dois toques; pedidos antigos permanecem no histórico; a última loja não pode ser removida`],correcoes:[]},{version:`0.3.5`,date:`2026-08-24`,titulo:`Corrigir clique errado: Desfazer e Movimentos de hoje`,melhorias:[`Ao avançar um pedido, aparece "↩ Desfazer" por 8 segundos — o erro percebido na hora se resolve com um toque, sem chamar o gestor`,`Botão "↩ Movimentos" em todas as telas: lista só os pedidos movimentados hoje (o mais recente no topo) com "Voltar etapa"`,`Cada perfil vê apenas os movimentos do seu tipo (cozinha: preparo/pronto; entregadores: saiu/entregue); o gestor vê tudo e pode voltar qualquer pedido, até concluído/arquivado`,`Toda correção fica registrada na linha do tempo do pedido ("etapa voltada: Pronto → Em preparo")`,`Regra de honestidade: o quadro interno volta, mas a plataforma não desfaz o que já recebeu — aceite e cancelamento não voltam`],correcoes:[]},{version:`0.3.4`,date:`2026-08-24`,titulo:`Escolher para qual tela voltar`,melhorias:[`No modo 4 telas, cada quadro ganhou o botão "⤢ ampliar": abre a tela daquele funcionário em tamanho cheio`,`Ao voltar para 1 tela, o painel abre no perfil escolhido — não volta mais sempre para o gerencial`,`Recado para a cozinha com botões de sugestão de texto (um toque preenche; dá para combinar e editar antes de enviar)`],correcoes:[]},{version:`0.3.3`,date:`2026-08-24`,titulo:`Comunicação caixa ↔ cozinha com confirmação OK/NOK`,melhorias:[`Recado do caixa chega PISCANDO no cartão da tela da cozinha, com aviso sonoro repetido até a resposta`,`Cozinha responde com um toque em opções pré-cadastradas: ENTENDIDO, AJUSTADO, DÁ SIM / NÃO DÁ, ITEM EM FALTA, VAI ATRASAR`,`A resposta volta ao cartão do caixa e do gestor como selo verde OK ou vermelho NOK, com o texto escolhido`,`Aviso sonoro no caixa quando a resposta chega (toque duplo quando é NOK)`,`Detalhe do pedido mostra a situação do recado: aguardando, OK ou NOK`],correcoes:[]},{version:`0.3.2`,date:`2026-08-24`,titulo:`Identidade do app, histórico de versões e modo 4 telas`,melhorias:[`Nome do aplicativo (xcodef-delivery) e versão visíveis no topo e no rodapé`,`Clique na versão abre este histórico de melhorias e correções`,`Histórico permanente: gravado no repositório e embutido em todas as versões publicadas`,`Modo 4 telas: gestor, caixa, cozinha e entregadores lado a lado, sincronizados em tempo real — aja numa tela e veja as outras reagirem`,`No sistema real da loja cada monitor abre o painel pela rede e escolhe seu perfil — a sincronização entre telas é nativa`],correcoes:[]},{version:`0.3.1`,date:`2026-08-24`,titulo:`Cliente do WhatsApp interage até fechar a venda`,melhorias:[`Cliente simulado responde à loja: confirma itens, informa endereço, escolhe pagamento e pede para registrar`,`"Converter em pedido" já vem preenchido com o que o cliente disse na conversa`,`Cliente agradece após o pedido registrado; conversas ligadas a pedido também respondem`,`Teste automatizado do fluxo de conversa rodando a cada entrega`],correcoes:[`Conversas não ficavam mais mudas após a resposta da loja`]},{version:`0.3.0`,date:`2026-08-24`,titulo:`Parâmetros completos, perfis de monitor e novas telas`,melhorias:[`Painel de Parametrizações com a hierarquia do produto: específico da plataforma → global ("herdar do global")`,`Conexão por plataforma: iFood (clientId/secret + lojas), Keeta (conta MARCA), 99Food (AppShopID por loja), WhatsApp (pareamento por QR)`,`Cadastro completo por loja: razão social, CNPJ, inscrição estadual, endereço, telefones, logo, cor e horários`,`Aceite automático com espera e trava de capacidade; iniciar preparo junto com o aceite; modos de entrega por canal`,`Perfis de monitor: Gestor, Caixa, Cozinha e Entregadores — cada tela com suas colunas e botões; concluídos só no gestor`,`WhatsApp como canal de venda na mesma esteira: conversas, respostas rápidas e conversão em pedido`,`Selo 💬 com som no cartão quando o cliente manda mensagem sobre o pedido; recado para a cozinha; "Falar com o cliente"`,`Cardápio global + ajustes por plataforma, reajuste % em lote e publicação por canal`,`Entregas: motoboys, rotas agrupadas por bairro e link do Google Maps com as paradas na ordem`,`Fechamento diário e mensal com exportação CSV no contrato do ERP`,`Rodapé funcional: fila ao vivo, tempo médio de aceite, próximo agendado, sincronização, conexões e faturamento (gestor)`],correcoes:[`Botão de som virou alternância fixa (não desaparece mais) com preferência lembrada`,`Recuperar venda passou a ser operação única: trava de duplicidade e o cancelado sai do quadro sozinho`,`Pedidos do WhatsApp não sofrem mais cancelamento aleatório na simulação`]},{version:`0.2.1`,date:`2026-08-24`,titulo:`Destinos para retirada pronta e pedidos cancelados`,melhorias:[`Retirad  Delivery até 100.`,severidade:`homologacao`,verificacao:`no-codigo`},{id:`ifood-sem-filtro-de-tipos`,plataforma:`ifood`,titulo:`Nunca filtrar tipos ou grupos na consulta do iFood`,exigencia:`Usar o filtro de types/groups na consulta faz o iFood CONFIRMAR SOZINHO todo evento que ficou de fora.`,risco:`Pedido some sem ninguém ver — o pior defeito possível numa loja.`,comoCumprimos:`O adaptador do iFood consulta sem query de filtro, com comentário explicando a armadilha (src/core/adapters/ifood/ifood-adapter.ts).`,severidade:`operacao`,verificacao:`no-codigo`},{id:`prazo-aceite`,plataforma:`ifood`,titulo:`Aceitar dentro do prazo de 8 minutos`,exigencia:`O iFood cancela sozinho o pedido não aceito em 8 minutos a partir do início previsto de preparo.`,risco:`Cancelamento automático, nota do restaurante e reclamação do cliente.`,comoCumprimos:`Contagem regressiva no cartão, alarme em laço até o aceite e escalada sonora — é a razão de ser do produto.`,severidade:`operacao`,verificacao:`no-codigo`},{id:`polling-e-presenca`,plataforma:`ifood`,titulo:`Parar de consultar significa loja fechada`,exigencia:`O iFood usa a consulta como sinal de presença: se o programa para, a loja aparece fechada no aplicativo.`,risco:`Loja invisível para o cliente sem ninguém perceber.`,comoCumprimos:`Saúde de cada fonte no rodapé, recuo progressivo sem desligar a fonte e aviso visível quando uma conexão cai.`,severidade:`operacao`,verificacao:`no-codigo`},{id:`keeta-assinatura`,plataforma:`keeta`,titulo:`Assinar todas as chamadas da Keeta`,exigencia:`Cada requisição leva assinatura (resumo criptográfico) calculada sobre os parâmetros ordenados e o corpo normalizado.`,risco:`Chamada recusada; integração não passa nos testes conjuntos.`,comoCumprimos:`Gerador de assinatura próprio, com teste dedicado (src/core/adapters/keeta/signature.ts).`,severidade:`homologacao`,verificacao:`no-codigo`},{id:`sem-regressao-de-status`,plataforma:`todas`,titulo:`Nunca voltar o status na plataforma`,exigencia:`O
